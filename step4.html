<html lang="en">
<head>
<meta charset="utf-8">

<title>Mosim — Plan your trip · Step 4, Comfort &amp; food</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --ivory:#F7F2EA; --ivory-soft:#FBF8F2; --navy:#1B2A4A; --navy-soft:#2A3C5E; --gold:#C39A3F; --gold-soft:#D9BD7E; --ink:#54514B; --ink-2:#8A8479; --line:#E5DBC8; }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{-webkit-text-size-adjust:100%;}
  body{background:var(--ivory); color:var(--navy); font-family:'Inter',-apple-system,system-ui,sans-serif; -webkit-font-smoothing:antialiased; line-height:1.5; padding-bottom:124px;}
  :focus-visible{ outline:2px solid var(--navy); outline-offset:2px; border-radius:4px; }
  .wrap{max-width:1200px; margin:0 auto; padding:0 36px;}
  h1,.brand{font-family:'Lora',Georgia,serif;}
  a{color:inherit;}

  nav{padding:18px 0; border-bottom:1px solid var(--line);}
  .nav-in{display:flex; align-items:center; justify-content:space-between;}
  .brand{font-weight:600; font-size:22px; color:var(--navy); text-decoration:none;} .brand .dot{color:var(--gold);}
  .exit{font-size:15px; color:var(--ink); text-decoration:none; white-space:nowrap;}
  @media(max-width:600px){ .exit{display:none;} }
  .nav-right{display:flex; align-items:center; gap:18px;}
  .nav-signin{ font-size:15px; font-weight:600; color:var(--navy); background:#fff; border:1.5px solid var(--gold); border-radius:999px; padding:9px 18px; min-height:44px; display:inline-flex; align-items:center; text-decoration:none; white-space:nowrap; }
  .nav-signin:hover{ background:var(--ivory-soft); }
  .nav-cta{ font-size:15px; font-weight:600; color:#fff; background:var(--navy); border:1.5px solid var(--navy); border-radius:999px; padding:9px 18px; min-height:44px; display:inline-flex; align-items:center; text-decoration:none; white-space:nowrap; }
  .nav-cta:hover{ background:var(--navy-soft); }
  .nav-div{ width:1px; height:22px; background:var(--ink-2); display:inline-block; flex:none; }

  .head{text-align:center; padding:50px 0 6px;}
  .step-label{font-size:13px; font-weight:600; letter-spacing:2px; text-transform:uppercase; color:var(--gold);}
  .progress{display:flex; gap:8px; justify-content:center; margin:18px auto 28px; max-width:280px;}
  .progress span{flex:1; height:5px; border-radius:99px; background:var(--line);}
  .progress span.done{background:var(--gold-soft);}
  .progress span.now{background:var(--navy);}
  .head h1{font-size:clamp(30px,4.5vw,40px); font-weight:600; line-height:1.12; text-wrap:balance;}
  .head p{font-size:19px; color:var(--ink); max-width:none; margin:16px auto 0; line-height:1.6; text-wrap:balance;}

  .field{margin:36px 0;}
  .field .q{font-size:19px; font-weight:600; color:var(--navy); margin-bottom:14px;}
  .chip-group{display:flex; flex-wrap:wrap; gap:10px;}
  .chip{font-size:19px; border:2px solid var(--line); background:#fff; border-radius:999px; padding:12px 22px; cursor:pointer; color:var(--navy); min-height:48px; font-family:'Inter',sans-serif;}
  .chip:hover{border-color:var(--gold-soft);}
  .chip.sel{border-color:var(--gold); font-weight:600; box-shadow:0 8px 22px -14px rgba(195,154,63,.6);}
  .custom{margin-top:12px; width:100%; max-width:420px; height:50px; border:2px solid var(--line); border-radius:11px; background:#fff; padding:0 16px; font-size:19px; font-family:'Inter',sans-serif; color:var(--navy);}
  .custom:focus{outline:none; border-color:var(--gold);}

  .footbar{position:fixed; left:0; right:0; bottom:0; background:rgba(247,242,234,.94); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border-top:1px solid var(--line); z-index:10;}
  .fb-in{max-width:1200px; margin:0 auto; padding:16px 36px; display:flex; align-items:center; justify-content:space-between; gap:16px;}
  .back{font-size:16px; color:var(--ink); text-decoration:none; padding:10px 4px; min-height:44px; display:inline-flex; align-items:center;}
  .btn{font-size:17px; font-weight:600; background:var(--navy); color:#fff; border:none; border-radius:10px; padding:15px 30px; min-height:44px; cursor:pointer; font-family:'Inter',sans-serif;}
  .btn:hover{background:var(--navy-soft);}

  @media(max-width:520px){ .head h1{font-size:28px;} }
</style>
<script src="js/analytics.js"></script>
</head>
<body>

<nav><div class="wrap nav-in">
  <a href="index.html" class="brand">Mosim<span class="dot">.</span></a>
  <div class="nav-right">
    <a href="index.html" class="exit">Save &amp; exit</a>
    <a id="nav-auth" href="/signin.html" class="nav-signin">Sign in</a>
    <span class="nav-div" aria-hidden="true"></span>
    <a href="/step1.html" class="nav-cta">Plan my trip</a>
  </div>
</div></nav>

<div class="wrap">
  <div class="head">
    <div class="step-label">Step 4 of 5 · Comfort &amp; food</div>
    <div class="progress"><span class="done"></span><span class="done"></span><span class="done"></span><span class="now"></span><span></span></div>
    <h1>Let's keep you comfortable.</h1>
    <p>So nothing is too much — we plan around your body and your taste, never the clock.</p>
  </div>

  <div class="field">
    <div class="q">Your ideal pace</div>
    <div class="chip-group" data-group="pace">
      <button class="chip" data-value="relaxed" type="button">Relaxed</button>
      <button class="chip" data-value="balanced" type="button">Balanced</button>
      <button class="chip" data-value="full" type="button">Full days</button>
    </div>
  </div>

  <div class="field">
    <div class="q">Getting around</div>
    <div class="chip-group" data-group="mobility">
      <button class="chip" data-value="walks_fine" type="button">I walk fine</button>
      <button class="chip" data-value="tires_easily" type="button">I tire easily</button>
      <button class="chip" data-value="cane_walker" type="button">I use a cane or walker</button>
      <button class="chip" data-value="wheelchair" type="button">I use a wheelchair</button>
    </div>
  </div>

  <div class="field">
    <div class="q">How do you like your food?</div>
    <div class="chip-group" data-group="spice">
      <button class="chip" data-value="mild" type="button">Mild, please</button>
      <button class="chip" data-value="some" type="button">Some spice is fine</button>
      <button class="chip" data-value="love" type="button">I love spicy</button>
    </div>
  </div>

  <div class="field">
    <div class="q">Anything to keep in mind? <span style="font-weight:500;color:var(--ink-2);">(optional)</span></div>
    <div class="chip-group" data-group="food" data-multi>
      <button class="chip" data-value="no_shellfish" type="button">No shellfish</button>
      <button class="chip" data-value="no_pork" type="button">No pork</button>
      <button class="chip" data-value="vegetarian" type="button">Vegetarian</button>
      <button class="chip" data-value="diabetic" type="button">Diabetic-friendly</button>
    </div>
    <input class="custom" id="food-custom" type="text" placeholder="+ add your own (allergies, etc.)">
  </div>
</div>

<div class="footbar"><div class="fb-in">
  <a href="step3.html" class="back">← Back</a>
  <button class="btn" id="continue" type="button">Continue →</button>
</div></div>

<script src="js/state.js"></script>
<script>
  (function () {
    var single = { pace: '', mobility: '', spice: '' };

    document.querySelectorAll('.chip-group').forEach(function (wrap) {
      var group = wrap.getAttribute('data-group');
      var multi = wrap.hasAttribute('data-multi');
      wrap.addEventListener('click', function (ev) {
        var c = ev.target.closest('.chip');
        if (!c) return;
        if (multi) {
          c.classList.toggle('sel');
        } else {
          Array.prototype.forEach.call(wrap.querySelectorAll('.chip'), function (x) {
            x.classList.toggle('sel', x === c);
          });
          single[group] = c.getAttribute('data-value');
        }
      });
    });

    function foodSelected() {
      var wrap = document.querySelector('.chip-group[data-group="food"]');
      var arr = Array.prototype.slice.call(wrap.querySelectorAll('.chip.sel')).map(function (c) { return c.getAttribute('data-value'); });
      var custom = document.getElementById('food-custom').value.trim();
      if (custom) arr.push(custom);
      return arr;
    }

    // restore
    var prior = (window.kwState && kwState.loadStep('comfort')) || null;
    if (prior) {
      ['pace', 'mobility', 'spice'].forEach(function (g) {
        if (prior[g]) {
          var c = document.querySelector('.chip-group[data-group="' + g + '"] .chip[data-value="' + prior[g] + '"]');
          if (c) { c.classList.add('sel'); single[g] = prior[g]; }
        }
      });
      if (prior.food && prior.food.length) {
        var known = {};
        document.querySelectorAll('.chip-group[data-group="food"] .chip').forEach(function (c) { known[c.getAttribute('data-value')] = c; });
        var customParts = [];
        prior.food.forEach(function (v) { if (known[v]) known[v].classList.add('sel'); else customParts.push(v); });
        if (customParts.length) document.getElementById('food-custom').value = customParts.join(', ');
      }
    }

    document.getElementById('continue').addEventListener('click', function () {
      var data = { pace: single.pace, mobility: single.mobility, spice: single.spice, food: foodSelected() };
      if (window.kwState) kwState.saveStep('comfort', data);
      window.location.href = 'step5.html';
    });
  })();
</script>

</body>
</html>
