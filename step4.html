<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>K-Wellness Concierge — Step 4 · Cuisine</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Nanum+Myeongjo:wght@400;700;800&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,700&display=swap" rel="stylesheet" />
<style>
  /* ════════════════════════════════════════════════════════════════════
     Step 3 Culture — inherits Steps 1+2 visual system, but with a
     denser smaller-card grid (4 cols) and paginated browse (50 items
     across 3 pages: Heritage / Crafts / Modern).
     ════════════════════════════════════════════════════════════════════ */
  :root {
    --kw-bg: #ffffff;
    --kw-bg-soft: #f5f5f7;
    --kw-bg-warm: #f0eee9;
    --kw-ink: #1d1d1f;
    --kw-ink-2: #2a2a2c;
    --kw-ink-3: #4a4a4d;
    --kw-line: #d2d2d7;
    --kw-rule: #e8e8ed;
    --kw-accent: #B21464;
    --kw-accent-deep: #8a0e4d;
    --kw-accent-soft: rgba(178,20,100,.08);
    --kw-gold: #b48a3a;
  }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
                 Inter, "Helvetica Neue", Arial, sans-serif;
    font-size: 19px; line-height: 1.5; font-weight: 500;
    color: var(--kw-ink); background: var(--kw-bg);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  .kw-screen { background: var(--kw-bg); color: var(--kw-ink); position: relative; min-height: 100vh; }
  .kw-screen * { box-sizing: border-box; }
  .kw-screen a { color: inherit; text-decoration: none; }
  .kw-screen a.kw-cta { color: #fff; }
  .kw-screen a.kw-cta.kw-cta-ghost { color: var(--kw-ink); }
  .kw-screen button { font: inherit; cursor: pointer; }
  .kw-screen ul { list-style: none; margin: 0; padding: 0; }

  /* Nav (same as Steps 1/2) */
  .kw-nav {
    position: sticky; top: 0; z-index: 50;
    background: rgba(255, 255, 255, .82);
    backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid var(--kw-rule);
    height: 68px;
  }
  .kw-nav-inner {
    height: 100%; max-width: 1440px; margin: 0 auto;
    padding: 0 32px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .kw-brand { display: flex; align-items: center; gap: 12px; }
  .kw-brand .kw-wm { font-weight: 700; font-size: 19px; color: var(--kw-ink); }
  .kw-navlist { display: flex; gap: 22px; font-size: 14px; font-weight: 600; }
  .kw-navlist a { color: var(--kw-ink); padding: 6px 0; position: relative; transition: color .15s; }
  .kw-navlist a:hover { color: var(--kw-accent); }
  .kw-navlist a.is-active { color: var(--kw-accent); }
  .kw-navlist a.is-active::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: -4px;
    height: 2px; background: var(--kw-accent); border-radius: 2px;
  }
  .kw-nav-right { display: flex; align-items: center; gap: 18px; }
  .kw-link-q { font-size: 14px; font-weight: 600; color: var(--kw-ink); }

  /* CTA */
  .kw-cta {
    display: inline-flex; align-items: center; gap: 8px;
    height: 50px; padding: 0 28px;
    border-radius: 999px; border: none;
    background: var(--kw-accent); color: #fff;
    font-weight: 600; font-size: 17px;
    transition: background .2s, transform .1s;
    white-space: nowrap;
  }
  .kw-cta:hover { background: var(--kw-accent-deep); }
  .kw-cta-sm { height: 38px; padding: 0 18px; font-size: 14px; }
  .kw-cta-lg { height: 62px; padding: 0 38px; font-size: 19px; }
  .kw-cta-ghost {
    background: transparent; color: var(--kw-ink);
    border: 1.5px solid var(--kw-line);
  }
  .kw-cta-ghost:hover { background: var(--kw-bg-soft); }

  /* Stepbar */
  .kw-stepbar-horizontal {
    display: flex; align-items: center; padding: 28px 0;
  }
  .kw-step { display: inline-flex; align-items: center; gap: 10px; flex: none; }
  .kw-step-num {
    width: 28px; height: 28px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; letter-spacing: .04em;
    border: 1.5px solid var(--kw-line);
    color: var(--kw-ink-3); background: #fff;
  }
  .kw-step-label { font-size: 14px; font-weight: 600; color: var(--kw-ink-3); }
  .kw-step-active .kw-step-num {
    background: var(--kw-accent); color: #fff; border-color: var(--kw-accent);
  }
  .kw-step-active .kw-step-label { color: var(--kw-ink); }
  .kw-step-done .kw-step-num {
    background: var(--kw-ink); color: #fff; border-color: var(--kw-ink);
    font-size: 13px;
  }
  .kw-step-done .kw-step-label { color: var(--kw-ink); }
  .kw-step-rule {
    flex: 1 1 auto; min-width: 24px;
    height: 1.5px; background: var(--kw-rule);
    margin: 0 14px;
  }

  /* Eyebrow */
  .kw-eyebrow { display: inline-flex; align-items: baseline; gap: 12px; color: var(--kw-accent); }
  .kw-eyebrow-num { font-family: 'Nanum Myeongjo', serif; font-weight: 700; font-size: 13px; letter-spacing: .08em; }
  .kw-eyebrow-text { font-size: 13px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }

  /* Page wrap & hero */
  .kw-wrap { max-width: 1240px; margin: 0 auto; padding: 0 40px; }
  .kw-page-hero { padding: 8px 0 40px; }
  .kw-page-hero h1 {
    font-size: clamp(36px, 4vw, 56px); font-weight: 700;
    letter-spacing: -0.025em; line-height: 1.05;
    margin: 14px 0 16px; color: var(--kw-ink);
  }
  .kw-page-hero h1 .kw-accent { color: var(--kw-accent); }
  .kw-page-hero p {
    font-size: clamp(17px, 1.3vw, 19px); font-weight: 500;
    line-height: 1.45; color: var(--kw-ink-2);
    max-width: 64ch;
  }

  /* Sub-step header (matches Step 2) */
  .kw-substep {
    margin: 8px 0 24px;
    padding: 22px 0 18px;
    border-bottom: 1px solid var(--kw-rule);
    display: flex; align-items: baseline; gap: 24px; flex-wrap: wrap;
  }
  .kw-substep-l { display: flex; align-items: baseline; gap: 20px; flex: 1 1 auto; min-width: 0; }
  .kw-substep-numeral {
    font-family: 'Playfair Display', serif; font-weight: 700; font-style: italic;
    font-size: 13px; color: var(--kw-accent);
    letter-spacing: .18em; text-transform: uppercase;
    white-space: nowrap;
  }
  .kw-substep-title {
    font-size: clamp(28px, 2.4vw, 36px); font-weight: 700;
    letter-spacing: -0.024em; line-height: 1.1; color: var(--kw-ink);
  }
  .kw-substep-hint {
    font-size: 14px; font-weight: 500; color: var(--kw-ink-3);
    flex: 0 1 360px; text-align: right; line-height: 1.45;
    white-space: nowrap;
  }

  /* Q-row (same pattern as Step 1/2) */
  .kw-q-row {
    display: grid;
    grid-template-columns: 360px 1fr;
    gap: 48px;
    padding: 40px 0;
    border-top: 1px solid var(--kw-rule);
  }
  .kw-q-row:first-of-type { border-top: none; padding-top: 16px; }
  .kw-q-row-full { grid-template-columns: 1fr; }
  .kw-substep + .kw-q-row { border-top: none; padding-top: 24px; }
  .kw-q-title {
    font-size: 26px; font-weight: 700;
    letter-spacing: -0.018em; line-height: 1.15;
    margin: 10px 0; color: var(--kw-ink);
    white-space: nowrap;
  }
  .kw-q-help { font-size: 14px; font-weight: 500; color: var(--kw-ink-3); line-height: 1.45; }
  .kw-q-input { min-width: 0; }

  /* Notes-card (matches Step 2) — for the optional notes section */
  .kw-notes-card {
    background: var(--kw-bg-warm);
    border: 1px solid var(--kw-line);
    border-radius: 18px;
    padding: 20px 22px 22px;
    box-shadow: inset 4px 0 0 var(--kw-accent);
  }
  .kw-notes-card-head {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; margin-bottom: 14px;
  }
  .kw-notes-card-label {
    display: inline-flex; align-items: center; gap: 10px;
    font-size: 12px; font-weight: 700;
    letter-spacing: .14em; color: var(--kw-accent);
    text-transform: uppercase;
  }
  .kw-notes-card-pen {
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--kw-accent); color: #fff;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700;
  }
  .kw-notes-card-secure {
    font-size: 11px; font-weight: 600;
    color: var(--kw-ink-3); letter-spacing: .04em;
  }
  .kw-notes-card .kw-textarea {
    width: 100%;
    background: #fff;
    border: 1.5px solid var(--kw-line);
    border-radius: 12px;
    min-height: 120px;
    padding: 18px 20px;
    font: inherit;
    font-size: 16px; color: var(--kw-ink);
    line-height: 1.5; resize: vertical;
  }
  .kw-notes-card .kw-textarea:focus {
    border-color: var(--kw-accent);
    box-shadow: 0 0 0 3px var(--kw-accent-soft);
    outline: none;
  }
  .kw-notes-card-foot {
    margin-top: 12px;
    font-size: 12px; font-weight: 500; color: var(--kw-ink-3);
  }

  /* Action bar */
  .kw-actionbar {
    margin-top: 56px; padding: 28px 0 48px;
    border-top: 1px solid var(--kw-rule);
    display: flex; align-items: center; justify-content: space-between;
    gap: 24px;
  }
  .kw-actionbar-l { display: flex; align-items: center; gap: 14px; }
  .kw-actionbar-note { font-size: 13px; font-weight: 500; color: var(--kw-ink-3); }

  /* ════════════════════════════════════════════════════════════════════
     Page tabs — Heritage / Crafts / Modern
     ════════════════════════════════════════════════════════════════════ */
  .kw-pagetabs {
    display: flex; align-items: stretch; gap: 0;
    border-bottom: 1px solid var(--kw-rule);
    margin-bottom: 28px;
  }
  .kw-pagetab {
    background: transparent; border: none;
    padding: 16px 28px 18px;
    display: flex; flex-direction: column; gap: 4px;
    text-align: left;
    cursor: pointer;
    color: var(--kw-ink-3);
    position: relative;
    transition: color .15s;
  }
  .kw-pagetab:hover { color: var(--kw-ink); }
  .kw-pagetab.is-active { color: var(--kw-ink); }
  .kw-pagetab.is-active::after {
    content: ""; position: absolute;
    left: 0; right: 0; bottom: -1px;
    height: 2px; background: var(--kw-accent);
  }
  .kw-pagetab-num {
    font-family: 'Playfair Display', serif;
    font-style: italic; font-weight: 700;
    font-size: 12px;
    letter-spacing: .18em; text-transform: uppercase;
    color: var(--kw-accent);
  }
  .kw-pagetab-label {
    font-size: 19px; font-weight: 700;
    letter-spacing: -0.012em;
    line-height: 1.1;
  }
  .kw-pagetab-count {
    font-family: 'Inter', sans-serif;
    font-weight: 500; font-size: 13px;
    color: var(--kw-ink-3);
    margin-left: 8px;
  }
  .kw-pagetab.is-active .kw-pagetab-count { color: var(--kw-accent); }

  /* ════════════════════════════════════════════════════════════════════
     Culture-tile grid — denser, smaller cards (4 cols)
     ════════════════════════════════════════════════════════════════════ */
  .kw-cul-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
  }
  .kw-cul {
    position: relative;
    background: #fff;
    border: 1px solid var(--kw-rule);
    border-radius: 16px;
    overflow: hidden;
    cursor: pointer;
    transition: transform .25s cubic-bezier(.2,.7,.3,1),
                box-shadow .25s, border-color .25s;
    display: flex; flex-direction: column;
  }
  .kw-cul:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 28px -10px rgba(0,0,0,.18), 0 2px 8px rgba(0,0,0,.04);
    border-color: rgba(0,0,0,.08);
  }
  .kw-cul.is-selected {
    border-color: var(--kw-accent);
    box-shadow: 0 0 0 2px var(--kw-accent),
                0 10px 28px -10px rgba(178,20,100,.25);
  }
  .kw-cul-photo {
    position: relative;
    aspect-ratio: 4 / 3;
    background: linear-gradient(135deg, var(--photo-a, #e8e8ed) 0%, var(--photo-b, #c5c5cc) 60%, var(--photo-c, #a5a5ac) 100%);
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  .kw-cul-photo::before {
    content: ""; position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 140% 60% at 50% 0%, rgba(255,255,255,.3), transparent 60%),
      radial-gradient(ellipse 100% 50% at 50% 100%, rgba(0,0,0,.12), transparent 60%);
    pointer-events: none;
  }
  .kw-cul-photo::after {
    content: ""; position: absolute; inset: 10px;
    border: 1px solid rgba(255,255,255,.16);
    border-radius: 6px;
    pointer-events: none;
  }
  .kw-cul-monogram {
    position: relative; z-index: 1;
    font-family: 'Playfair Display', serif;
    font-weight: 700; font-style: italic;
    font-size: 48px;
    color: var(--photo-fg, rgba(0,0,0,.35));
    letter-spacing: -0.04em;
    line-height: 1; opacity: .6;
  }
  .kw-cul-view {
    position: absolute;
    top: 10px; right: 10px;
    z-index: 2;
    height: 24px;
    padding: 0 10px;
    border-radius: 999px;
    background: rgba(255,255,255,.92);
    backdrop-filter: blur(8px);
    color: var(--kw-ink);
    font-size: 10px; font-weight: 700;
    letter-spacing: .08em; text-transform: uppercase;
    display: inline-flex; align-items: center; gap: 4px;
    box-shadow: 0 1px 3px rgba(0,0,0,.08);
    opacity: 0;
    transform: translateY(-4px);
    transition: opacity .2s, transform .2s;
    pointer-events: none;
  }
  .kw-cul:hover .kw-cul-view {
    opacity: 1; transform: translateY(0);
  }
  .kw-cul-body {
    padding: 14px 16px 14px;
    display: flex; flex-direction: column;
    gap: 8px; flex: 1;
  }
  .kw-cul-eyebrow {
    font-size: 10px; font-weight: 700;
    letter-spacing: .14em; text-transform: uppercase;
    color: var(--kw-ink-3);
  }
  .kw-cul.is-selected .kw-cul-eyebrow { color: var(--kw-accent); }
  .kw-cul-name {
    font-size: 15px; font-weight: 700;
    color: var(--kw-ink);
    letter-spacing: -0.012em;
    line-height: 1.2;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .kw-cul-foot {
    margin-top: auto;
    display: flex; align-items: center; justify-content: space-between;
    padding-top: 10px;
    border-top: 1px solid var(--kw-rule);
    gap: 8px;
  }
  .kw-cul-meta {
    font-size: 11px; font-weight: 600;
    color: var(--kw-ink-3);
    letter-spacing: .01em;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .kw-cul-add {
    display: inline-flex; align-items: center; justify-content: center;
    gap: 4px;
    height: 28px;
    padding: 0 10px;
    border-radius: 999px;
    background: var(--kw-ink); color: #fff; border: none;
    font-size: 11px; font-weight: 700;
    letter-spacing: .02em;
    cursor: pointer;
    transition: background .15s, transform .15s, box-shadow .15s;
    flex: none;
  }
  .kw-cul-add:hover {
    background: var(--kw-accent);
    transform: translateY(-1px);
  }
  .kw-cul-add-plus { font-size: 13px; font-weight: 500; line-height: 1; }
  .kw-cul.is-selected .kw-cul-add {
    background: var(--kw-accent-soft);
    color: var(--kw-accent);
    box-shadow: inset 0 0 0 1.5px var(--kw-accent);
  }
  .kw-cul.is-selected .kw-cul-add:hover {
    background: var(--kw-accent); color: #fff;
  }

  /* ════════════════════════════════════════════════════════════════════
     Food & Beverage photo palettes — each a distinct edible mood.
     Stew = bubbling red. Grill = smoky char. Tea = warm green. etc.
     ════════════════════════════════════════════════════════════════════ */
  .kw-photo-stew      { --photo-a:#f3d6c0; --photo-b:#d6612a; --photo-c:#7a2014; --photo-fg:#3a0a08; }
  .kw-photo-soup      { --photo-a:#f1e6c8; --photo-b:#c9a55c; --photo-c:#7a5520; --photo-fg:#3a2410; }
  .kw-photo-rice      { --photo-a:#f5ecd8; --photo-b:#d4b97a; --photo-c:#8a6c34; --photo-fg:#3a2a10; }
  .kw-photo-noodle    { --photo-a:#ece4d0; --photo-b:#b8a070; --photo-c:#6a4f28; --photo-fg:#2a1f0e; }
  .kw-photo-bbq       { --photo-a:#ddc4b0; --photo-b:#a35a3a; --photo-c:#4e1f14; --photo-fg:#2a0a04; }
  .kw-photo-fried     { --photo-a:#f4dca2; --photo-b:#d4972a; --photo-c:#7a4a14; --photo-fg:#3a2008; }
  .kw-photo-seafood   { --photo-a:#d2e2ec; --photo-b:#6a92b4; --photo-c:#1f3e62; --photo-fg:#0a1e3a; }
  .kw-photo-banchan   { --photo-a:#e8dccc; --photo-b:#b08a5a; --photo-c:#5a3e1f; --photo-fg:#2a1a08; }
  .kw-photo-veg       { --photo-a:#dde8c8; --photo-b:#8aa460; --photo-c:#3e5520; --photo-fg:#1a2410; }
  .kw-photo-sweet     { --photo-a:#f3dfde; --photo-b:#d68a90; --photo-c:#8a2e3e; --photo-fg:#3a0a1e; }
  .kw-photo-tea-h     { --photo-a:#dfe8cc; --photo-b:#9aae6e; --photo-c:#4e5e2a; --photo-fg:#1a2410; }
  .kw-photo-makgeolli { --photo-a:#f1ebd8; --photo-b:#cabd92; --photo-c:#7a6a3c; --photo-fg:#2a200e; }
  .kw-photo-soju      { --photo-a:#d2e5dc; --photo-b:#6c9c8a; --photo-c:#1f4e3e; --photo-fg:#0a1e1a; }
  .kw-photo-coffee    { --photo-a:#e0d2bf; --photo-b:#9a704a; --photo-c:#3a1e10; --photo-fg:#1a0a04; }
  .kw-photo-cocktail  { --photo-a:#e6d4e0; --photo-b:#a672a0; --photo-c:#4e1a4e; --photo-fg:#1f0a2a; }
  .kw-photo-michelin  { --photo-a:#1a1612; --photo-b:#3a2e1e; --photo-c:#0e0a08; --photo-fg:#e0c878; }
  .kw-photo-temple-c  { --photo-a:#d6dcc8; --photo-b:#8a9472; --photo-c:#3e4628; --photo-fg:#14180a; }
  .kw-photo-market-c  { --photo-a:#f0d8b0; --photo-b:#d49a4a; --photo-c:#7a3e0e; --photo-fg:#3a1604; }

  /* Per-category photo palettes — earthy, royal, modern */
  .kw-photo-heritage  { --photo-a:#e8e3dc; --photo-b:#c4ad84; --photo-c:#8b6f3f; --photo-fg:#3a2a14; }
  .kw-photo-palace    { --photo-a:#f0e5d0; --photo-b:#d4ad6b; --photo-c:#8b3a2a; --photo-fg:#3a1a1a; }
  .kw-photo-hanok     { --photo-a:#e8dcc7; --photo-b:#b8945f; --photo-c:#5a3a1e; --photo-fg:#2a1a0a; }
  .kw-photo-temple    { --photo-a:#d9d0bf; --photo-b:#9a8268; --photo-c:#5a4632; --photo-fg:#2a1f12; }
  .kw-photo-museum    { --photo-a:#dfdde4; --photo-b:#a8a4b8; --photo-c:#5e5a7c; --photo-fg:#1a1a3a; }
  .kw-photo-garden    { --photo-a:#d2dcc4; --photo-b:#92a374; --photo-c:#4a5a36; --photo-fg:#1a2a14; }
  .kw-photo-crafts    { --photo-a:#ecd9bf; --photo-b:#c4955e; --photo-c:#7a5530; --photo-fg:#3a2410; }
  .kw-photo-tea       { --photo-a:#d8e1c8; --photo-b:#94a872; --photo-c:#4a5a36; --photo-fg:#1a2a14; }
  .kw-photo-spa       { --photo-a:#d4e0e2; --photo-b:#88aab0; --photo-c:#3f6066; --photo-fg:#1a3a3e; }
  .kw-photo-nature    { --photo-a:#cfd9c4; --photo-b:#7a8e62; --photo-c:#3a4628; --photo-fg:#1a2410; }
  .kw-photo-music     { --photo-a:#e0d6e4; --photo-b:#9c8eac; --photo-c:#54467a; --photo-fg:#1f1a3a; }
  .kw-photo-perform   { --photo-a:#e6c8d4; --photo-b:#b87090; --photo-c:#6a1a3e; --photo-fg:#3a0a1e; }
  .kw-photo-kpop      { --photo-a:#e8d4e6; --photo-b:#c08bca; --photo-c:#722f7e; --photo-fg:#3a0a3e; }
  .kw-photo-market    { --photo-a:#f0d8c4; --photo-b:#d49a64; --photo-c:#8a4a2a; --photo-fg:#3a1a10; }
  .kw-photo-modern    { --photo-a:#d4d7e0; --photo-b:#8c92a8; --photo-c:#3a4060; --photo-fg:#0e1430; }
  .kw-photo-dmz       { --photo-a:#d4d0c4; --photo-b:#8a8278; --photo-c:#3a3630; --photo-fg:#1a1814; }
  .kw-photo-shop      { --photo-a:#f0dfe6; --photo-b:#cf8aa6; --photo-c:#7a2a4e; --photo-fg:#3a0f24; }
  .kw-photo-sport     { --photo-a:#d4e3d0; --photo-b:#82a878; --photo-c:#2e4a26; --photo-fg:#0e2410; }
  .kw-photo-jeju      { --photo-a:#d8efe8; --photo-b:#62b09e; --photo-c:#1f4a3e; --photo-fg:#0a2418; }
  .kw-photo-ocean     { --photo-a:#d4e2ec; --photo-b:#6e9cba; --photo-c:#1a3e5e; --photo-fg:#0a1e3a; }

  /* ════════════════════════════════════════════════════════════════════
     Top packages — "I don't know, just pick one for me" preset bundles
     ════════════════════════════════════════════════════════════════════ */
  .kw-pkg-band {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 18px; flex-wrap: wrap;
    margin: 0 0 14px;
  }
  .kw-pkg-band-l {
    display: flex; align-items: baseline; gap: 14px;
    flex: 1 1 auto; min-width: 0;
  }
  .kw-pkg-band-eyebrow {
    font-family: 'Playfair Display', serif;
    font-weight: 700; font-style: italic;
    font-size: 12px; letter-spacing: .18em;
    text-transform: uppercase; color: var(--kw-accent);
    white-space: nowrap;
  }
  .kw-pkg-band-title {
    font-size: 20px; font-weight: 700;
    color: var(--kw-ink); letter-spacing: -0.012em;
  }
  .kw-pkg-band-hint {
    font-size: 13px; font-weight: 500;
    color: var(--kw-ink-3); line-height: 1.4;
  }

  .kw-pkg-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    margin-bottom: 36px;
  }
  .kw-pkg {
    position: relative;
    background: #fff;
    border: 1px solid var(--kw-rule);
    border-radius: 18px;
    overflow: hidden;
    cursor: pointer;
    display: flex; flex-direction: column;
    transition: transform .25s cubic-bezier(.2,.7,.3,1),
                box-shadow .25s, border-color .25s;
  }
  .kw-pkg:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 32px -10px rgba(0,0,0,.18), 0 2px 8px rgba(0,0,0,.04);
    border-color: rgba(0,0,0,.1);
  }
  .kw-pkg.is-selected {
    border-color: var(--kw-accent);
    box-shadow: 0 0 0 2px var(--kw-accent),
                0 12px 32px -10px rgba(178,20,100,.25);
  }
  .kw-pkg-banner {
    position: relative;
    height: 92px;
    background: linear-gradient(135deg, var(--photo-a) 0%, var(--photo-b) 60%, var(--photo-c) 100%);
    overflow: hidden;
    display: flex; align-items: center; padding: 0 22px;
    color: var(--photo-fg);
  }
  .kw-pkg-banner::before {
    content: "";
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 140% 60% at 50% 0%, rgba(255,255,255,.32), transparent 60%),
      radial-gradient(ellipse 100% 50% at 50% 100%, rgba(0,0,0,.12), transparent 60%);
    pointer-events: none;
  }
  .kw-pkg-banner-letter {
    position: relative; z-index: 1;
    font-family: 'Playfair Display', serif;
    font-weight: 700; font-style: italic;
    font-size: 56px;
    line-height: 1; letter-spacing: -0.04em;
    opacity: .55;
    flex: none;
  }
  .kw-pkg-banner-cap {
    position: relative; z-index: 1;
    margin-left: auto;
    font-family: 'Playfair Display', serif;
    font-style: italic; font-weight: 600;
    font-size: 11px; letter-spacing: .12em;
    text-transform: uppercase;
    opacity: .8;
  }
  .kw-pkg-body {
    padding: 18px 22px 22px;
    display: flex; flex-direction: column; gap: 12px;
    flex: 1;
  }
  .kw-pkg-name {
    font-size: 19px; font-weight: 700;
    color: var(--kw-ink);
    letter-spacing: -0.018em; line-height: 1.15;
  }
  .kw-pkg-desc {
    font-size: 13px; font-weight: 500;
    color: var(--kw-ink-3); line-height: 1.45;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .kw-pkg-includes {
    display: flex; flex-wrap: wrap; gap: 4px 6px;
  }
  .kw-pkg-chip {
    font-size: 11px; font-weight: 600;
    padding: 4px 9px;
    border-radius: 999px;
    background: var(--kw-bg-soft);
    color: var(--kw-ink-2);
    line-height: 1.3;
    white-space: nowrap;
  }
  .kw-pkg.is-selected .kw-pkg-chip {
    background: var(--kw-accent-soft);
    color: var(--kw-accent);
  }
  .kw-pkg-foot {
    margin-top: auto;
    display: flex; align-items: center; justify-content: space-between;
    padding-top: 14px;
    border-top: 1px solid var(--kw-rule);
    gap: 12px;
  }
  .kw-pkg-meta {
    font-size: 12px; font-weight: 600;
    color: var(--kw-ink-3);
    letter-spacing: .01em;
  }
  .kw-pkg-cta {
    display: inline-flex; align-items: center; justify-content: center;
    height: 32px;
    padding: 0 14px;
    border-radius: 999px;
    background: var(--kw-ink); color: #fff;
    border: none;
    font-size: 12px; font-weight: 700;
    letter-spacing: .02em;
    white-space: nowrap;
    cursor: pointer;
    transition: background .15s, transform .15s;
  }

  /* ═════════════════════════════════════════════════════════════════
     City cards — Page Ⅳ Beyond Seoul. One card per city.
     ═════════════════════════════════════════════════════════════════ */
  .kw-city-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
  }
  .kw-city {
    background: #fff;
    border: 1px solid var(--kw-rule);
    border-radius: 20px;
    overflow: hidden;
    cursor: pointer;
    display: flex; flex-direction: column;
    transition: transform .25s cubic-bezier(.2,.7,.3,1),
                box-shadow .25s, border-color .25s;
  }
  .kw-city:hover {
    transform: translateY(-3px);
    box-shadow: 0 16px 40px -12px rgba(0,0,0,.18), 0 4px 12px rgba(0,0,0,.04);
    border-color: rgba(0,0,0,.08);
  }
  .kw-city-photo {
    position: relative;
    aspect-ratio: 5 / 3;
    background: linear-gradient(135deg, var(--photo-a) 0%, var(--photo-b) 60%, var(--photo-c) 100%);
    overflow: hidden;
    display: flex; align-items: center; padding: 0 24px;
    color: var(--photo-fg);
  }
  .kw-city-photo::before {
    content: ""; position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 140% 60% at 50% 0%, rgba(255,255,255,.32), transparent 60%),
      radial-gradient(ellipse 100% 50% at 50% 100%, rgba(0,0,0,.12), transparent 60%);
    pointer-events: none;
  }
  .kw-city-photo::after {
    content: ""; position: absolute; inset: 14px;
    border: 1px solid rgba(255,255,255,.2);
    border-radius: 8px;
    pointer-events: none;
  }
  .kw-city-monogram {
    position: relative; z-index: 1;
    font-family: 'Playfair Display', serif;
    font-weight: 700; font-style: italic;
    font-size: 80px;
    letter-spacing: -0.04em;
    line-height: 1;
    opacity: .55;
  }
  .kw-city-photo-region {
    position: relative; z-index: 1;
    margin-left: auto;
    font-family: 'Playfair Display', serif;
    font-style: italic; font-weight: 600;
    font-size: 12px; letter-spacing: .12em;
    text-transform: uppercase;
    opacity: .85;
    text-align: right;
    max-width: 60%;
  }
  .kw-city-body {
    padding: 22px 24px 22px;
    display: flex; flex-direction: column;
    gap: 14px;
    flex: 1;
  }
  .kw-city-name {
    font-size: 26px; font-weight: 700;
    color: var(--kw-ink);
    letter-spacing: -0.022em; line-height: 1.1;
  }
  .kw-city-desc {
    margin: 0;
    font-size: 13px; font-weight: 500;
    color: var(--kw-ink-3); line-height: 1.45;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .kw-city-acts {
    display: flex; flex-wrap: wrap; gap: 5px 6px;
  }
  .kw-city-chip {
    font-size: 11px; font-weight: 600;
    padding: 4px 9px;
    border-radius: 999px;
    background: var(--kw-bg-soft);
    color: var(--kw-ink-2);
    line-height: 1.3;
    white-space: nowrap;
  }
  .kw-city-foot {
    margin-top: auto;
    padding-top: 14px;
    border-top: 1px solid var(--kw-rule);
    display: flex; align-items: center; justify-content: space-between;
  }
  .kw-city-count {
    font-size: 12px; font-weight: 700;
    color: var(--kw-ink-3);
    letter-spacing: .04em;
  }
  .kw-city-cta {
    font-size: 13px; font-weight: 700;
    color: var(--kw-accent);
    white-space: nowrap;
  }
  .kw-city-cta:hover { text-decoration: underline; text-underline-offset: 3px; }
  .kw-pkg-cta:hover {
    background: var(--kw-accent);
    transform: translateY(-1px);
  }
  .kw-pkg.is-selected .kw-pkg-cta {
    background: var(--kw-accent-soft);
    color: var(--kw-accent);
    box-shadow: inset 0 0 0 1.5px var(--kw-accent);
  }
  .kw-pkg.is-selected .kw-pkg-cta:hover {
    background: var(--kw-accent); color: #fff;
  }

  /* Per-package palettes */
  .kw-pkg-classic   { --photo-a:#f0e5d0; --photo-b:#c4a16b; --photo-c:#7a4a2a; --photo-fg:#2a1a0a; }
  .kw-pkg-kwave     { --photo-a:#e8d4e6; --photo-b:#b87cc4; --photo-c:#5a1a78; --photo-fg:#2a0a3e; }
  .kw-pkg-quiet     { --photo-a:#d2dcc4; --photo-b:#7a8e62; --photo-c:#3a4628; --photo-fg:#1a2410; }

  /* "Or browse individually" divider */
  .kw-or-divider {
    display: flex; align-items: center; gap: 16px;
    margin: 8px 0 24px;
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 13px;
    color: var(--kw-ink-3);
    letter-spacing: .04em;
  }
  .kw-or-divider::before,
  .kw-or-divider::after {
    content: ""; flex: 1; height: 1px; background: var(--kw-rule);
  }

  /* ════════════════════════════════════════════════════════════════════
     Pagination
     ════════════════════════════════════════════════════════════════════ */
  .kw-pagination {
    grid-column: 1 / -1;
    margin-top: 12px;
    padding: 22px 0 4px;
    display: flex; align-items: center; justify-content: center;
    gap: 6px;
  }
  .kw-pagination-btn {
    height: 38px;
    min-width: 38px;
    padding: 0 12px;
    border-radius: 999px;
    border: 1.5px solid var(--kw-line);
    background: #fff;
    color: var(--kw-ink);
    font-size: 14px; font-weight: 600;
    display: inline-flex; align-items: center; justify-content: center;
    gap: 6px;
    cursor: pointer;
    transition: border-color .15s, background .15s, color .15s;
  }
  .kw-pagination-btn:hover:not(:disabled) {
    border-color: var(--kw-ink);
  }
  .kw-pagination-btn:disabled {
    opacity: .35; cursor: not-allowed;
  }
  .kw-pagination-num {
    background: transparent;
    border: none;
    color: var(--kw-ink-3);
    font-weight: 700;
  }
  .kw-pagination-num:hover { color: var(--kw-ink); }
  .kw-pagination-num.is-active {
    background: var(--kw-ink); color: #fff;
    border-color: var(--kw-ink);
  }
  .kw-pagination-info {
    margin: 0 16px;
    font-size: 13px; font-weight: 500;
    color: var(--kw-ink-3);
  }

  /* ════════════════════════════════════════════════════════════════════
     Basket — same pattern as Step 2
     ════════════════════════════════════════════════════════════════════ */
  .kw-cul-basket {
    grid-column: 1 / -1;
    background: var(--kw-bg-warm);
    border-radius: 20px;
    padding: 22px 26px 24px;
    margin-top: 24px;
    display: flex; flex-direction: column; gap: 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,.04),
                inset 0 1px 0 rgba(255,255,255,.5);
    position: relative;
  }
  .kw-cul-basket::before {
    content: "";
    position: absolute;
    top: 0; left: 26px;
    width: 48px; height: 3px;
    background: var(--kw-accent);
    border-radius: 0 0 3px 3px;
  }
  .kw-basket-head {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 16px;
  }
  .kw-basket-eyebrow {
    font-family: 'Playfair Display', serif;
    font-weight: 700; font-style: italic;
    font-size: 13px; letter-spacing: .18em;
    text-transform: uppercase; color: var(--kw-accent);
  }
  .kw-basket-count {
    color: var(--kw-ink-3); font-weight: 500; font-style: normal;
    letter-spacing: .04em; margin-left: 6px;
  }
  .kw-basket-clear {
    font-size: 13px; font-weight: 600; color: var(--kw-accent);
    cursor: pointer;
  }
  .kw-basket-clear:hover { text-decoration: underline; text-underline-offset: 3px; }
  .kw-basket-items {
    display: flex; flex-wrap: wrap; gap: 10px;
  }
  .kw-basket-item {
    display: flex; align-items: center; gap: 12px;
    background: #fff;
    border: 1px solid var(--kw-rule);
    border-radius: 12px;
    padding: 8px 10px 8px 8px;
    min-width: 0;
    transition: border-color .15s, box-shadow .15s;
  }
  .kw-basket-item:hover {
    border-color: var(--kw-line);
    box-shadow: 0 2px 8px rgba(0,0,0,.05);
  }
  .kw-basket-thumb {
    width: 36px; height: 36px;
    border-radius: 8px;
    background: linear-gradient(135deg, var(--photo-a) 0%, var(--photo-b) 60%, var(--photo-c) 100%);
    display: flex; align-items: center; justify-content: center;
    flex: none;
    font-family: 'Playfair Display', serif;
    font-style: italic; font-weight: 700;
    font-size: 15px; color: var(--photo-fg);
    letter-spacing: -0.02em;
  }
  .kw-basket-item-info {
    display: flex; flex-direction: column; gap: 1px;
    min-width: 0;
  }
  .kw-basket-item-name {
    font-size: 13px; font-weight: 700; color: var(--kw-ink);
    letter-spacing: -0.005em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    max-width: 200px;
  }
  .kw-basket-item-meta {
    font-size: 10px; font-weight: 600; color: var(--kw-ink-3);
    letter-spacing: .01em;
  }
  .kw-basket-item-remove {
    width: 22px; height: 22px; border-radius: 50%;
    background: transparent; border: none;
    color: var(--kw-ink-3);
    font-size: 16px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: background .15s, color .15s;
    margin-left: 2px;
  }
  .kw-basket-item-remove:hover {
    background: var(--kw-accent); color: #fff;
  }
  .kw-basket-add {
    display: inline-flex; align-items: center; gap: 8px;
    height: 52px; padding: 0 18px;
    border-radius: 12px;
    border: 1.5px dashed var(--kw-line);
    color: var(--kw-ink-3);
    font-size: 13px; font-weight: 600;
    transition: border-color .15s, color .15s, background .15s;
  }
  .kw-basket-add:hover {
    border-color: var(--kw-accent); color: var(--kw-accent);
    background: rgba(178,20,100,.04);
  }
  .kw-basket-add-icon {
    width: 20px; height: 20px; border-radius: 50%;
    background: var(--kw-ink-3); color: #fff;
    display: inline-flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 13px;
    transition: background .15s;
  }
  .kw-basket-add:hover .kw-basket-add-icon { background: var(--kw-accent); }

  /* ════════════════════════════════════════════════════════════════════
     Dietary section — allergens (compact) + diet/religion (richer)
     ════════════════════════════════════════════════════════════════════ */
  /* Dietary section row layout — full-width container with question header + grid */
  .kw-diet-section { display: flex; flex-direction: column; gap: 18px; }
  .kw-diet-header {
    display: grid;
    grid-template-columns: 360px 1fr;
    gap: 96px;
    align-items: baseline;
  }
  .kw-diet-header-help {
    font-size: 15px; font-weight: 500;
    color: var(--kw-ink-3); line-height: 1.5;
  }

  .kw-allergen-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 10px;
  }
  .kw-allergen {
    background: #fff;
    border: 1.5px solid var(--kw-rule);
    border-radius: 14px;
    padding: 14px 14px 14px 16px;
    display: flex; align-items: center; gap: 12px;
    cursor: pointer;
    transition: border-color .15s, background .15s, box-shadow .15s, transform .15s;
    text-align: left;
    position: relative;
    min-height: 78px;
  }
  .kw-allergen:hover {
    border-color: var(--kw-line);
    transform: translateY(-1px);
    box-shadow: 0 4px 14px -8px rgba(0,0,0,.18);
  }
  .kw-allergen.is-selected {
    border-color: var(--kw-accent);
    background: var(--kw-accent-soft);
    box-shadow: inset 4px 0 0 var(--kw-accent);
    padding-left: 18px;
  }
  .kw-allergen-mono {
    width: 38px; height: 38px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--photo-a) 0%, var(--photo-b) 60%, var(--photo-c) 100%);
    display: flex; align-items: center; justify-content: center;
    flex: none;
    font-family: 'Playfair Display', serif;
    font-style: italic; font-weight: 700;
    font-size: 18px;
    color: var(--photo-fg);
    letter-spacing: -0.02em;
    opacity: .9;
  }
  .kw-allergen-info { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1 1 auto; overflow: hidden; }
  .kw-allergen-name {
    font-size: 14px; font-weight: 700; color: var(--kw-ink);
    letter-spacing: -0.006em; line-height: 1.15;
  }
  .kw-allergen-sub {
    font-size: 11px; font-weight: 500;
    color: var(--kw-ink-3); line-height: 1.35;
  }
  .kw-allergen.is-selected .kw-allergen-sub { color: var(--kw-accent-deep); }
  .kw-allergen-check {
    width: 22px; height: 22px; border-radius: 50%;
    border: 1.5px solid var(--kw-line);
    background: #fff;
    flex: none;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; color: transparent;
    transition: background .15s, color .15s, border-color .15s;
  }
  .kw-allergen.is-selected .kw-allergen-check {
    background: var(--kw-accent); border-color: var(--kw-accent);
    color: #fff;
  }

  /* Diet / Religion — larger 3-col cards with paragraph */
  .kw-diet-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 12px;
  }
  .kw-diet {
    background: #fff;
    border: 1.5px solid var(--kw-rule);
    border-radius: 16px;
    padding: 18px 20px 18px 22px;
    cursor: pointer;
    display: flex; flex-direction: column; gap: 8px;
    text-align: left;
    position: relative;
    min-width: 0;
    transition: border-color .15s, background .15s, box-shadow .15s, transform .15s;
  }
  .kw-diet:hover {
    border-color: var(--kw-line);
    transform: translateY(-1px);
    box-shadow: 0 6px 18px -10px rgba(0,0,0,.18);
  }
  .kw-diet.is-selected {
    border-color: var(--kw-accent);
    background: var(--kw-accent-soft);
    box-shadow: inset 4px 0 0 var(--kw-accent);
  }
  .kw-diet-head {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px;
  }
  .kw-diet-name {
    font-size: 17px; font-weight: 700; color: var(--kw-ink);
    letter-spacing: -0.014em; line-height: 1.15;
  }
  .kw-diet-tag {
    font-family: 'Playfair Display', serif;
    font-style: italic; font-weight: 700;
    font-size: 10px; letter-spacing: .14em;
    text-transform: uppercase; color: var(--kw-accent);
  }
  .kw-diet-desc {
    font-size: 12.5px; font-weight: 500;
    color: var(--kw-ink-3); line-height: 1.45;
    margin: 0;
  }
  .kw-diet.is-selected .kw-diet-desc { color: var(--kw-ink-2); }

  /* Spice tolerance — segmented with chili pips */
  .kw-spice {
    display: flex; align-items: stretch;
    gap: 6px;
    padding: 4px;
    background: var(--kw-bg-soft);
    border-radius: 14px;
  }
  .kw-spice-opt {
    flex: 1;
    background: transparent;
    border: none;
    border-radius: 10px;
    padding: 12px 12px 14px;
    cursor: pointer;
    display: flex; flex-direction: column; gap: 4px;
    align-items: center; justify-content: center;
    text-align: center;
    color: var(--kw-ink-3);
    transition: background .15s, color .15s, box-shadow .15s;
  }
  .kw-spice-opt:hover { color: var(--kw-ink); }
  .kw-spice-opt.is-active {
    background: #fff;
    color: var(--kw-ink);
    box-shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 0 rgba(0,0,0,.04);
  }
  .kw-spice-pips {
    display: inline-flex; align-items: center; gap: 3px;
    height: 14px;
  }
  .kw-spice-pip {
    width: 7px; height: 11px;
    background: var(--kw-line);
    border-radius: 2px 2px 4px 4px / 2px 2px 6px 6px;
    transform: rotate(-8deg);
  }
  .kw-spice-pip.on {
    background: var(--kw-accent);
  }
  .kw-spice-opt.is-active .kw-spice-pip.on { background: var(--kw-accent); }
  .kw-spice-label {
    font-size: 13px; font-weight: 700;
    letter-spacing: -0.005em;
  }
  .kw-spice-sub {
    font-size: 11px; font-weight: 500;
    color: var(--kw-ink-3); letter-spacing: .01em;
  }
  .kw-spice-opt.is-active .kw-spice-sub { color: var(--kw-ink-2); }

  /* Confidence band — reassurance the concierge double-checks */
  .kw-confband {
    margin-top: 18px;
    padding: 14px 18px;
    border: 1px solid var(--kw-rule);
    border-radius: 14px;
    background: var(--kw-bg-warm);
    display: flex; align-items: flex-start; gap: 14px;
    box-shadow: inset 4px 0 0 var(--kw-gold);
  }
  .kw-confband-mark {
    width: 30px; height: 30px;
    border-radius: 50%;
    background: var(--kw-gold); color: #fff;
    display: inline-flex; align-items: center; justify-content: center;
    font-family: 'Playfair Display', serif; font-style: italic; font-weight: 700;
    font-size: 16px;
    flex: none;
  }
  .kw-confband-body { display: flex; flex-direction: column; gap: 3px; }
  .kw-confband-title {
    font-size: 14px; font-weight: 700; color: var(--kw-ink);
    letter-spacing: -0.006em;
  }
  .kw-confband-text {
    font-size: 12.5px; font-weight: 500;
    color: var(--kw-ink-3); line-height: 1.45;
  }
