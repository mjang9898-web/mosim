<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in — Mosim</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --ivory:#F7F2EA; --ivory-soft:#FBF8F2; --navy:#1B2A4A; --navy-soft:#2A3C5E; --gold:#C39A3F; --ink:#54514B; --ink-2:#8A8479; --line:#E5DBC8; }
  *{ box-sizing:border-box; }
  body{ margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:var(--ivory); color:var(--navy);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,system-ui,sans-serif; -webkit-font-smoothing:antialiased; padding:92px 24px 24px; }
  .topnav{ position:fixed; top:0; left:0; right:0; display:flex; justify-content:flex-end; align-items:center; gap:16px; padding:16px 24px; border-bottom:1px solid var(--line); background:var(--ivory); z-index:10; }
  .nav-signin{ font-size:15px; font-weight:600; color:var(--navy); background:#fff; border:1.5px solid var(--gold); border-radius:999px; padding:9px 18px; min-height:44px; display:inline-flex; align-items:center; text-decoration:none; white-space:nowrap; }
  .nav-signin:hover{ background:var(--ivory-soft); }
  .nav-cta{ font-size:15px; font-weight:600; color:#fff; background:var(--navy); border:1.5px solid var(--navy); border-radius:999px; padding:9px 18px; min-height:44px; display:inline-flex; align-items:center; text-decoration:none; white-space:nowrap; }
  .nav-cta:hover{ background:var(--navy-soft); }
  .nav-div{ width:1px; height:22px; background:var(--line); display:inline-block; flex:none; }
  .brand-top{ font-family:'Lora',Georgia,serif; font-weight:600; font-size:26px; color:var(--navy); text-decoration:none; margin-bottom:26px; }
  .brand-top .dot{ color:var(--gold); }
  .card{ background:#fff; border:1px solid var(--line); border-radius:18px; padding:38px 34px; max-width:430px; width:100%; box-shadow:0 24px 60px -34px rgba(27,42,74,.4); }
  h1{ font-family:'Lora',Georgia,serif; font-size:28px; font-weight:600; margin:0 0 8px; }
  p.sub{ font-size:19px; color:var(--ink); margin:0 0 28px; line-height:1.5; }
  .btn-google{ display:flex; align-items:center; justify-content:center; gap:10px; width:100%; padding:14px 16px; font-size:17px; font-weight:500; border:1.5px solid var(--line); border-radius:10px; background:#fff; cursor:pointer; margin-bottom:18px; color:var(--navy); font-family:inherit; min-height:44px; }
  .btn-google:hover{ background:var(--ivory-soft); border-color:var(--gold); }
  .divider{ display:flex; align-items:center; gap:10px; margin:18px 0; color:var(--ink-2); font-size:14px; }
  .divider::before, .divider::after{ content:''; flex:1; height:1px; background:var(--line); }
  label{ display:block; font-size:15px; font-weight:600; color:var(--ink-2); margin:14px 0 6px; }
  input{ width:100%; padding:13px 15px; font-size:19px; border:1.5px solid var(--line); border-radius:10px; font-family:inherit; color:var(--navy); background:#fff; }
  input:focus{ outline:none; border-color:var(--gold); }
  .btn-primary{ width:100%; padding:15px 16px; font-size:18px; margin-top:20px; background:var(--navy); color:#fff; border:0; border-radius:10px; cursor:pointer; font-weight:600; font-family:inherit; min-height:44px; }
  .btn-primary:hover{ background:var(--navy-soft); }
  .btn-primary:disabled{ opacity:.5; cursor:not-allowed; }
  .links{ margin-top:20px; font-size:16px; color:var(--ink); text-align:center; }
  .links a{ color:var(--gold); text-decoration:none; font-weight:600; }
  .forgot{ display:block; text-align:right; font-size:15px; color:var(--gold); text-decoration:none; margin-top:8px; font-weight:500; }
  .err{ color:#A4452F; font-size:15px; margin-top:12px; min-height:1.2em; }
</style>
</head>
<body>
<nav class="topnav"><a id="nav-auth" href="/signin.html" class="nav-signin">Sign in</a><span class="nav-div" aria-hidden="true"></span><a href="/step1.html" class="nav-cta">Plan my trip</a></nav>
<a href="/index.html" class="brand-top">Mosim<span class="dot">.</span></a>
<div class="card">
  <h1>Welcome back</h1>
  <p class="sub">Sign in to see your saved trips.</p>

  <button id="google-btn" class="btn-google" type="button">
    <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true">
      <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 7.9 3l5.7-5.7C34 5.1 29.3 3 24 3 12.4 3 3 12.4 3 24s9.4 21 21 21 21-9.4 21-21c0-1.2-.1-2.3-.4-3.5z"/>
      <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 16.1 18.9 13 24 13c3.1 0 5.8 1.1 7.9 3l5.7-5.7C34 5.1 29.3 3 24 3 16.3 3 9.7 7.6 6.3 14.7z"/>
      <path fill="#4CAF50" d="M24 45c5.2 0 9.9-2 13.4-5.2l-6.2-5.2c-2 1.5-4.5 2.4-7.2 2.4-5.2 0-9.6-3.3-11.2-7.9l-6.5 5C9.4 40.6 16.2 45 24 45z"/>
      <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.2 5.6l6.2 5.2c-.4.4 6.8-4.9 6.8-14.8 0-1.2-.1-2.3-.4-3.5z"/>
    </svg>
    Continue with Google
  </button>

  <div class="divider">or</div>

  <form id="signin-form">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="email" required>

    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <a href="#" id="forgot-link" class="forgot">Forgot password?</a>

    <button id="email-btn" class="btn-primary" type="submit">Sign in</button>
    <div id="msg" class="err"></div>
  </form>

  <div class="links">
    No account yet? <a href="/signup.html">Create one</a>
  </div>
</div>

<script type="module" src="/js/auth.js"></script>
<script>
  function nextUrl() {
    const u = new URL(window.location.href);
    const next = u.searchParams.get('next');
    const save = u.searchParams.get('save');
    if (next === 'result') return '/result.html' + (save ? '?save=1' : '');
    if (next === 'me') return '/me.html';
    if (next === 'cockpit') return '/cockpit.html';
    if (next && /^step[1-4]$/.test(next)) return '/' + next + '.html';
    return '/me.html';
  }

  async function ready() {
    let t = 0;
    while (!window.kwAuth && t < 100) { await new Promise(r => setTimeout(r, 50)); t++; }
  }

  document.getElementById('google-btn').addEventListener('click', async () => {
    await ready();
    const { error } = await window.kwAuth.signInWithGoogle(nextUrl());
    if (error) document.getElementById('msg').textContent = error.message;
  });

  document.getElementById('signin-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    await ready();
    const btn = document.getElementById('email-btn');
    const msg = document.getElementById('msg');
    btn.disabled = true;
    msg.textContent = '';
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const { user, error } = await window.kwAuth.signInWithEmail(email, password);
    if (error) {
      msg.textContent = error.message;
      btn.disabled = false;
      return;
    }
    window.location.href = nextUrl();
  });

  document.getElementById('forgot-link').addEventListener('click', async (e) => {
    e.preventDefault();
    await ready();
    const email = document.getElementById('email').value.trim();
    if (!email) {
      document.getElementById('msg').textContent = 'Enter your email above first, then click Forgot password.';
      return;
    }
    const { error } = await window.kwAuth.resetPassword(email);
    document.getElementById('msg').textContent = error
      ? error.message
      : 'Reset link sent — check your email.';
  });
</script>
<script>(function(){var el=document.getElementById('nav-auth');if(!el)return;try{var r=localStorage.getItem('sb-ktcwpowkyovyrlwajajm-auth-token');var s=r?JSON.parse(r):null;var t=s&&(s.access_token||(s.currentSession&&s.currentSession.access_token));var e=s&&(s.expires_at||(s.currentSession&&s.currentSession.expires_at));if(t&&(!e||e*1000>Date.now())){el.textContent='My Page';el.setAttribute('href','/me.html');}}catch(x){}})();</script>
</body>
</html>
