<style>
  :root{ --ivory:#F7F2EA; --ivory-soft:#FBF8F2; --navy:#1B2A4A; --navy-soft:#2A3C5E; --gold:#C39A3F; --ink:#54514B; --ink-2:#8A8479; --line:#E5DBC8; }
  *{ box-sizing:border-box; }
  body{ margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:var(--ivory); color:var(--navy);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,system-ui,sans-serif; -webkit-font-smoothing:antialiased; padding:92px 24px 24px; }
  .topnav{ position:fixed; top:0; left:0; right:0; display:flex; justify-content:flex-end; align-items:center; gap:16px; padding:16px 24px; border-bottom:1px solid var(--line); background:var(--ivory); z-index:10; }
  .nav-signin{ font-size:15px; font-weight:600; color:var(--navy); background:#fff; border:1.5px solid var(--gold); border-radius:999px; padding:9px 18px; min-height:44px; display:inline-flex; align-items:center; text-decoration:none; white-space:nowrap; }
  .nav-signin:hover{ background:var(--ivory-soft); }
  .nav-cta{ font-size:15px; font-weight:600; color:#fff; background:var(--navy); border:1.5px solid var(--navy); border-radius:999px; padding:9px 18px; min-height:44px; display:inline-flex; align-items:center; text-decoration:none; white-space:nowrap; }
  .nav-cta:hover{ background:var(--navy-soft); }
  .nav-div{ width:1px; height:22px; background:var(--ink-2); display:inline-block; flex:none; }
  .brand-top{ font-family:'Lora',Georgia,serif; font-weight:600; font-size:26px; color:var(--navy); text-decoration:none; margin-bottom:26px; }
  .brand-top .dot{ color:var(--gold); }
  .card{ background:#fff; border:1px solid var(--line); border-radius:18px; padding:38px 34px; max-width:430px; width:100%; box-shadow:0 24px 60px -34px rgba(27,42,74,.4); }
  h1{ font-family:'Lora',Georgia,serif; font-size:28px; font-weight:600; margin:0 0 8px; }
  p.sub{ font-size:19px; color:var(--ink); margin:0 0 28px; line-height:1.5; }
  /* Shared OAuth button geometry — Google / Facebook ride the same rhythm. */
  .btn-oauth{ display:flex; align-items:center; justify-content:center; gap:10px; width:100%; padding:14px 16px; font-size:17px; font-weight:500; border:1.5px solid transparent; border-radius:10px; cursor:pointer; margin-bottom:18px; font-family:inherit; min-height:48px; }
  .btn-oauth svg{ flex:none; }
  .btn-google{ border-color:var(--line); background:#fff; color:var(--navy); }
  .btn-google:hover{ background:var(--ivory-soft); border-color:var(--gold); }
  .btn-facebook{ background:#1877F2; color:#fff; }
  .btn-facebook:hover{ background:#1466d6; }
  .divider{ display:flex; align-items:center; gap:10px; margin:18px 0; color:var(--ink-2); font-size:14px; }
  .divider::before, .divider::after{ content:''; flex:1; height:1px; background:var(--line); }
  label{ display:block; font-size:15px; font-weight:600; color:var(--ink-2); margin:14px 0 6px; }
  input{ width:100%; padding:13px 15px; font-size:19px; border:1.5px solid var(--line); border-radius:10px; font-family:inherit; color:var(--navy); background:#fff; }
  input:focus{ outline:none; border-color:var(--gold); }
  .pw-wrap{ position:relative; }
  .pw-wrap input{ padding-right:54px; }
  .pw-toggle{ position:absolute; top:0; right:0; height:100%; min-width:44px; min-height:44px; display:flex; align-items:center; justify-content:center; padding:0 12px; background:transparent; border:0; border-radius:8px; cursor:pointer; color:var(--ink-2); font-family:inherit; }
  .pw-toggle:hover{ color:var(--navy); }
  .pw-toggle svg{ display:block; width:22px; height:22px; }
  .btn-primary{ width:100%; padding:15px 16px; font-size:18px; margin-top:20px; background:var(--navy); color:#fff; border:0; border-radius:10px; cursor:pointer; font-weight:600; font-family:inherit; min-height:44px; }
  .btn-primary:hover{ background:var(--navy-soft); }
  .btn-primary:disabled{ opacity:.5; cursor:not-allowed; }
  :focus-visible{ outline:2px solid var(--navy); outline-offset:2px; border-radius:4px; }
  .links{ margin-top:20px; font-size:16px; color:var(--ink); text-align:center; }
  .links a{ color:var(--navy); text-decoration:underline; text-decoration-color:var(--gold); text-underline-offset:3px; font-weight:600; }
  .forgot{ display:block; text-align:right; font-size:15px; color:var(--navy); text-decoration:underline; text-decoration-color:var(--gold); text-underline-offset:3px; margin-top:8px; font-weight:500; }
  .err{ color:#A4452F; font-size:15px; margin-top:12px; min-height:1.2em; }
</style>
<script src="js/analytics.js"></script>
</head>
<body>
<nav class="topnav"><a id="nav-auth" href="/signin.html" class="nav-signin">Sign in</a><span class="nav-div" aria-hidden="true"></span><a href="/step1.html" class="nav-cta">Plan my trip</a></nav>
<a href="/index.html" class="brand-top">Mosim<span class="dot">.</span></a>
<div class="card">
  <h1>Welcome back</h1>
  <p class="sub">Sign in to see your saved trips.</p>

  <button id="google-btn" class="btn-oauth btn-google" type="button" aria-label="Continue with Google">
    <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true">
      <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 7.9 3l5.7-5.7C34 5.1 29.3 3 24 3 12.4 3 3 12.4 3 24s9.4 21 21 21 21-9.4 21-21c0-1.2-.1-2.3-.4-3.5z"/>
      <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 16.1 18.9 13 24 13c3.1 0 5.8 1.1 7.9 3l5.7-5.7C34 5.1 29.3 3 24 3 16.3 3 9.7 7.6 6.3 14.7z"/>
      <path fill="#4CAF50" d="M24 45c5.2 0 9.9-2 13.4-5.2l-6.2-5.2c-2 1.5-4.5 2.4-7.2 2.4-5.2 0-9.6-3.3-11.2-7.9l-6.5 5C9.4 40.6 16.2 45 24 45z"/>
      <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.2 5.6l6.2 5.2c-.4.4 6.8-4.9 6.8-14.8 0-1.2-.1-2.3-.4-3.5z"/>
    </svg>
    Continue with Google
  </button>

  <!-- Facebook login — 보류(옵션A). Supabase Facebook provider 설정 후 복원 -->
  <!--
  <button id="facebook-btn" class="btn-oauth btn-facebook" type="button" aria-label="Continue with Facebook">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="#fff" aria-hidden="true">
      <path d="M24 12.07C24 5.4 18.63 0 12 0S0 5.4 0 12.07C0 18.1 4.39 23.1 10.13 24v-8.44H7.08v-3.49h3.05V9.41c0-3.02 1.79-4.7 4.53-4.7 1.31 0 2.68.24 2.68.24v2.97h-1.51c-1.49 0-1.96.93-1.96 1.89v2.26h3.33l-.53 3.49h-2.8V24C19.61 23.1 24 18.1 24 12.07z"/>
    </svg>
    Continue with Facebook
  </button>
  -->

  <div class="divider">or</div>

  <form id="signin-form">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="email" required>

    <label for="password">Password</label>
    <div class="pw-wrap">
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="button" class="pw-toggle" data-target="password" aria-label="Show password" aria-pressed="false">
        <svg class="eye-show" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
        <svg class="eye-hide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:none"><path d="M17.9 17.9A10.5 10.5 0 0 1 12 19c-6.5 0-10-7-10-7a18.8 18.8 0 0 1 5.1-5.9m3.2-1.5A10.5 10.5 0 0 1 12 5c6.5 0 10 7 10 7a18.8 18.8 0 0 1-2.3 3.3M9.9 9.9a3 3 0 0 0 4.2 4.2"/><path d="M2 2l20 20"/></svg>
      </button>
    </div>
    <a href="#" id="forgot-link" class="forgot">Forgot password?</a>

    <button id="email-btn" class="btn-primary" type="submit">Sign in</button>
    <div id="msg" class="err"></div>
  </form>

  <div class="links">
    No account yet? <a href="/signup.html">Create one</a>
  </div>
</div>

<script type="module" src="/js/auth.js"></script>
<script>
  function nextUrl() {
    const u = new URL(window.location.href);
    const next = u.searchParams.get('next');
    const save = u.searchParams.get('save');
    const reserve = u.searchParams.get('reserve');
    const claim = u.searchParams.get('claim');   // stashed-itinerary token (preserved for already-members)
    if (next === 'result') {
      const params = [];
      if (save) params.push('save=1');
      if (reserve === '1') params.push('reserve=1');
      if (claim) params.push('claim=' + encodeURIComponent(claim));
      return '/result.html' + (params.length ? ('?' + params.join('&')) : '');
    }
    if (next === 'me') return '/me.html';
    if (next === 'cockpit') return '/cockpit.html';
    if (next && /^step[1-4]$/.test(next)) return '/' + next + '.html';
    return '/me.html';
  }

  async function ready() {
    let t = 0;
    while (!window.kwAuth && t < 100) { await new Promise(r => setTimeout(r, 50)); t++; }
  }

  // Show/hide password toggle. The eye controls its own field (data-target).
  document.querySelectorAll('.pw-toggle').forEach((btn) => {
    btn.addEventListener('click', () => {
      const input = document.getElementById(btn.getAttribute('data-target'));
      if (!input) return;
      const show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      btn.setAttribute('aria-pressed', show ? 'true' : 'false');
      btn.setAttribute('aria-label', (show ? 'Hide ' : 'Show ') + 'password');
      btn.querySelector('.eye-show').style.display = show ? 'none' : 'block';
      btn.querySelector('.eye-hide').style.display = show ? 'block' : 'none';
    });
  });

  // A "plain login" is one whose destination is My Page (next null or 'me').
  // Only then do we set the one-shot flag so an admin gets bounced to the
  // cockpit from /me.html. Funnel continuations (result/stepN) and an explicit
  // ?next=cockpit are left untouched.
  function isPlainLogin() {
    const next = new URL(window.location.href).searchParams.get('next');
    return next === null || next === 'me';
  }
  function markFromLogin() {
    if (!isPlainLogin()) return;
    try { sessionStorage.setItem('kw.fromLogin', '1'); } catch (e) {}
  }

  document.getElementById('google-btn').addEventListener('click', async () => {
    await ready();
    markFromLogin();
    const { error } = await window.kwAuth.signInWithGoogle(nextUrl());
    if (error) document.getElementById('msg').textContent = error.message;
  });

  // Facebook shares Google's mechanism. If the provider isn't configured in
  // Supabase yet, the helper returns { error } (no console noise) and we show a
  // calm, reassuring fallback rather than a raw provider error. markFromLogin()
  // mirrors the Google handler so an admin still gets bounced to the cockpit.
  const OAUTH_UNAVAILABLE = "This sign-in option isn't available right now. Please use Google or email.";
  function wireOAuthButton(btnId, method) {
    document.getElementById(btnId).addEventListener('click', async () => {
      await ready();
      markFromLogin();
      const { error } = await window.kwAuth[method](nextUrl());
      if (error) {
        const msg = document.getElementById('msg');
        msg.className = 'err';
        msg.textContent = OAUTH_UNAVAILABLE;
      }
    });
  }
  // Facebook login — 보류(옵션A). Supabase Facebook provider 설정 후 복원
  // wireOAuthButton('facebook-btn', 'signInWithFacebook');

  document.getElementById('signin-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    await ready();
    const btn = document.getElementById('email-btn');
    const msg = document.getElementById('msg');
    btn.disabled = true;
    msg.textContent = '';
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const { user, error } = await window.kwAuth.signInWithEmail(email, password);
    if (error) {
      msg.textContent = error.message;
      btn.disabled = false;
      return;
    }
    markFromLogin();
    window.location.href = nextUrl();
  });

  document.getElementById('forgot-link').addEventListener('click', async (e) => {
    e.preventDefault();
    await ready();
    const email = document.getElementById('email').value.trim();
    if (!email) {
      document.getElementById('msg').textContent = 'Enter your email above first, then click Forgot password.';
      return;
    }
    const { error } = await window.kwAuth.resetPassword(email);
    document.getElementById('msg').textContent = error
      ? error.message
      : 'Reset link sent — check your email.';
  });
</script>
<script>(function(){var el=document.getElementById('nav-auth');if(!el)return;try{var r=localStorage.getItem('sb-ktcwpowkyovyrlwajajm-auth-token');var s=r?JSON.parse(r):null;var t=s&&(s.access_token||(s.currentSession&&s.currentSession.access_token));var e=s&&(s.expires_at||(s.currentSession&&s.currentSession.expires_at));if(t&&(!e||e*1000>Date.now())){el.textContent='My Page';el.setAttribute('href','/me.html');fetch('/api/admin/trips?action=whoami',{headers:{authorization:'Bearer '+t}}).then(function(res){if(res.ok){el.textContent='Cockpit';el.setAttribute('href','/cockpit.html');}}).catch(function(){});}}catch(x){}})();</script>
</body>
</html>
