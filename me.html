<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta property="og:site_name" content="Mosim">
<meta property="og:title" content="Mosim — You're never alone in Korea.">
<meta property="og:description" content="World-class medical care in Korea — fully arranged, with someone beside you the whole way.">
<meta property="og:image" content="https://mosimkorea.com/og-image.jpg">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<title>My Page — Mosim</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --ivory:#F7F2EA; --ivory-soft:#FBF8F2; --navy:#1B2A4A; --gold:#C39A3F; --ink:#54514B; --ink-2:#8A8479; --line:#E5DBC8; }
  *{ box-sizing:border-box; }
  body{ margin:0; min-height:100vh; background:var(--ivory); color:var(--navy);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  header.me-head{ background:rgba(247,242,234,.9); backdrop-filter:blur(12px); border-bottom:1px solid var(--line);
    padding:18px 28px; display:flex; align-items:center; justify-content:space-between; }
  header.me-head a.brand{ font-family:'Lora',Georgia,serif; font-weight:600; font-size:24px; color:var(--navy); text-decoration:none; }
  header.me-head a.brand .dot{ color:var(--gold); }
  header.me-head .right{ display:flex; align-items:center; gap:16px; }
  header.me-head .greeting{ font-size:17px; color:var(--ink); }
  header.me-head button.signout{ font:inherit; font-size:15px; font-weight:500; padding:9px 16px;
    background:#fff; border:1.5px solid var(--line); border-radius:999px; cursor:pointer; color:var(--navy); }
  header.me-head button.signout:hover{ background:var(--ivory-soft); border-color:var(--gold); }
  :focus-visible{ outline:2px solid var(--navy); outline-offset:2px; border-radius:4px; }
  nav.tabs{ background:rgba(247,242,234,.9); border-bottom:1px solid var(--line); padding:0 28px; display:flex; gap:28px; overflow-x:auto; flex-wrap:nowrap; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
  nav.tabs::-webkit-scrollbar{ display:none; }
  nav.tabs a{ display:inline-block; padding:14px 0; font-size:17px; color:var(--ink); text-decoration:none; border-bottom:2px solid transparent; font-weight:500; white-space:nowrap; flex:none; }
  nav.tabs a[aria-current="page"]{ color:var(--navy); border-bottom-color:var(--gold); font-weight:600; }
  @media(max-width:430px){ nav.tabs{ gap:18px; } }
  main{ padding:32px 28px; max-width:980px; margin:0 auto; }
  main section{ display:none; }
  main section.active{ display:block; }
  .placeholder{ padding:48px; background:#fff; border:1px solid var(--line); border-radius:16px;
    color:var(--ink-2); text-align:center; font-size:19px; }
  h1,h2,h3{ font-family:'Lora',Georgia,serif; }
  @media(max-width:720px){ .ov-row{ grid-template-columns:1fr!important; } }
</style>
</head>
<body>
<header class="me-head">
  <a class="brand" href="/index.html">Mosim<span class="dot">.</span></a>
  <div class="right">
    <span id="greeting" class="greeting"></span>
    <a id="cockpit-link" href="/cockpit.html" class="signout" style="text-decoration:none; display:none; border-color:var(--gold); color:var(--navy);">Cockpit</a>
    <a href="/step1.html" class="signout" style="text-decoration:none;">Plan my trip</a>
    <button id="signout" class="signout" type="button">Sign out</button>
  </div>
</header>

<nav class="tabs" id="tabs">
  <a href="?tab=overview"    data-tab="overview">Overview</a>
  <a href="?tab=itineraries" data-tab="itineraries">Itineraries</a>
  <a href="?tab=status"      data-tab="status">Status</a>
  <a href="?tab=profile"     data-tab="profile">Profile</a>
  <a href="?tab=settings"    data-tab="settings">Settings</a>
</nav>

<main>
  <section id="sec-overview"><div id="me-overview-root" class="placeholder">Loading your dashboard…</div></section>
  <section id="sec-itineraries"><div id="me-itineraries-root" class="placeholder">My itineraries — coming next.</div></section>
  <section id="sec-status"><div id="me-status-root" class="placeholder">Status timeline — coming next.</div></section>
  <section id="sec-profile"><div id="me-profile-root" class="placeholder">Profile editor — coming next.</div></section>
  <section id="sec-settings"><div id="me-settings-root" class="placeholder">Settings — coming next.</div></section>
</main>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script type="module" src="/js/auth.js"></script>
<script>
  // Guard: redirect anonymous users to signin.
  (async function () {
    let t = 0;
    while (!window.kwAuth && t < 100) { await new Promise(r => setTimeout(r, 50)); t++; }
    if (!window.kwAuth) { window.location.replace('/signin.html?next=me'); return; }
    const user = await window.kwAuth.getUser();
    if (!user) {
      window.location.replace('/signin.html?next=me');
      return;
    }
    // One-shot "just logged in" flag (set by signin.html on a plain login).
    // Read and clear it immediately so a later visit never re-triggers.
    const fromLogin = sessionStorage.getItem('kw.fromLogin');
    try { sessionStorage.removeItem('kw.fromLogin'); } catch (e) {}

    document.getElementById('greeting').textContent = user.user_metadata?.name || user.email;
    document.getElementById('signout').addEventListener('click', async () => {
      await window.kwAuth.signOut();
      window.location.href = '/';
    });

    // Tab routing
    const params = new URLSearchParams(window.location.search);
    const tab = ['overview','itineraries','status','profile','settings'].includes(params.get('tab'))
      ? params.get('tab') : 'overview';
    document.querySelectorAll('#tabs a').forEach(a => {
      if (a.dataset.tab === tab) a.setAttribute('aria-current', 'page');
    });
    document.getElementById('sec-' + tab).classList.add('active');

    // Admin-only: reveal the Cockpit link on whoami 200. 403 (non-admin) → stay hidden, fail silently.
    try {
      const client = await window.kwAuth.init();
      const { data: { session } } = await client.auth.getSession();
      const token = session && session.access_token;
      if (token) {
        const r = await fetch('/api/admin/trips?action=whoami', { headers: { authorization: 'Bearer ' + token } });
        if (r.ok) {
          document.getElementById('cockpit-link').style.display = '';
          // Admins who just logged in (fromLogin flag) land on the cockpit,
          // not My Page. replace() so Back doesn't bounce them here.
          if (fromLogin) { window.location.replace('/cockpit.html'); return; }
        }
      }
    } catch (e) { /* never block My Page on the admin probe; never redirect on error */ }
  })();
</script>
<script src="/js/me-itineraries.js?v=d5b8af66" defer></script>
<script src="/js/me-status.js?v=67f6ce40" defer></script>
<script src="/js/me-profile.js?v=3fc26553" defer></script>
<script src="/js/me-settings.js?v=a0494ede" defer></script>
<script src="/js/me-overview.js?v=b538bcd1" defer></script>
</body>
</html>
