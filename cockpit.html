<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<meta property="og:title" content="Mosim — Cockpit">
<title>Cockpit — Mosim</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<style>
  :root {
    --ink-1:#1d1d1f; --ink-2:#2a2a2c; --ink-3:#4a4a4d; --bg:#fafafa; --bg-1:#fff; --bg-soft:#f5f5f7;
    --navy:#1B2A4A; --gold:#C39A3F; --border:#e2e2e2;
  }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--ink-1);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header.cp-head { background:#fff; border-bottom:1px solid var(--border); padding:18px 28px;
    display:flex; align-items:center; justify-content:space-between; }
  header.cp-head .brand { font-weight:700; font-size:19px; }
  header.cp-head .brand .sub { color:var(--ink-3); font-weight:500; }
  header.cp-head .right { display:flex; align-items:center; gap:16px; }
  header.cp-head .greeting { font-size:15px; color:var(--ink-2); }
  header.cp-head button.signout { font:inherit; font-size:15px; padding:8px 14px; background:#fff;
    border:1px solid var(--border); border-radius:8px; cursor:pointer; }
  header.cp-head button.signout:hover { background:var(--bg-soft); }
  main { max-width:1160px; margin:0 auto; padding:32px 28px; }
  h1.cp-title { font-size:26px; margin:0 0 4px; }
  p.cp-lede { font-size:16px; color:var(--ink-3); margin:0 0 24px; }

  .filters { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px; }
  .filters button { font:inherit; font-size:14px; padding:7px 14px; border:1px solid var(--border);
    background:#fff; border-radius:999px; cursor:pointer; color:var(--ink-2); }
  .filters button.on { background:var(--navy); color:#fff; border-color:var(--navy); }

  table.trips { width:100%; border-collapse:collapse; background:#fff; border:1px solid var(--border); border-radius:12px; overflow:hidden; }
  table.trips th { text-align:left; font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-3);
    padding:12px 14px; border-bottom:1px solid var(--border); background:var(--bg-soft); }
  table.trips td { padding:14px; border-bottom:1px solid var(--border); font-size:14px; vertical-align:top; }
  table.trips tr:last-child td { border-bottom:none; }
  tr.reserved { background:#FFF8EC; }
  .cust .nm { font-weight:600; } .cust .em { color:var(--ink-3); font-size:13px; }
  .chips { display:flex; gap:5px; flex-wrap:wrap; margin-top:6px; }
  .chip { font-size:12px; border:1px solid var(--border); border-radius:999px; padding:2px 9px; color:var(--ink-2); }
  select.st, select.bk { font:inherit; font-size:13px; padding:6px 8px; border:1px solid var(--border); border-radius:8px; background:#fff; text-transform:capitalize; }
  .pay-ok { color:#1b6e3d; font-weight:600; } .pay-due { color:#8a4a00; }
  .act a, .act button { font:inherit; font-size:13px; color:var(--navy); text-decoration:none; border:none; background:none;
    cursor:pointer; padding:0; display:block; margin-bottom:5px; white-space:nowrap; }
  .act a:hover { text-decoration:underline; }
  .empty { padding:44px; text-align:center; color:var(--ink-3); background:#fff; border:1px solid var(--border); border-radius:12px; }
  @media (max-width:760px) { main { padding:22px 14px; } table.trips { font-size:13px; } }
</style>
</head>
<body>
<header class="cp-head">
  <div class="brand">Mosim <span class="sub">· Cockpit</span></div>
  <div class="right">
    <span id="greeting" class="greeting"></span>
    <button id="signout" class="signout" type="button">Sign out</button>
  </div>
</header>

<main>
  <h1 class="cp-title">Reservations &amp; trips</h1>
  <p class="cp-lede">Every traveler's plan and where it stands. <b>Reserved</b> trips (highlighted) need a call within a day.</p>
  <div class="filters" id="filters"></div>
  <div id="dash"><div class="empty">Loading…</div></div>
</main>

<script type="module" src="/js/auth.js"></script>
<script>
(async function () {
  let t = 0;
  while (!window.kwAuth && t < 120) { await new Promise(r => setTimeout(r, 50)); t++; }
  if (!window.kwAuth) { location.replace('/signin.html?next=cockpit'); return; }
  const client = await window.kwAuth.init();
  const { data: { session } } = await client.auth.getSession();
  const user = session && session.user;
  if (!user) { location.replace('/signin.html?next=cockpit'); return; }
  document.getElementById('greeting').textContent = (user.user_metadata && user.user_metadata.name) || user.email;
  document.getElementById('signout').addEventListener('click', async () => { await window.kwAuth.signOut(); location.href = '/'; });

  const token = session.access_token;
  const dash = document.getElementById('dash');
  const esc = (s) => String(s == null ? '' : s).replace(/[<>&"]/g, (c) => ({ '<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;' }[c]));
  const CARE = { screening:'Screening', knees:'Knees', dental:'Dental', eyes:'Eyes', unsure:'Care guidance' };
  const STATUSES = ['new','reserved','reviewing','quoted','booked','archived'];
  const BK = ['none','pending','booked'];   // flight / stay status
  const cap = (s) => s ? s[0].toUpperCase() + s.slice(1) : s;
  const fmtDate = (s) => { try { return new Date(s).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); } catch (e) { return ''; } };

  let trips = [], filter = 'all';

  async function load() {
    dash.innerHTML = '<div class="empty">Loading…</div>';
    let r;
    try { r = await fetch('/api/admin/trips', { headers: { authorization: 'Bearer ' + token } }); }
    catch (e) { dash.innerHTML = '<div class="empty">Could not reach the server.</div>'; return; }
    if (r.status === 403) { dash.innerHTML = '<div class="empty">You don’t have access to the cockpit.</div>'; document.getElementById('filters').innerHTML = ''; return; }
    if (!r.ok) { dash.innerHTML = '<div class="empty">Could not load trips.</div>'; return; }
    trips = (await r.json()).trips || [];
    render();
  }

  function render() {
    const c = {}; trips.forEach((x) => { c[x.status] = (c[x.status] || 0) + 1; });
    const fkeys = ['all','reserved','reviewing','quoted','booked','new'];
    document.getElementById('filters').innerHTML = fkeys.map((f) => {
      const n = f === 'all' ? trips.length : (c[f] || 0);
      return '<button data-f="' + f + '" class="' + (filter === f ? 'on' : '') + '">' + (f === 'all' ? 'All' : cap(f)) + ' ' + n + '</button>';
    }).join('');
    document.querySelectorAll('#filters button').forEach((b) => b.addEventListener('click', () => { filter = b.dataset.f; render(); }));

    const rows = trips.filter((x) => filter === 'all' || x.status === filter);
    if (!rows.length) { dash.innerHTML = '<div class="empty">No trips here yet.</div>'; return; }
    dash.innerHTML = '<table class="trips"><thead><tr><th>Customer</th><th>Trip</th><th>Status</th><th>Payment</th><th>Flight</th><th>Stay</th><th>Saved</th><th></th></tr></thead><tbody>'
      + rows.map(rowHtml).join('') + '</tbody></table>';
    document.querySelectorAll('select[data-field]').forEach((sel) => sel.addEventListener('change', () => updateField(sel.dataset.id, sel.dataset.field, sel.value, sel)));
  }

  function rowHtml(x) {
    const care = (x.care || []).map((k) => '<span class="chip">' + esc(CARE[k] || k) + '</span>').join('');
    const opts = STATUSES.map((s) => '<option value="' + s + '"' + (s === x.status ? ' selected' : '') + '>' + s + '</option>').join('');
    const pay = x.payment
      ? (x.payment.status === 'paid'
          ? '<span class="pay-ok">Paid ✓</span>'
          : '<span class="pay-due">$' + Number(x.payment.paid).toLocaleString() + ' / $' + Number(x.payment.total).toLocaleString() + '</span>')
      : '<span style="color:#aaa">—</span>';
    const email = x.customer.email;
    const acts = [
      email ? '<a href="mailto:' + esc(email) + '?subject=' + encodeURIComponent('Your Mosim trip') + '">Email customer</a>' : '',
      x.payment && x.payment.token ? '<a href="/pay.html?g=' + esc(x.payment.token) + '" target="_blank" rel="noopener">Payment link</a>' : ''
    ].filter(Boolean).join('');
    return '<tr class="' + (x.status === 'reserved' ? 'reserved' : '') + '">'
      + '<td class="cust"><div class="nm">' + esc(x.customer.name || '—') + '</div><div class="em">' + esc(email || '') + '</div>' + (x.customer.phone ? '<div class="em">' + esc(x.customer.phone) + '</div>' : '') + '</td>'
      + '<td><div style="font-weight:600">' + esc(x.title || 'Korea trip') + '</div><div style="color:#888;font-size:13px">' + (x.days ? x.days + '-day' : '') + (x.length ? (x.days ? ' · ' : '') + esc(x.length) : '') + '</div><div class="chips">' + care + '</div></td>'
      + '<td><select class="st" data-id="' + x.id + '" data-field="status">' + opts + '</select></td>'
      + '<td>' + pay + '</td>'
      + bkCell(x.id, 'flight_status', x.flight_status)
      + bkCell(x.id, 'stay_status', x.stay_status)
      + '<td style="color:#888;white-space:nowrap">' + fmtDate(x.created_at) + '</td>'
      + '<td class="act">' + acts + '</td>'
      + '</tr>';
  }

  function bkCell(id, field, val) {
    const v = val || 'none';
    const color = v === 'booked' ? '#1b6e3d' : v === 'pending' ? '#8a4a00' : '#999';
    const opts = BK.map((s) => '<option value="' + s + '"' + (s === v ? ' selected' : '') + '>' + s + '</option>').join('');
    return '<td><select class="bk" data-id="' + id + '" data-field="' + field + '" style="color:' + color + '">' + opts + '</select></td>';
  }

  async function updateField(id, field, value, sel) {
    sel.disabled = true;
    try {
      const body = { itinerary_id: id }; body[field] = value;
      const r = await fetch('/api/admin/trip-status', {
        method: 'POST', headers: { 'content-type': 'application/json', authorization: 'Bearer ' + token },
        body: JSON.stringify(body)
      });
      if (r.ok) { const x = trips.find((tt) => tt.id === id); if (x) x[field] = value; render(); }
      else alert('Could not update.');
    } catch (e) { alert('Could not update.'); }
    sel.disabled = false;
  }

  load();
})();
</script>
</body>
</html>
