<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<meta property="og:title" content="Mosim — Cockpit">
<title>Cockpit — Mosim</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<style>
  :root {
    --ink-1:#1d1d1f; --ink-2:#2a2a2c; --ink-3:#4a4a4d; --bg:#fafafa; --bg-1:#fff; --bg-soft:#f5f5f7;
    --navy:#1B2A4A; --gold:#C39A3F; --border:#e2e2e2;
  }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--ink-1);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header.cp-head { background:#fff; border-bottom:1px solid var(--border); padding:18px 28px;
    display:flex; align-items:center; justify-content:space-between; }
  header.cp-head .brand { font-weight:700; font-size:19px; }
  header.cp-head .brand .sub { color:var(--ink-3); font-weight:500; }
  header.cp-head .right { display:flex; align-items:center; gap:16px; }
  header.cp-head .greeting { font-size:15px; color:var(--ink-2); }
  header.cp-head button.signout { font:inherit; font-size:15px; padding:8px 14px; background:#fff;
    border:1px solid var(--border); border-radius:8px; cursor:pointer; }
  header.cp-head button.signout:hover { background:var(--bg-soft); }
  main { max-width:1160px; margin:0 auto; padding:32px 28px; }
  h1.cp-title { font-size:26px; margin:0 0 4px; }
  p.cp-lede { font-size:16px; color:var(--ink-3); margin:0 0 24px; }

  .filters { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px; }
  .filters button { font:inherit; font-size:14px; padding:7px 14px; border:1px solid var(--border);
    background:#fff; border-radius:999px; cursor:pointer; color:var(--ink-2); }
  .filters button.on { background:var(--navy); color:#fff; border-color:var(--navy); }

  table.trips { width:100%; border-collapse:collapse; background:#fff; border:1px solid var(--border); border-radius:12px; overflow:hidden; }
  table.trips th { text-align:left; font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-3);
    padding:12px 14px; border-bottom:1px solid var(--border); background:var(--bg-soft); }
  table.trips td { padding:14px; border-bottom:1px solid var(--border); font-size:14px; vertical-align:top; }
  table.trips tr:last-child td { border-bottom:none; }
  tr.reserved { background:#FFF8EC; }
  .cust .nm { font-weight:600; } .cust .em { color:var(--ink-3); font-size:13px; }
  .chips { display:flex; gap:5px; flex-wrap:wrap; margin-top:6px; }
  .chip { font-size:12px; border:1px solid var(--border); border-radius:999px; padding:2px 9px; color:var(--ink-2); }
  select.st, select.bk { font:inherit; font-size:13px; padding:6px 8px; border:1px solid var(--border); border-radius:8px; background:#fff; text-transform:capitalize; }
  .pay-ok { color:#1b6e3d; font-weight:600; } .pay-due { color:#8a4a00; }
  .act a, .act button { font:inherit; font-size:13px; color:var(--navy); text-decoration:none; border:none; background:none;
    cursor:pointer; padding:0; display:block; margin-bottom:5px; white-space:nowrap; }
  .act a:hover { text-decoration:underline; }
  .empty { padding:44px; text-align:center; color:var(--ink-3); background:#fff; border:1px solid var(--border); border-radius:12px; }
  .modal-bg { display:none; position:fixed; inset:0; background:rgba(0,0,0,.42); z-index:50; align-items:flex-start; justify-content:center; padding:56px 16px; overflow:auto; }
  .modal { background:#fff; border-radius:14px; max-width:640px; width:100%; padding:24px; box-shadow:0 30px 80px -30px rgba(0,0,0,.5); }
  .modal h2 { font-size:20px; margin:0; }
  .modal input, .modal select { font:inherit; font-size:14px; padding:9px 11px; border:1px solid var(--border); border-radius:9px; background:#fff; }
  .modal input { flex:1; min-width:140px; }
  .modal .addbtn { font:inherit; font-size:14px; font-weight:600; color:#fff; background:var(--navy); border:none; border-radius:9px; padding:9px 18px; cursor:pointer; }
  @media (max-width:760px) { main { padding:22px 14px; } table.trips { font-size:13px; } }
</style>
</head>
<body>
<header class="cp-head">
  <div class="brand">Mosim <span class="sub">· Cockpit</span></div>
  <div class="right">
    <span id="greeting" class="greeting"></span>
    <button id="signout" class="signout" type="button">Sign out</button>
  </div>
</header>

<main>
  <h1 class="cp-title">Reservations &amp; trips</h1>
  <p class="cp-lede">Every traveler's plan and where it stands. <b>Reserved</b> trips (highlighted) need a call within a day.</p>
  <div class="filters" id="filters"></div>
  <div id="dash"><div class="empty">Loading…</div></div>
</main>

<div class="modal-bg" id="bk-modal">
  <div class="modal">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
      <h2 id="bk-title">Travel bookings</h2>
      <button id="bk-close" style="font:inherit; font-size:22px; border:none; background:none; cursor:pointer; color:#888; line-height:1;">&times;</button>
    </div>
    <p style="color:#777; font-size:14px; margin:0 0 16px;">Post hotel/flight booking links for the customer, or view what they've uploaded.</p>
    <div id="bk-list" style="margin-bottom:16px;">Loading…</div>
    <div style="border-top:1px solid var(--border); padding-top:14px;">
      <div style="font-size:13px; font-weight:600; color:#666; margin-bottom:8px;">Add a booking link</div>
      <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
        <select id="bk-newcat"><option value="stay">Hotel</option><option value="flight">Flight</option><option value="other">Other</option></select>
        <input id="bk-newlabel" placeholder="Label (e.g. Lotte Hotel Seoul)">
        <input id="bk-newurl" placeholder="https://...">
        <button id="bk-add" class="addbtn">Add</button>
      </div>
    </div>
  </div>
</div>

<script type="module" src="/js/auth.js"></script>
<script>
(async function () {
  let t = 0;
  while (!window.kwAuth && t < 120) { await new Promise(r => setTimeout(r, 50)); t++; }
  if (!window.kwAuth) { location.replace('/signin.html?next=cockpit'); return; }
  const client = await window.kwAuth.init();
  const { data: { session } } = await client.auth.getSession();
  const user = session && session.user;
  if (!user) { location.replace('/signin.html?next=cockpit'); return; }
  document.getElementById('greeting').textContent = (user.user_metadata && user.user_metadata.name) || user.email;
  document.getElementById('signout').addEventListener('click', async () => { await window.kwAuth.signOut(); location.href = '/'; });

  const token = session.access_token;
  const dash = document.getElementById('dash');
  const esc = (s) => String(s == null ? '' : s).replace(/[<>&"]/g, (c) => ({ '<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;' }[c]));
  const CARE = { screening:'Screening', knees:'Knees', dental:'Dental', eyes:'Eyes', unsure:'Care guidance' };
  const STATUSES = ['new','reserved','reviewing','quoted','booked','archived'];
  const BK = ['none','pending','booked'];   // flight / stay status
  const cap = (s) => s ? s[0].toUpperCase() + s.slice(1) : s;
  const fmtDate = (s) => { try { return new Date(s).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); } catch (e) { return ''; } };

  let trips = [], filter = 'all';

  async function load() {
    dash.innerHTML = '<div class="empty">Loading…</div>';
    let r;
    try { r = await fetch('/api/admin/trips', { headers: { authorization: 'Bearer ' + token } }); }
    catch (e) { dash.innerHTML = '<div class="empty">Could not reach the server.</div>'; return; }
    if (r.status === 403) { dash.innerHTML = '<div class="empty">You don’t have access to the cockpit.</div>'; document.getElementById('filters').innerHTML = ''; return; }
    if (!r.ok) { dash.innerHTML = '<div class="empty">Could not load trips.</div>'; return; }
    trips = (await r.json()).trips || [];
    render();
  }

  function render() {
    const c = {}; trips.forEach((x) => { c[x.status] = (c[x.status] || 0) + 1; });
    const fkeys = ['all','reserved','reviewing','quoted','booked','new'];
    document.getElementById('filters').innerHTML = fkeys.map((f) => {
      const n = f === 'all' ? trips.length : (c[f] || 0);
      return '<button data-f="' + f + '" class="' + (filter === f ? 'on' : '') + '">' + (f === 'all' ? 'All' : cap(f)) + ' ' + n + '</button>';
    }).join('');
    document.querySelectorAll('#filters button').forEach((b) => b.addEventListener('click', () => { filter = b.dataset.f; render(); }));

    const rows = trips.filter((x) => filter === 'all' || x.status === filter);
    if (!rows.length) { dash.innerHTML = '<div class="empty">No trips here yet.</div>'; return; }
    dash.innerHTML = '<table class="trips"><thead><tr><th>Customer</th><th>Trip</th><th>Status</th><th>Payment</th><th>Flight</th><th>Stay</th><th>Saved</th><th></th></tr></thead><tbody>'
      + rows.map(rowHtml).join('') + '</tbody></table>';
    document.querySelectorAll('select[data-field]').forEach((sel) => sel.addEventListener('change', () => updateField(sel.dataset.id, sel.dataset.field, sel.value, sel)));
    document.querySelectorAll('button.bk-open').forEach((b) => b.addEventListener('click', () => openBookings(b.dataset.id, b.dataset.title)));
    document.querySelectorAll('button.bk-pay').forEach((b) => b.addEventListener('click', () => setupPayment(b.dataset.id, b)));
  }

  function rowHtml(x) {
    const care = (x.care || []).map((k) => '<span class="chip">' + esc(CARE[k] || k) + '</span>').join('');
    const opts = STATUSES.map((s) => '<option value="' + s + '"' + (s === x.status ? ' selected' : '') + '>' + s + '</option>').join('');
    const pay = x.payment
      ? (x.payment.status === 'paid'
          ? '<span class="pay-ok">Paid ✓</span>'
          : '<span class="pay-due">$' + Number(x.payment.paid).toLocaleString() + ' / $' + Number(x.payment.total).toLocaleString() + '</span>')
      : '<span style="color:#aaa">—</span>';
    const email = x.customer.email;
    const acts = [
      '<button class="bk-open" data-id="' + x.id + '" data-title="' + esc(x.title || 'Korea trip') + '">Bookings</button>',
      email ? '<a href="mailto:' + esc(email) + '?subject=' + encodeURIComponent('Your Mosim trip') + '">Email customer</a>' : '',
      x.payment && x.payment.token ? '<a href="/pay.html?g=' + esc(x.payment.token) + '" target="_blank" rel="noopener">Payment link</a>' : '',
      !x.payment ? '<button class="bk-pay" data-id="' + x.id + '">Set up payment</button>' : ''
    ].filter(Boolean).join('');
    return '<tr class="' + (x.status === 'reserved' ? 'reserved' : '') + '">'
      + '<td class="cust"><div class="nm">' + esc(x.customer.name || '—') + '</div><div class="em">' + esc(email || '') + '</div>' + (x.customer.phone ? '<div class="em">' + esc(x.customer.phone) + '</div>' : '') + '</td>'
      + '<td><div style="font-weight:600">' + esc(x.title || 'Korea trip') + '</div><div style="color:#888;font-size:13px">' + (x.days ? x.days + '-day' : '') + (x.length ? (x.days ? ' · ' : '') + esc(x.length) : '') + '</div><div class="chips">' + care + '</div></td>'
      + '<td><select class="st" data-id="' + x.id + '" data-field="status">' + opts + '</select></td>'
      + '<td>' + pay + '</td>'
      + bkCell(x.id, 'flight_status', x.flight_status)
      + bkCell(x.id, 'stay_status', x.stay_status)
      + '<td style="color:#888;white-space:nowrap">' + fmtDate(x.created_at) + '</td>'
      + '<td class="act">' + acts + '</td>'
      + '</tr>';
  }

  function bkCell(id, field, val) {
    const v = val || 'none';
    const color = v === 'booked' ? '#1b6e3d' : v === 'pending' ? '#8a4a00' : '#999';
    const opts = BK.map((s) => '<option value="' + s + '"' + (s === v ? ' selected' : '') + '>' + s + '</option>').join('');
    return '<td><select class="bk" data-id="' + id + '" data-field="' + field + '" style="color:' + color + '">' + opts + '</select></td>';
  }

  async function updateField(id, field, value, sel) {
    sel.disabled = true;
    try {
      const body = { itinerary_id: id }; body[field] = value;
      const r = await fetch('/api/admin/trip-status', {
        method: 'POST', headers: { 'content-type': 'application/json', authorization: 'Bearer ' + token },
        body: JSON.stringify(body)
      });
      if (r.ok) { const x = trips.find((tt) => tt.id === id); if (x) x[field] = value; render(); }
      else alert('Could not update.');
    } catch (e) { alert('Could not update.'); }
    sel.disabled = false;
  }

  // ── Set up the concierge-fee payment for a trip (Mosim invoices) ──
  async function setupPayment(id, btn) {
    if (!window.confirm('Create a concierge-fee payment request for this trip?')) return;
    btn.disabled = true; btn.textContent = 'Setting up…';
    try {
      const r = await fetch('/api/payment-group', {
        method: 'POST', headers: { 'content-type': 'application/json', authorization: 'Bearer ' + token },
        body: JSON.stringify({ itinerary_id: id })
      });
      const b = await r.json();
      if (r.ok && b.token) { await load(); }   // refetch — Payment column + link now populated
      else { alert(b.error || 'Could not set up payment.'); btn.disabled = false; btn.textContent = 'Set up payment'; }
    } catch (e) { alert('Could not set up payment.'); btn.disabled = false; btn.textContent = 'Set up payment'; }
  }

  // ── Bookings modal: post hotel/flight links + view customer uploads ──
  const modal = document.getElementById('bk-modal');
  let bkCurrentId = null;
  document.getElementById('bk-close').addEventListener('click', () => { modal.style.display = 'none'; });
  modal.addEventListener('click', (e) => { if (e.target === modal) modal.style.display = 'none'; });
  document.getElementById('bk-add').addEventListener('click', addLink);

  async function openBookings(id, title) {
    bkCurrentId = id;
    document.getElementById('bk-title').textContent = 'Travel bookings — ' + title;
    document.getElementById('bk-list').textContent = 'Loading…';
    modal.style.display = 'flex';
    await loadBk();
  }
  async function loadBk() {
    const list = document.getElementById('bk-list');
    let r;
    try { r = await fetch('/api/admin/bookings?itinerary_id=' + encodeURIComponent(bkCurrentId), { headers: { authorization: 'Bearer ' + token } }); }
    catch (e) { list.textContent = 'Could not load.'; return; }
    if (!r.ok) { list.textContent = 'Could not load.'; return; }
    const bks = (await r.json()).bookings || [];
    if (!bks.length) { list.innerHTML = '<div style="color:#999;font-size:14px">No bookings yet.</div>'; return; }
    list.innerHTML = bks.map(bkItem).join('');
    list.querySelectorAll('button.bk-del').forEach((b) => b.addEventListener('click', () => delLink(b.dataset.id)));
  }
  function bkItem(b) {
    const who = b.kind === 'link' ? 'Mosim' : 'Customer';
    const right = b.kind === 'link'
      ? ((b.url ? '<a href="' + esc(b.url) + '" target="_blank" rel="noopener">Open</a>' : '') + ' <button class="bk-del" data-id="' + b.id + '" style="color:#A4452F;border:none;background:none;cursor:pointer;font:inherit;font-size:13px">Delete</button>')
      : (b.signed_url ? '<a href="' + esc(b.signed_url) + '" target="_blank" rel="noopener">View file</a>' : '<span style="color:#999">file</span>');
    return '<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border-top:1px solid #eee;font-size:14px">'
      + '<span><b style="text-transform:capitalize;color:#888;font-size:12px;margin-right:8px">' + esc(b.category) + '</b>' + esc(b.label || (b.kind === 'link' ? 'Link' : 'Confirmation')) + ' <span style="color:#aaa;font-size:12px">· ' + who + '</span></span>'
      + '<span style="display:flex;gap:12px;align-items:center;flex:none">' + right + '</span></div>';
  }
  async function addLink() {
    const cat = document.getElementById('bk-newcat').value;
    const label = document.getElementById('bk-newlabel').value.trim();
    const url = document.getElementById('bk-newurl').value.trim();
    if (!url) { alert('Enter a URL (https://...).'); return; }
    const btn = document.getElementById('bk-add'); btn.disabled = true;
    try {
      const r = await fetch('/api/admin/booking-link', { method: 'POST', headers: { 'content-type': 'application/json', authorization: 'Bearer ' + token }, body: JSON.stringify({ itinerary_id: bkCurrentId, category: cat, label: label, url: url }) });
      if (r.ok) { document.getElementById('bk-newlabel').value = ''; document.getElementById('bk-newurl').value = ''; await loadBk(); }
      else { const e = await r.json().catch(() => ({})); alert(e.error || 'Could not add.'); }
    } catch (e) { alert('Could not add.'); }
    btn.disabled = false;
  }
  async function delLink(id) {
    if (!window.confirm('Delete this link?')) return;
    const r = await fetch('/api/admin/booking-link', { method: 'DELETE', headers: { 'content-type': 'application/json', authorization: 'Bearer ' + token }, body: JSON.stringify({ id: id }) });
    if (r.ok) await loadBk();
    else alert('Could not delete.');
  }

  load();
})();
</script>
</body>
</html>
