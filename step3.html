<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta property="og:site_name" content="Mosim">
<meta property="og:title" content="Mosim — You're never alone in Korea.">
<meta property="og:description" content="World-class medical care in Korea — fully arranged, with someone beside you the whole way.">
<meta property="og:image" content="https://mosimkorea.com/og-image.jpg">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mosim — Plan your trip · Step 3, Experiences</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --ivory:#F7F2EA; --ivory-soft:#FBF8F2; --navy:#1B2A4A; --navy-soft:#2A3C5E; --gold:#C39A3F; --gold-soft:#D9BD7E; --gold-tint:rgba(195,154,63,.10); --ink:#54514B; --ink-2:#8A8479; --line:#E5DBC8; }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{-webkit-text-size-adjust:100%;}
  body{background:var(--ivory); color:var(--navy); font-family:'Inter',-apple-system,system-ui,sans-serif; -webkit-font-smoothing:antialiased; line-height:1.5; padding-bottom:96px;}
  :focus-visible{ outline:2px solid var(--navy); outline-offset:2px; border-radius:4px; }
  .wrap{max-width:1200px; margin:0 auto; padding:0 36px;}
  h1,h3,.brand{font-family:'Lora',Georgia,serif;}
  a{color:inherit;}

  nav{padding:18px 0; border-bottom:1px solid var(--line);}
  .nav-in{display:flex; align-items:center; justify-content:space-between;}
  .brand{font-weight:600; font-size:22px; color:var(--navy); text-decoration:none;} .brand .dot{color:var(--gold);}
  .exit{font-size:15px; color:var(--ink); text-decoration:none; white-space:nowrap;}
  @media(max-width:600px){ .exit{display:none;} }
  .nav-right{display:flex; align-items:center; gap:18px;}
  .nav-signin{ font-size:15px; font-weight:600; color:var(--navy); background:#fff; border:1.5px solid var(--gold); border-radius:999px; padding:9px 18px; min-height:44px; display:inline-flex; align-items:center; text-decoration:none; white-space:nowrap; }
  .nav-signin:hover{ background:var(--ivory-soft); }
  .nav-cta{ font-size:15px; font-weight:600; color:#fff; background:var(--navy); border:1.5px solid var(--navy); border-radius:999px; padding:9px 18px; min-height:44px; display:inline-flex; align-items:center; text-decoration:none; white-space:nowrap; }
  .nav-cta:hover{ background:var(--navy-soft); }
  .nav-div{ width:1px; height:22px; background:var(--ink-2); display:inline-block; flex:none; }

  .head{text-align:center; padding:50px 0 6px;}
  .step-label{font-size:13px; font-weight:600; letter-spacing:2px; text-transform:uppercase; color:var(--gold);}
  .progress{display:flex; gap:8px; justify-content:center; margin:18px auto 28px; max-width:280px;}
  .progress span{flex:1; height:5px; border-radius:99px; background:var(--line);}
  .progress span.done{background:var(--gold-soft);}
  .progress span.now{background:var(--navy);}
  .head h1{font-size:clamp(30px,4.5vw,40px); font-weight:600; line-height:1.12; text-wrap:balance;}
  .head p{font-size:19px; color:var(--ink); max-width:none; margin:16px auto 0; line-height:1.6; text-wrap:balance;}

  .cards-wrap{margin:36px 0 8px;}

  .footbar{position:fixed; left:0; right:0; bottom:0; background:rgba(247,242,234,.94); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border-top:1px solid var(--line); z-index:10;}
  .fb-in{max-width:1200px; margin:0 auto; padding:16px 36px; display:flex; align-items:center; justify-content:space-between; gap:16px;}
  .back{font-size:16px; color:var(--ink); text-decoration:none; padding:10px 4px; min-height:44px; display:inline-flex; align-items:center;}
  .count{font-size:15px; color:var(--ink-2);}
  .btn{font-size:17px; font-weight:600; background:var(--navy); color:#fff; border:none; border-radius:10px; padding:15px 30px; min-height:44px; cursor:pointer; font-family:'Inter',sans-serif;}
  .btn:hover{background:var(--navy-soft);}

  @media(max-width:520px){ .head h1{font-size:28px;} }

  /* ── Ported K-Wellness culture picker (re-skinned to Warm Trust) ───── */
  #root h1, #root h2, #root h3{ font-family:'Lora', Georgia, serif; }
  /* ════════════════════════════════════════════════════════════════════
     Step 3 Culture — inherits Steps 1+2 visual system, but with a
     denser smaller-card grid (4 cols) and paginated browse (50 items
     across 3 pages: Heritage / Crafts / Modern).
     ════════════════════════════════════════════════════════════════════ */
#root { color: var(--ink); }
  #root * { box-sizing: border-box; }
  #root a { color: inherit; text-decoration: none; }
  #root a.kw-cta { color: #fff; }
  #root a.kw-cta.kw-cta-ghost { color: var(--navy); }
  #root button { font: inherit; cursor: pointer; }
  #root ul { list-style: none; margin: 0; padding: 0; }

  /* CTA */
  .kw-cta {
    display: inline-flex; align-items: center; gap: 8px;
    height: 50px; padding: 0 28px;
    border-radius: 999px; border: none;
    background: var(--gold); color: #fff;
    font-weight: 600; font-size: 17px;
    transition: background .2s, transform .1s;
    white-space: nowrap;
  }
  .kw-cta:hover { background: var(--navy); }
  .kw-cta-lg { height: 62px; padding: 0 38px; font-size: 19px; }
  .kw-cta-ghost {
    background: transparent; color: var(--navy);
    border: 1.5px solid var(--line);
  }
  .kw-cta-ghost:hover { background: var(--ivory-soft); }

  .kw-q-input { min-width: 0; }

  /* ════════════════════════════════════════════════════════════════════
     Page tabs — Heritage / Crafts / Modern
     ════════════════════════════════════════════════════════════════════ */
  .kw-pagetabs {
    display: flex; align-items: stretch; gap: 0;
    border-bottom: 1px solid var(--line);
    margin-bottom: 28px;
  }
  .kw-pagetab {
    background: transparent; border: none;
    padding: 14px 28px 16px;
    min-height: 56px;
    display: flex; flex-direction: column; gap: 4px;
    text-align: left;
    cursor: pointer;
    color: var(--ink-2);
    position: relative;
    transition: color .15s;
  }
  .kw-pagetab:hover { color: var(--navy); }
  .kw-pagetab.is-active { color: var(--navy); }
  .kw-pagetab.is-active::after {
    content: ""; position: absolute;
    left: 0; right: 0; bottom: -1px;
    height: 2px; background: var(--gold);
  }
  .kw-pagetab-num {
    font-family: 'Lora', Georgia, serif;
    font-style: italic; font-weight: 700;
    font-size: 13px;
    letter-spacing: .18em; text-transform: uppercase;
    color: var(--gold);
  }
  .kw-pagetab-label {
    font-size: 19px; font-weight: 700;
    letter-spacing: -0.012em;
    line-height: 1.1;
  }
  .kw-pagetab-count {
    font-family: 'Inter', -apple-system, system-ui, sans-serif;
    font-weight: 500; font-size: 13px;
    color: var(--ink-2);
    margin-left: 8px;
  }
  .kw-pagetab.is-active .kw-pagetab-count { color: var(--gold); }

  /* ════════════════════════════════════════════════════════════════════
     Culture-tile grid — denser, smaller cards (4 cols)
     ════════════════════════════════════════════════════════════════════ */
  .kw-cul-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
  }
  .kw-cul {
    position: relative;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 16px;
    overflow: hidden;
    cursor: pointer;
    transition: transform .25s cubic-bezier(.2,.7,.3,1),
                box-shadow .25s, border-color .25s;
    display: flex; flex-direction: column;
  }
  .kw-cul:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 28px -10px rgba(0,0,0,.18), 0 2px 8px rgba(0,0,0,.04);
    border-color: rgba(0,0,0,.08);
  }
  .kw-cul.is-selected {
    border-color: var(--gold);
    box-shadow: 0 0 0 2px var(--gold),
                0 10px 28px -10px rgba(195,154,63,.25);
  }
  /* Selected card gets a clear gold tint + a checkmark badge on the photo,
     mirroring the step-1 care tiles so a tap visibly "takes". */
  .kw-cul.is-selected .kw-cul-body { background: var(--gold-tint, rgba(195,154,63,.10)); }
  .kw-cul-check {
    position: absolute; top: 10px; left: 10px; z-index: 3;
    width: 34px; height: 34px; border-radius: 50%;
    background: var(--gold); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 19px; font-weight: 800; line-height: 1;
    box-shadow: 0 2px 8px rgba(27,42,74,.28);
  }
  .kw-cul-photo {
    position: relative;
    aspect-ratio: 4 / 3;
    background: linear-gradient(135deg, var(--photo-a, #e8e8ed) 0%, var(--photo-b, #c5c5cc) 60%, var(--photo-c, #a5a5ac) 100%);
    background-size: cover;
    background-position: center;
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  .kw-cul-photo::before {
    content: ""; position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 140% 60% at 50% 0%, rgba(255,255,255,.3), transparent 60%),
      radial-gradient(ellipse 100% 50% at 50% 100%, rgba(0,0,0,.12), transparent 60%);
    pointer-events: none;
  }
  .kw-cul-photo::after {
    content: ""; position: absolute; inset: 10px;
    border: 1px solid rgba(255,255,255,.16);
    border-radius: 6px;
    pointer-events: none;
  }
  /* When a real photo is loaded, lighten the radial gradient so the image shows through
     while keeping the inner border accent for visual consistency with placeholder cards. */
  .kw-cul-photo.has-image::before {
    background:
      linear-gradient(180deg, rgba(0,0,0,.08) 0%, transparent 40%, rgba(0,0,0,.18) 100%);
  }
  .kw-cul-photo.has-image::after {
    border-color: rgba(255,255,255,.28);
  }
  .kw-cul-monogram {
    position: relative; z-index: 1;
    font-family: 'Lora', Georgia, serif;
    font-weight: 700; font-style: italic;
    font-size: 48px;
    color: var(--photo-fg, rgba(0,0,0,.35));
    letter-spacing: -0.04em;
    line-height: 1; opacity: .6;
  }
  .kw-cul-view {
    position: absolute;
    top: 10px; right: 10px;
    z-index: 2;
    height: 28px;
    padding: 0 12px;
    border-radius: 999px;
    background: rgba(255,255,255,.92);
    backdrop-filter: blur(8px);
    color: var(--navy);
    font-size: 13px; font-weight: 700;
    letter-spacing: .06em; text-transform: uppercase;
    display: inline-flex; align-items: center; gap: 4px;
    box-shadow: 0 1px 3px rgba(0,0,0,.08);
    opacity: 0;
    transform: translateY(-4px);
    transition: opacity .2s, transform .2s;
    pointer-events: none;
  }
  .kw-cul:hover .kw-cul-view {
    opacity: 1; transform: translateY(0);
  }
  .kw-cul-body {
    padding: 14px 16px 14px;
    display: flex; flex-direction: column;
    gap: 8px; flex: 1;
  }
  .kw-cul-eyebrow {
    font-size: 14px; font-weight: 700;
    letter-spacing: .12em; text-transform: uppercase;
    color: var(--ink-2);
  }
  .kw-cul.is-selected .kw-cul-eyebrow { color: var(--gold); }
  .kw-cul-name {
    font-size: 19px; font-weight: 700;
    color: var(--navy);
    letter-spacing: -0.014em;
    line-height: 1.22;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .kw-cul-foot {
    margin-top: auto;
    display: flex; align-items: center; justify-content: space-between;
    padding-top: 10px;
    border-top: 1px solid var(--line);
    gap: 8px;
  }
  /* "& more" reveal button under the grid */
  .kw-more-row { text-align: center; margin: 26px 0 4px; }
  .kw-more-btn {
    font-size: 18px; font-weight: 600; color: var(--navy);
    background: #fff; border: 1.5px solid var(--gold); border-radius: 999px;
    padding: 13px 28px; min-height: 50px; cursor: pointer;
    transition: background .15s, box-shadow .15s;
  }
  .kw-more-btn:hover { background: var(--ivory-soft); box-shadow: 0 16px 30px -22px rgba(195,154,63,.55); }
  .kw-more-chev { margin-left: 6px; color: var(--gold); }
  .kw-cul-meta {
    font-size: 15px; font-weight: 600;
    color: var(--ink-2);
    letter-spacing: .01em;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  /* Hit area ≥44px (tap target) — the visible pill stays compact via a 32px-tall
     inner background while padding extends the tappable region to 44px. */
  .kw-cul-add {
    display: inline-flex; align-items: center; justify-content: center;
    gap: 5px;
    min-height: 44px;
    height: 44px;
    padding: 6px 14px;
    border-radius: 999px;
    background: var(--navy); color: #fff; border: none;
    font-size: 14px; font-weight: 700;
    letter-spacing: .02em;
    cursor: pointer;
    transition: background .15s, transform .15s, box-shadow .15s;
    flex: none;
  }
  .kw-cul-add:hover {
    background: var(--gold);
    transform: translateY(-1px);
  }
  .kw-cul-add-plus { font-size: 16px; font-weight: 500; line-height: 1; }
  .kw-cul.is-selected .kw-cul-add {
    background: var(--gold-tint);
    color: var(--gold);
    box-shadow: inset 0 0 0 1.5px var(--gold);
  }
  .kw-cul.is-selected .kw-cul-add:hover {
    background: var(--gold); color: #fff;
  }

  /* Single warm-neutral card surface — replaces legacy per-theme pastels */
  .kw-cul-photo, .kw-city-photo, .kw-basket-thumb {
    --photo-a:#F1E9D8; --photo-b:#E3D6BC; --photo-c:#D9BD7E; --photo-fg:#1B2A4A;
  }

  /* ═════════════════════════════════════════════════════════════════
     City cards — Page Ⅳ Beyond Seoul. One card per city.
     ═════════════════════════════════════════════════════════════════ */
  .kw-city-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
  }
  .kw-city {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 20px;
    overflow: hidden;
    cursor: pointer;
    display: flex; flex-direction: column;
    transition: transform .25s cubic-bezier(.2,.7,.3,1),
                box-shadow .25s, border-color .25s;
  }
  .kw-city:hover {
    transform: translateY(-3px);
    box-shadow: 0 16px 40px -12px rgba(0,0,0,.18), 0 4px 12px rgba(0,0,0,.04);
    border-color: rgba(0,0,0,.08);
  }
  /* Selected city — same gold ring + tint + checkmark as the experience cards,
     so picking a Jeju/Busan trip looks identical to picking any other card. */
  .kw-city.is-selected {
    border-color: var(--gold);
    box-shadow: 0 0 0 2px var(--gold),
                0 16px 40px -12px rgba(195,154,63,.28);
  }
  .kw-city.is-selected .kw-city-body { background: var(--gold-tint); }
  .kw-city-check {
    position: absolute; top: 14px; left: 14px; z-index: 3;
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--gold); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: 800; line-height: 1;
    box-shadow: 0 3px 10px rgba(27,42,74,.3);
  }
  .kw-city-photo {
    position: relative;
    aspect-ratio: 5 / 3;
    background: linear-gradient(135deg, var(--photo-a) 0%, var(--photo-b) 60%, var(--photo-c) 100%);
    background-size: cover;
    background-position: center;
    overflow: hidden;
    display: flex; align-items: center; padding: 0 24px;
    color: var(--photo-fg);
  }
  .kw-city-photo::before {
    content: ""; position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 140% 60% at 50% 0%, rgba(255,255,255,.32), transparent 60%),
      radial-gradient(ellipse 100% 50% at 50% 100%, rgba(0,0,0,.12), transparent 60%);
    pointer-events: none;
  }
  .kw-city-photo::after {
    content: ""; position: absolute; inset: 14px;
    border: 1px solid rgba(255,255,255,.2);
    border-radius: 8px;
    pointer-events: none;
  }
  /* When a real photo is loaded, swap the bright gradient overlay for a darker one
     so the region tag stays legible on top of the image. */
  .kw-city-photo.has-image {
    color: #fff;
  }
  .kw-city-photo.has-image::before {
    background:
      linear-gradient(180deg, rgba(0,0,0,.12) 0%, transparent 40%, rgba(0,0,0,.42) 100%);
  }
  .kw-city-photo.has-image::after {
    border-color: rgba(255,255,255,.32);
  }
  .kw-city-monogram {
    position: relative; z-index: 1;
    font-family: 'Lora', Georgia, serif;
    font-weight: 700; font-style: italic;
    font-size: 80px;
    letter-spacing: -0.04em;
    line-height: 1;
    opacity: .55;
  }
  .kw-city-photo-region {
    position: relative; z-index: 1;
    margin-left: auto;
    font-family: 'Lora', Georgia, serif;
    font-style: italic; font-weight: 600;
    font-size: 12px; letter-spacing: .12em;
    text-transform: uppercase;
    opacity: .85;
    text-align: right;
    max-width: 60%;
  }
  .kw-city-body {
    padding: 22px 24px 22px;
    display: flex; flex-direction: column;
    gap: 14px;
    flex: 1;
  }
  .kw-city-name {
    font-size: 26px; font-weight: 700;
    color: var(--navy);
    letter-spacing: -0.022em; line-height: 1.1;
  }
  .kw-city-desc {
    margin: 0;
    font-size: 19px; font-weight: 500;
    color: var(--ink); line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .kw-city-acts {
    display: flex; flex-wrap: wrap; gap: 6px 7px;
  }
  .kw-city-chip {
    font-size: 13px; font-weight: 600;
    padding: 5px 11px;
    border-radius: 999px;
    background: var(--ivory-soft);
    color: var(--ink);
    line-height: 1.3;
    white-space: nowrap;
  }
  .kw-city-foot {
    margin-top: auto;
    padding-top: 14px;
    border-top: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px;
  }
  /* Primary "+ Add this trip" affordance — matches the experience-card Add
     button (≥44px tap target), so city selection is obvious + consistent. */
  .kw-city-add {
    display: inline-flex; align-items: center; justify-content: center;
    gap: 6px;
    min-height: 44px; height: 44px;
    padding: 8px 20px;
    border-radius: 999px;
    background: var(--navy); color: #fff; border: none;
    font-size: 16px; font-weight: 700;
    letter-spacing: .01em;
    cursor: pointer;
    transition: background .15s, transform .15s, box-shadow .15s;
    flex: none;
  }
  .kw-city-add:hover { background: var(--gold); transform: translateY(-1px); }
  .kw-city-add-plus { font-size: 19px; font-weight: 500; line-height: 1; }
  .kw-city.is-selected .kw-city-add {
    background: var(--gold-tint); color: var(--gold);
    box-shadow: inset 0 0 0 1.5px var(--gold);
  }
  .kw-city.is-selected .kw-city-add:hover { background: var(--gold); color: #fff; }
  .kw-city-cta {
    font-size: 16px; font-weight: 700;
    color: var(--gold);
    white-space: nowrap;
    min-height: 44px;
    display: inline-flex; align-items: center;
    padding: 0 4px;
  }
  .kw-city-cta:hover { text-decoration: underline; text-underline-offset: 3px; }

  /* ════════════════════════════════════════════════════════════════════
     Pagination
     ════════════════════════════════════════════════════════════════════ */
  .kw-pagination {
    grid-column: 1 / -1;
    margin-top: 12px;
    padding: 22px 0 4px;
    display: flex; align-items: center; justify-content: center;
    gap: 6px;
  }
  .kw-pagination-btn {
    height: 38px;
    min-width: 38px;
    padding: 0 12px;
    border-radius: 999px;
    border: 1.5px solid var(--line);
    background: #fff;
    color: var(--navy);
    font-size: 14px; font-weight: 600;
    display: inline-flex; align-items: center; justify-content: center;
    gap: 6px;
    cursor: pointer;
    transition: border-color .15s, background .15s, color .15s;
  }
  .kw-pagination-btn:hover:not(:disabled) {
    border-color: var(--navy);
  }
  .kw-pagination-btn:disabled {
    opacity: .35; cursor: not-allowed;
  }
  .kw-pagination-num {
    background: transparent;
    border: none;
    color: var(--ink-2);
    font-weight: 700;
  }
  .kw-pagination-num:hover { color: var(--navy); }
  .kw-pagination-num.is-active {
    background: var(--navy); color: #fff;
    border-color: var(--navy);
  }
  .kw-pagination-info {
    margin: 0 16px;
    font-size: 13px; font-weight: 500;
    color: var(--ink-2);
  }

  /* ════════════════════════════════════════════════════════════════════
     Basket — same pattern as Step 2
     ════════════════════════════════════════════════════════════════════ */
  .kw-cul-basket {
    grid-column: 1 / -1;
    background: var(--ivory-soft);
    border-radius: 20px;
    padding: 22px 26px 24px;
    margin-top: 24px;

<script>
  (function () {
    var countEl = document.getElementById('count');

    function currentCount() {
      var picks = (window.kwState && window.kwState.loadStep('experiences')) || [];
      return Array.isArray(picks) ? picks.length : 0;
    }
    function refresh() {
      var n = currentCount();
      countEl.textContent = n === 0 ? 'Pick as many as you like'
        : (n + ' selected');
    }

    // The React component persists the experiences array on every change.
    // Re-read it after any interaction inside the picker to keep the count live.
    var root = document.getElementById('root');
    if (root) {
      root.addEventListener('click', function () { setTimeout(refresh, 0); });
    }

    // Mount once the deferred component script has loaded.
    function mount() {
      if (window.Step3Culture && window.ReactDOM && window.React) {
        ReactDOM.createRoot(document.getElementById('root'))
          .render(React.createElement(window.Step3Culture));
        refresh();
      } else {
        setTimeout(mount, 30);
      }
    }
    mount();
    refresh();

    document.getElementById('continue').addEventListener('click', function () {
      // Selection is already persisted by the component; ensure a value exists.
      if (window.kwState && window.kwState.loadStep('experiences') == null) {
        window.kwState.saveStep('experiences', []);
      }
      window.location.href = 'step4.html';
    });
  })();
</script>
