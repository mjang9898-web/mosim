<style>
  :root{ --ivory:#F7F2EA; --ivory-soft:#FBF8F2; --navy:#1B2A4A; --navy-soft:#2A3C5E; --gold:#C39A3F; --gold-soft:#D9BD7E; --ink:#54514B; --ink-2:#8A8479; --line:#E5DBC8; }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{-webkit-text-size-adjust:100%;}
  body{background:var(--ivory); color:var(--navy); font-family:'Inter',-apple-system,system-ui,sans-serif; -webkit-font-smoothing:antialiased; line-height:1.5; padding-bottom:96px;}
  :focus-visible{ outline:2px solid var(--navy); outline-offset:2px; border-radius:4px; }
  .wrap{max-width:1200px; margin:0 auto; padding:0 36px;}
  h1,h3,.brand{font-family:'Lora',Georgia,serif;}
  a{color:inherit;}

  nav{padding:18px 0; border-bottom:1px solid var(--line);}
  .nav-in{display:flex; align-items:center; justify-content:space-between;}
  .brand{font-weight:600; font-size:22px; color:var(--navy); text-decoration:none;} .brand .dot{color:var(--gold);}
  .exit{font-size:15px; color:var(--ink); text-decoration:none; white-space:nowrap;}
  @media(max-width:600px){ .exit{display:none;} }
  .nav-right{display:flex; align-items:center; gap:18px;}
  .nav-signin{ font-size:15px; font-weight:600; color:var(--navy); background:#fff; border:1.5px solid var(--gold); border-radius:999px; padding:9px 18px; min-height:44px; display:inline-flex; align-items:center; text-decoration:none; white-space:nowrap; }
  .nav-signin:hover{ background:var(--ivory-soft); }
  .nav-cta{ font-size:15px; font-weight:600; color:#fff; background:var(--navy); border:1.5px solid var(--navy); border-radius:999px; padding:9px 18px; min-height:44px; display:inline-flex; align-items:center; text-decoration:none; white-space:nowrap; }
  .nav-cta:hover{ background:var(--navy-soft); }
  .nav-div{ width:1px; height:22px; background:var(--ink-2); display:inline-block; flex:none; }

  .head{text-align:center; padding:50px 0 6px;}
  .step-label{font-size:13px; font-weight:600; letter-spacing:2px; text-transform:uppercase; color:var(--gold);}
  .progress{display:flex; gap:8px; justify-content:center; margin:18px auto 28px; max-width:280px;}
  .progress span{flex:1; height:5px; border-radius:99px; background:var(--line);}
  .progress span.done{background:var(--gold-soft);}
  .progress span.now{background:var(--navy);}
  .head h1{font-size:clamp(30px,4.5vw,40px); font-weight:600; line-height:1.12; text-wrap:balance;}
  .head p{font-size:19px; color:var(--ink); max-width:34em; margin:16px auto 0; line-height:1.6; text-wrap:balance;}

  .tiles{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin:40px 0 8px;}
  .tile{background:var(--ivory-soft); border:2px solid var(--line); border-radius:14px; padding:20px; cursor:pointer; text-align:left; position:relative; min-height:120px; transition:border-color .12s, box-shadow .12s;}
  .tile:hover{border-color:var(--gold-soft);}
  .tile.sel{border-color:var(--gold); background:#fff; box-shadow:0 12px 30px -16px rgba(195,154,63,.55);}
  .tile h3{font-size:19px; font-weight:600; margin-bottom:6px;}
  .tile p{font-size:15px; color:var(--ink); line-height:1.45;}
  .tile .check{position:absolute; top:14px; right:14px; width:24px; height:24px; border-radius:50%; border:2px solid var(--line); display:flex; align-items:center; justify-content:center; color:#fff; font-size:14px; font-weight:700;}
  .tile.sel .check{background:var(--gold); border-color:var(--gold);}
  .tile.wide{grid-column:1 / -1; min-height:0;}

  .footbar{position:fixed; left:0; right:0; bottom:0; background:rgba(247,242,234,.94); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border-top:1px solid var(--line); z-index:10;}
  .fb-in{max-width:1200px; margin:0 auto; padding:16px 36px; display:flex; align-items:center; justify-content:space-between; gap:16px;}
  .back{font-size:16px; color:var(--ink); text-decoration:none; padding:10px 4px; min-height:44px; display:inline-flex; align-items:center;}
  .count{font-size:15px; color:var(--ink-2);}
  .btn{font-size:17px; font-weight:600; background:var(--navy); color:#fff; border:none; border-radius:10px; padding:15px 30px; min-height:44px; cursor:pointer; font-family:'Inter',sans-serif;}
  .btn:hover{background:var(--navy-soft);}

  @media(max-width:760px){ .tiles{grid-template-columns:1fr 1fr;} }
  @media(max-width:520px){ .tiles{grid-template-columns:1fr;} .head h1{font-size:28px;} }
</style>

<body>

<nav><div class="wrap nav-in">
  <a href="index.html" class="brand">Mosim<span class="dot">.</span></a>
  <div class="nav-right">
    <a href="index.html" class="exit">Save &amp; exit</a>
    <a id="nav-auth" href="/signin.html" class="nav-signin">Sign in</a>
    <span class="nav-div" aria-hidden="true"></span>
    <a href="/step1.html" class="nav-cta">Plan my trip</a>
  </div>
</div></nav>

<div class="wrap">
  <div class="head">
    <div class="step-label">Step 3 of 4 · Experiences</div>
    <div class="progress"><span class="done"></span><span class="done"></span><span class="now"></span><span></span></div>
    <h1>What would you love to experience?</h1>
    <p>Pick anything that speaks to you, between your appointments — choose freely. Nothing is locked in, and nothing will be rushed.</p>
  </div>

  <div class="tiles" id="tiles">
    <button class="tile" data-key="heritage" type="button"><h3>Heritage</h3><p>Palaces, hanok villages, quiet history.</p><span class="check">✓</span></button>
    <button class="tile" data-key="cuisine" type="button"><h3>Korean cuisine</h3><p>Comforting, gentle, unforgettable.</p><span class="check">✓</span></button>
    <button class="tile" data-key="markets" type="button"><h3>Markets &amp; shopping</h3><p>Insadong, Namdaemun — at an easy pace.</p><span class="check">✓</span></button>
    <button class="tile" data-key="nature" type="button"><h3>Nature &amp; temples</h3><p>Calm gardens, mountain temples, fresh air.</p><span class="check">✓</span></button>
    <button class="tile" data-key="spa" type="button"><h3>Spa &amp; rest</h3><p>Gentle recovery days between appointments.</p><span class="check">✓</span></button>
    <button class="tile" data-key="beyond" type="button"><h3>Beyond Seoul</h3><p>Coast or countryside — a day, or a few.</p><span class="check">✓</span></button>
    <button class="tile wide" data-key="minimal" type="button"><h3>Just the essentials</h3><p>Keep it light — I'm here for care, not sightseeing.</p><span class="check">✓</span></button>
  </div>
</div>

<div class="footbar"><div class="fb-in">
  <a href="step2.html" class="back">← Back</a>
  <span class="count" id="count">Pick as many as you like</span>
  <button class="btn" id="continue" type="button">Continue →</button>
</div></div>

<script src="js/state.js"></script>
<script>
  (function () {
    var tiles = document.getElementById('tiles');
    var countEl = document.getElementById('count');
    var minimalTile = tiles.querySelector('[data-key="minimal"]');

    function selected() {
      return Array.prototype.slice.call(tiles.querySelectorAll('.tile.sel'))
        .map(function (t) { return t.getAttribute('data-key'); });
    }
    function refresh() {
      var n = selected().length;
      countEl.textContent = n === 0 ? 'Pick as many as you like' : (n + ' selected');
    }

    tiles.addEventListener('click', function (ev) {
      var t = ev.target.closest('.tile');
      if (!t) return;
      var isMinimal = t === minimalTile;
      if (isMinimal) {
        // "Just the essentials" is exclusive — clears the rest.
        var turningOn = !t.classList.contains('sel');
        Array.prototype.forEach.call(tiles.querySelectorAll('.tile'), function (x) { x.classList.remove('sel'); });
        if (turningOn) t.classList.add('sel');
      } else {
        minimalTile.classList.remove('sel');
        t.classList.toggle('sel');
      }
      refresh();
    });

    // restore
    var prior = (window.kwState && kwState.loadStep('experiences')) || null;
    if (prior && prior.length) {
      prior.forEach(function (k) {
        var t = tiles.querySelector('[data-key="' + k + '"]');
        if (t) t.classList.add('sel');
      });
    }
    refresh();

    document.getElementById('continue').addEventListener('click', function () {
      if (window.kwState) kwState.saveStep('experiences', selected());
      window.location.href = 'step4.html';
    });
  })();
</script>

</body>
</html>
