<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>K-Wellness Concierge — Step 3 · Culture</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Nanum+Myeongjo:wght@400;700;800&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,700&display=swap" rel="stylesheet" />
<style>
  /* ════════════════════════════════════════════════════════════════════
     Step 3 Culture — inherits Steps 1+2 visual system, but with a
     denser smaller-card grid (4 cols) and paginated browse (50 items
     across 3 pages: Heritage / Crafts / Modern).
     ════════════════════════════════════════════════════════════════════ */
  :root {
    --kw-bg: #ffffff;
    --kw-bg-soft: #f5f5f7;
    --kw-bg-warm: #f0eee9;
    --kw-ink: #1d1d1f;
    --kw-ink-2: #2a2a2c;
    --kw-ink-3: #4a4a4d;
    --kw-line: #d2d2d7;
    --kw-rule: #e8e8ed;
    --kw-accent: #B21464;
    --kw-accent-deep: #8a0e4d;
    --kw-accent-soft: rgba(178,20,100,.08);
    --kw-gold: #b48a3a;
  }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
                 Inter, "Helvetica Neue", Arial, sans-serif;
    font-size: 19px; line-height: 1.5; font-weight: 500;
    color: var(--kw-ink); background: var(--kw-bg);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  .kw-screen { background: var(--kw-bg); color: var(--kw-ink); position: relative; min-height: 100vh; }
  .kw-screen * { box-sizing: border-box; }
  .kw-screen a { color: inherit; text-decoration: none; }
  .kw-screen a.kw-cta { color: #fff; }
  .kw-screen a.kw-cta.kw-cta-ghost { color: var(--kw-ink); }
  .kw-screen button { font: inherit; cursor: pointer; }
  .kw-screen ul { list-style: none; margin: 0; padding: 0; }

  /* Nav (same as Steps 1/2) */
  .kw-nav {
    position: sticky; top: 0; z-index: 50;
    background: rgba(255, 255, 255, .82);
    backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid var(--kw-rule);
    height: 68px;
  }
  .kw-nav-inner {
    height: 100%; max-width: 1440px; margin: 0 auto;
    padding: 0 32px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .kw-brand { display: flex; align-items: center; gap: 12px; }
  .kw-brand .kw-wm { font-weight: 700; font-size: 19px; color: var(--kw-ink); }
  .kw-navlist { display: flex; gap: 22px; font-size: 14px; font-weight: 600; }
  .kw-navlist a { color: var(--kw-ink); padding: 6px 0; position: relative; transition: color .15s; }
  .kw-navlist a:hover { color: var(--kw-accent); }
  .kw-navlist a.is-active { color: var(--kw-accent); }
  .kw-navlist a.is-active::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: -4px;
    height: 2px; background: var(--kw-accent); border-radius: 2px;
  }
  .kw-nav-right { display: flex; align-items: center; gap: 18px; }
  .kw-link-q { font-size: 14px; font-weight: 600; color: var(--kw-ink); }

  /* CTA */
  .kw-cta {
    display: inline-flex; align-items: center; gap: 8px;
    height: 50px; padding: 0 28px;
    border-radius: 999px; border: none;
    background: var(--kw-accent); color: #fff;
    font-weight: 600; font-size: 17px;
    transition: background .2s, transform .1s;
    white-space: nowrap;
  }
  .kw-cta:hover { background: var(--kw-accent-deep); }
  .kw-cta-sm { height: 38px; padding: 0 18px; font-size: 14px; }
  .kw-cta-lg { height: 62px; padding: 0 38px; font-size: 19px; }
  .kw-cta-ghost {
    background: transparent; color: var(--kw-ink);
    border: 1.5px solid var(--kw-line);
  }
  .kw-cta-ghost:hover { background: var(--kw-bg-soft); }

  /* Stepbar */
  .kw-stepbar-horizontal {
    display: flex; align-items: center; padding: 28px 0;
  }
  .kw-step { display: inline-flex; align-items: center; gap: 10px; flex: none; }
  .kw-step-num {
    width: 28px; height: 28px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; letter-spacing: .04em;
    border: 1.5px solid var(--kw-line);
    color: var(--kw-ink-3); background: #fff;
  }
  .kw-step-label { font-size: 14px; font-weight: 600; color: var(--kw-ink-3); }
  .kw-step-active .kw-step-num {
    background: var(--kw-accent); color: #fff; border-color: var(--kw-accent);
  }
  .kw-step-active .kw-step-label { color: var(--kw-ink); }
  .kw-step-done .kw-step-num {
    background: var(--kw-ink); color: #fff; border-color: var(--kw-ink);
    font-size: 13px;
  }
  .kw-step-done .kw-step-label { color: var(--kw-ink); }
  .kw-step-rule {
    flex: 1 1 auto; min-width: 24px;
    height: 1.5px; background: var(--kw-rule);
    margin: 0 14px;
  }

  /* Eyebrow */
  .kw-eyebrow { display: inline-flex; align-items: baseline; gap: 12px; color: var(--kw-accent); }
  .kw-eyebrow-num { font-family: 'Nanum Myeongjo', serif; font-weight: 700; font-size: 13px; letter-spacing: .08em; }
  .kw-eyebrow-text { font-size: 13px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }

  /* Page wrap & hero */
  .kw-wrap { max-width: 1240px; margin: 0 auto; padding: 0 40px; }
  .kw-page-hero { padding: 8px 0 40px; }
  .kw-page-hero h1 {
    font-size: clamp(36px, 4vw, 56px); font-weight: 700;
    letter-spacing: -0.025em; line-height: 1.05;
    margin: 14px 0 16px; color: var(--kw-ink);
  }
  .kw-page-hero h1 .kw-accent { color: var(--kw-accent); }
  .kw-page-hero p {
    font-size: clamp(17px, 1.3vw, 19px); font-weight: 500;
    line-height: 1.45; color: var(--kw-ink-2);
    max-width: 64ch;
  }

  /* Sub-step header (matches Step 2) */
  .kw-substep {
    margin: 8px 0 24px;
    padding: 22px 0 18px;
    border-bottom: 1px solid var(--kw-rule);
    display: flex; align-items: baseline; gap: 24px; flex-wrap: wrap;
  }
  .kw-substep-l { display: flex; align-items: baseline; gap: 20px; flex: 1 1 auto; min-width: 0; }
  .kw-substep-numeral {
    font-family: 'Playfair Display', serif; font-weight: 700; font-style: italic;
    font-size: 13px; color: var(--kw-accent);
    letter-spacing: .18em; text-transform: uppercase;
    white-space: nowrap;
  }
  .kw-substep-title {
    font-size: clamp(28px, 2.4vw, 36px); font-weight: 700;
    letter-spacing: -0.024em; line-height: 1.1; color: var(--kw-ink);
  }
  .kw-substep-hint {
    font-size: 14px; font-weight: 500; color: var(--kw-ink-3);
    flex: 0 1 360px; text-align: right; line-height: 1.45;
    white-space: nowrap;
  }

  /* Q-row (same pattern as Step 1/2) */
  .kw-q-row {
    display: grid;
    grid-template-columns: 360px 1fr;
    gap: 48px;
    padding: 40px 0;
    border-top: 1px solid var(--kw-rule);
  }
  .kw-q-row:first-of-type { border-top: none; padding-top: 16px; }
  .kw-q-row-full { grid-template-columns: 1fr; }
  .kw-substep + .kw-q-row { border-top: none; padding-top: 24px; }
  .kw-q-title {
    font-size: 26px; font-weight: 700;
    letter-spacing: -0.018em; line-height: 1.15;
    margin: 10px 0; color: var(--kw-ink);
    white-space: nowrap;
  }
  .kw-q-help { font-size: 14px; font-weight: 500; color: var(--kw-ink-3); line-height: 1.45; }
  .kw-q-input { min-width: 0; }

  /* Notes-card (matches Step 2) — for the optional notes section */
  .kw-notes-card {
    background: var(--kw-bg-warm);
    border: 1px solid var(--kw-line);
    border-radius: 18px;
    padding: 20px 22px 22px;
    box-shadow: inset 4px 0 0 var(--kw-accent);
  }
  .kw-notes-card-head {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; margin-bottom: 14px;
  }
  .kw-notes-card-label {
    display: inline-flex; align-items: center; gap: 10px;
    font-size: 12px; font-weight: 700;
    letter-spacing: .14em; color: var(--kw-accent);
    text-transform: uppercase;
  }
  .kw-notes-card-pen {
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--kw-accent); color: #fff;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700;
  }
  .kw-notes-card-secure {
    font-size: 11px; font-weight: 600;
    color: var(--kw-ink-3); letter-spacing: .04em;
  }
  .kw-notes-card .kw-textarea {
    width: 100%;
    background: #fff;
    border: 1.5px solid var(--kw-line);
    border-radius: 12px;
    min-height: 120px;
    padding: 18px 20px;
    font: inherit;
    font-size: 16px; color: var(--kw-ink);
    line-height: 1.5; resize: vertical;
  }
  .kw-notes-card .kw-textarea:focus {
    border-color: var(--kw-accent);
    box-shadow: 0 0 0 3px var(--kw-accent-soft);
    outline: none;
  }
  .kw-notes-card-foot {
    margin-top: 12px;
    font-size: 12px; font-weight: 500; color: var(--kw-ink-3);
  }
  /* Example placeholder clears the moment the box is clicked */
  .kw-textarea:focus::placeholder { color: transparent; }

  /* Action bar */
  .kw-actionbar {
    margin-top: 56px; padding: 28px 0 48px;
    border-top: 1px solid var(--kw-rule);
    display: flex; align-items: center; justify-content: space-between;
    gap: 24px;
  }
  .kw-actionbar-l { display: flex; align-items: center; gap: 14px; }
  .kw-actionbar-note { font-size: 13px; font-weight: 500; color: var(--kw-ink-3); }

  /* ════════════════════════════════════════════════════════════════════
     Page tabs — Heritage / Crafts / Modern
     ════════════════════════════════════════════════════════════════════ */
  .kw-pagetabs {
    display: flex; align-items: stretch; gap: 0;
    border-bottom: 1px solid var(--kw-rule);
    margin-bottom: 28px;
  }
  .kw-pagetab {
    background: transparent; border: none;
    padding: 16px 28px 18px;
    display: flex; flex-direction: column; gap: 4px;
    text-align: left;
    cursor: pointer;
    color: var(--kw-ink-3);
    position: relative;
    transition: color .15s;
  }
  .kw-pagetab:hover { color: var(--kw-ink); }
  .kw-pagetab.is-active { color: var(--kw-ink); }
  .kw-pagetab.is-active::after {
    content: ""; position: absolute;
    left: 0; right: 0; bottom: -1px;
    height: 2px; background: var(--kw-accent);
  }
  .kw-pagetab-num {
    font-family: 'Playfair Display', serif;
    font-style: italic; font-weight: 700;
    font-size: 12px;
    letter-spacing: .18em; text-transform: uppercase;
    color: var(--kw-accent);
  }
  .kw-pagetab-label {
    font-size: 19px; font-weight: 700;
    letter-spacing: -0.012em;
    line-height: 1.1;
  }
  .kw-pagetab-count {
    font-family: 'Inter', sans-serif;
    font-weight: 500; font-size: 13px;
    color: var(--kw-ink-3);
    margin-left: 8px;
  }
  .kw-pagetab.is-active .kw-pagetab-count { color: var(--kw-accent); }

  /* ════════════════════════════════════════════════════════════════════
     Culture-tile grid — denser, smaller cards (4 cols)
     ════════════════════════════════════════════════════════════════════ */
  .kw-cul-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
  }
  .kw-cul {
    position: relative;
    background: #fff;
    border: 1px solid var(--kw-rule);
    border-radius: 16px;
    overflow: hidden;
    cursor: pointer;
    transition: transform .25s cubic-bezier(.2,.7,.3,1),
                box-shadow .25s, border-color .25s;
    display: flex; flex-direction: column;
  }
  .kw-cul:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 28px -10px rgba(0,0,0,.18), 0 2px 8px rgba(0,0,0,.04);
    border-color: rgba(0,0,0,.08);
  }
  .kw-cul.is-selected {
    border-color: var(--kw-accent);
    box-shadow: 0 0 0 2px var(--kw-accent),
                0 10px 28px -10px rgba(178,20,100,.25);
  }
  .kw-cul-photo {
    position: relative;
    aspect-ratio: 4 / 3;
    background: linear-gradient(135deg, var(--photo-a, #e8e8ed) 0%, var(--photo-b, #c5c5cc) 60%, var(--photo-c, #a5a5ac) 100%);
    background-size: cover;
    background-position: center;
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  .kw-cul-photo::before {
    content: ""; position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 140% 60% at 50% 0%, rgba(255,255,255,.3), transparent 60%),
      radial-gradient(ellipse 100% 50% at 50% 100%, rgba(0,0,0,.12), transparent 60%);
    pointer-events: none;
  }
  .kw-cul-photo::after {
    content: ""; position: absolute; inset: 10px;
    border: 1px solid rgba(255,255,255,.16);
    border-radius: 6px;
    pointer-events: none;
  }
  /* When a real photo is loaded, lighten the radial gradient so the image shows through
     while keeping the inner border accent for visual consistency with placeholder cards. */
  .kw-cul-photo.has-image::before {
    background:
      linear-gradient(180deg, rgba(0,0,0,.08) 0%, transparent 40%, rgba(0,0,0,.18) 100%);
  }
  .kw-cul-photo.has-image::after {
    border-color: rgba(255,255,255,.28);
  }
  .kw-cul-monogram {
    position: relative; z-index: 1;
    font-family: 'Playfair Display', serif;
    font-weight: 700; font-style: italic;
    font-size: 48px;
    color: var(--photo-fg, rgba(0,0,0,.35));
    letter-spacing: -0.04em;
    line-height: 1; opacity: .6;
  }
  .kw-cul-view {
    position: absolute;
    top: 10px; right: 10px;
    z-index: 2;
    height: 24px;
    padding: 0 10px;
    border-radius: 999px;
    background: rgba(255,255,255,.92);
    backdrop-filter: blur(8px);
    color: var(--kw-ink);
    font-size: 10px; font-weight: 700;
    letter-spacing: .08em; text-transform: uppercase;
    display: inline-flex; align-items: center; gap: 4px;
    box-shadow: 0 1px 3px rgba(0,0,0,.08);
    opacity: 0;
    transform: translateY(-4px);
    transition: opacity .2s, transform .2s;
    pointer-events: none;
  }
  .kw-cul:hover .kw-cul-view {
    opacity: 1; transform: translateY(0);
  }
  .kw-cul-body {
    padding: 14px 16px 14px;
    display: flex; flex-direction: column;
    gap: 8px; flex: 1;
  }
  .kw-cul-eyebrow {
    font-size: 10px; font-weight: 700;
    letter-spacing: .14em; text-transform: uppercase;
    color: var(--kw-ink-3);
  }
  .kw-cul.is-selected .kw-cul-eyebrow { color: var(--kw-accent); }
  .kw-cul-name {
    font-size: 15px; font-weight: 700;
    color: var(--kw-ink);
    letter-spacing: -0.012em;
    line-height: 1.2;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .kw-cul-foot {
    margin-top: auto;
    display: flex; align-items: center; justify-content: space-between;
    padding-top: 10px;
    border-top: 1px solid var(--kw-rule);
    gap: 8px;
  }
  .kw-cul-meta {
    font-size: 11px; font-weight: 600;
    color: var(--kw-ink-3);
    letter-spacing: .01em;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .kw-cul-add {
    display: inline-flex; align-items: center; justify-content: center;
    gap: 4px;
    height: 28px;
    padding: 0 10px;
    border-radius: 999px;
    background: var(--kw-ink); color: #fff; border: none;
    font-size: 11px; font-weight: 700;
    letter-spacing: .02em;
    cursor: pointer;
    transition: background .15s, transform .15s, box-shadow .15s;
    flex: none;
  }
  .kw-cul-add:hover {
    background: var(--kw-accent);
    transform: translateY(-1px);
  }
  .kw-cul-add-plus { font-size: 13px; font-weight: 500; line-height: 1; }
  .kw-cul.is-selected .kw-cul-add {
    background: var(--kw-accent-soft);
    color: var(--kw-accent);
    box-shadow: inset 0 0 0 1.5px var(--kw-accent);
  }
  .kw-cul.is-selected .kw-cul-add:hover {
    background: var(--kw-accent); color: #fff;
  }

  /* Per-category photo palettes — earthy, royal, modern */
  .kw-photo-heritage  { --photo-a:#e8e3dc; --photo-b:#c4ad84; --photo-c:#8b6f3f; --photo-fg:#3a2a14; }
  .kw-photo-palace    { --photo-a:#f0e5d0; --photo-b:#d4ad6b; --photo-c:#8b3a2a; --photo-fg:#3a1a1a; }
  .kw-photo-hanok     { --photo-a:#e8dcc7; --photo-b:#b8945f; --photo-c:#5a3a1e; --photo-fg:#2a1a0a; }
  .kw-photo-temple    { --photo-a:#d9d0bf; --photo-b:#9a8268; --photo-c:#5a4632; --photo-fg:#2a1f12; }
  .kw-photo-museum    { --photo-a:#dfdde4; --photo-b:#a8a4b8; --photo-c:#5e5a7c; --photo-fg:#1a1a3a; }
  .kw-photo-garden    { --photo-a:#d2dcc4; --photo-b:#92a374; --photo-c:#4a5a36; --photo-fg:#1a2a14; }
  .kw-photo-crafts    { --photo-a:#ecd9bf; --photo-b:#c4955e; --photo-c:#7a5530; --photo-fg:#3a2410; }
  .kw-photo-tea       { --photo-a:#d8e1c8; --photo-b:#94a872; --photo-c:#4a5a36; --photo-fg:#1a2a14; }
  .kw-photo-spa       { --photo-a:#d4e0e2; --photo-b:#88aab0; --photo-c:#3f6066; --photo-fg:#1a3a3e; }
  .kw-photo-nature    { --photo-a:#cfd9c4; --photo-b:#7a8e62; --photo-c:#3a4628; --photo-fg:#1a2410; }
  .kw-photo-music     { --photo-a:#e0d6e4; --photo-b:#9c8eac; --photo-c:#54467a; --photo-fg:#1f1a3a; }
  .kw-photo-perform   { --photo-a:#e6c8d4; --photo-b:#b87090; --photo-c:#6a1a3e; --photo-fg:#3a0a1e; }
  .kw-photo-kpop      { --photo-a:#e8d4e6; --photo-b:#c08bca; --photo-c:#722f7e; --photo-fg:#3a0a3e; }
  .kw-photo-market    { --photo-a:#f0d8c4; --photo-b:#d49a64; --photo-c:#8a4a2a; --photo-fg:#3a1a10; }
  .kw-photo-modern    { --photo-a:#d4d7e0; --photo-b:#8c92a8; --photo-c:#3a4060; --photo-fg:#0e1430; }
  .kw-photo-dmz       { --photo-a:#d4d0c4; --photo-b:#8a8278; --photo-c:#3a3630; --photo-fg:#1a1814; }
  .kw-photo-shop      { --photo-a:#f0dfe6; --photo-b:#cf8aa6; --photo-c:#7a2a4e; --photo-fg:#3a0f24; }
  .kw-photo-sport     { --photo-a:#d4e3d0; --photo-b:#82a878; --photo-c:#2e4a26; --photo-fg:#0e2410; }
  .kw-photo-jeju      { --photo-a:#d8efe8; --photo-b:#62b09e; --photo-c:#1f4a3e; --photo-fg:#0a2418; }
  .kw-photo-ocean     { --photo-a:#d4e2ec; --photo-b:#6e9cba; --photo-c:#1a3e5e; --photo-fg:#0a1e3a; }

  /* ════════════════════════════════════════════════════════════════════
     Top packages — "I don't know, just pick one for me" preset bundles
     ════════════════════════════════════════════════════════════════════ */
  .kw-pkg-band {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 18px; flex-wrap: wrap;
    margin: 0 0 14px;
  }
  .kw-pkg-band-l {
    display: flex; align-items: baseline; gap: 14px;
    flex: 1 1 auto; min-width: 0;
  }
  .kw-pkg-band-eyebrow {
    font-family: 'Playfair Display', serif;
    font-weight: 700; font-style: italic;
    font-size: 12px; letter-spacing: .18em;
    text-transform: uppercase; color: var(--kw-accent);
    white-space: nowrap;
  }
  .kw-pkg-band-title {
    font-size: 20px; font-weight: 700;
    color: var(--kw-ink); letter-spacing: -0.012em;
  }
  .kw-pkg-band-hint {
    font-size: 13px; font-weight: 500;
    color: var(--kw-ink-3); line-height: 1.4;
  }

  .kw-pkg-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    margin-bottom: 36px;
  }
  .kw-pkg {
    position: relative;
    background: #fff;
    border: 1px solid var(--kw-rule);
    border-radius: 18px;
    overflow: hidden;
    cursor: pointer;
    display: flex; flex-direction: column;
    transition: transform .25s cubic-bezier(.2,.7,.3,1),
                box-shadow .25s, border-color .25s;
  }
  .kw-pkg:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 32px -10px rgba(0,0,0,.18), 0 2px 8px rgba(0,0,0,.04);
    border-color: rgba(0,0,0,.1);
  }
  .kw-pkg.is-selected {
    border-color: var(--kw-accent);
    box-shadow: 0 0 0 2px var(--kw-accent),
                0 12px 32px -10px rgba(178,20,100,.25);
  }
  .kw-pkg-banner {
    position: relative;
    height: 92px;
    background: linear-gradient(135deg, var(--photo-a) 0%, var(--photo-b) 60%, var(--photo-c) 100%);
    overflow: hidden;
    display: flex; align-items: center; padding: 0 22px;
    color: var(--photo-fg);
  }
  .kw-pkg-banner::before {
    content: "";
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 140% 60% at 50% 0%, rgba(255,255,255,.32), transparent 60%),
      radial-gradient(ellipse 100% 50% at 50% 100%, rgba(0,0,0,.12), transparent 60%);
    pointer-events: none;
  }
  .kw-pkg-banner-letter {
    position: relative; z-index: 1;
    font-family: 'Playfair Display', serif;
    font-weight: 700; font-style: italic;
    font-size: 56px;
    line-height: 1; letter-spacing: -0.04em;
    opacity: .55;
    flex: none;
  }
  .kw-pkg-banner-cap {
    position: relative; z-index: 1;
    margin-left: auto;
    font-family: 'Playfair Display', serif;
    font-style: italic; font-weight: 600;
    font-size: 11px; letter-spacing: .12em;
    text-transform: uppercase;
    opacity: .8;
  }
  .kw-pkg-body {
    padding: 18px 22px 22px;
    display: flex; flex-direction: column; gap: 12px;
    flex: 1;
  }
  .kw-pkg-name {
    font-size: 19px; font-weight: 700;
    color: var(--kw-ink);
    letter-spacing: -0.018em; line-height: 1.15;
  }
  .kw-pkg-desc {
    font-size: 13px; font-weight: 500;
    color: var(--kw-ink-3); line-height: 1.45;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .kw-pkg-includes {
    display: flex; flex-wrap: wrap; gap: 4px 6px;
  }
  .kw-pkg-chip {
    font-size: 11px; font-weight: 600;
    padding: 4px 9px;
    border-radius: 999px;
    background: var(--kw-bg-soft);
    color: var(--kw-ink-2);
    line-height: 1.3;
    white-space: nowrap;
  }
  .kw-pkg.is-selected .kw-pkg-chip {
    background: var(--kw-accent-soft);
    color: var(--kw-accent);
  }
  .kw-pkg-foot {
    margin-top: auto;
    display: flex; align-items: center; justify-content: space-between;
    padding-top: 14px;
    border-top: 1px solid var(--kw-rule);
    gap: 12px;
  }
  .kw-pkg-meta {
    font-size: 12px; font-weight: 600;
    color: var(--kw-ink-3);
    letter-spacing: .01em;
  }
  .kw-pkg-cta {
    display: inline-flex; align-items: center; justify-content: center;
    height: 32px;
    padding: 0 14px;
    border-radius: 999px;
    background: var(--kw-ink); color: #fff;
    border: none;
    font-size: 12px; font-weight: 700;
    letter-spacing: .02em;
    white-space: nowrap;
    cursor: pointer;
    transition: background .15s, transform .15s;
  }

  /* ═════════════════════════════════════════════════════════════════
     City cards — Page Ⅳ Beyond Seoul. One card per city.
     ═════════════════════════════════════════════════════════════════ */
  .kw-city-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
  }
  .kw-city {
    background: #fff;
    border: 1px solid var(--kw-rule);
    border-radius: 20px;
    overflow: hidden;
    cursor: pointer;
    display: flex; flex-direction: column;
    transition: transform .25s cubic-bezier(.2,.7,.3,1),
                box-shadow .25s, border-color .25s;
  }
  .kw-city:hover {
    transform: translateY(-3px);
    box-shadow: 0 16px 40px -12px rgba(0,0,0,.18), 0 4px 12px rgba(0,0,0,.04);
    border-color: rgba(0,0,0,.08);
  }
  .kw-city-photo {
    position: relative;
    aspect-ratio: 5 / 3;
    background: linear-gradient(135deg, var(--photo-a) 0%, var(--photo-b) 60%, var(--photo-c) 100%);
    background-size: cover;
    background-position: center;
    overflow: hidden;
    display: flex; align-items: center; padding: 0 24px;
    color: var(--photo-fg);
  }
  .kw-city-photo::before {
    content: ""; position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 140% 60% at 50% 0%, rgba(255,255,255,.32), transparent 60%),
      radial-gradient(ellipse 100% 50% at 50% 100%, rgba(0,0,0,.12), transparent 60%);
    pointer-events: none;
  }
  .kw-city-photo::after {
    content: ""; position: absolute; inset: 14px;
    border: 1px solid rgba(255,255,255,.2);
    border-radius: 8px;
    pointer-events: none;
  }
  /* When a real photo is loaded, swap the bright gradient overlay for a darker one
     so the region tag stays legible on top of the image. */
  .kw-city-photo.has-image {
    color: #fff;
  }
  .kw-city-photo.has-image::before {
    background:
      linear-gradient(180deg, rgba(0,0,0,.12) 0%, transparent 40%, rgba(0,0,0,.42) 100%);
  }
  .kw-city-photo.has-image::after {
    border-color: rgba(255,255,255,.32);
  }
  .kw-city-monogram {
    position: relative; z-index: 1;
    font-family: 'Playfair Display', serif;
    font-weight: 700; font-style: italic;
    font-size: 80px;
    letter-spacing: -0.04em;
    line-height: 1;
    opacity: .55;
  }
  .kw-city-photo-region {
    position: relative; z-index: 1;
    margin-left: auto;
    font-family: 'Playfair Display', serif;
    font-style: italic; font-weight: 600;
    font-size: 12px; letter-spacing: .12em;
    text-transform: uppercase;
    opacity: .85;
    text-align: right;
    max-width: 60%;
  }
  .kw-city-body {
    padding: 22px 24px 22px;
    display: flex; flex-direction: column;
    gap: 14px;
    flex: 1;
  }
  .kw-city-name {
    font-size: 26px; font-weight: 700;
    color: var(--kw-ink);
    letter-spacing: -0.022em; line-height: 1.1;
  }
  .kw-city-desc {
    margin: 0;
    font-size: 13px; font-weight: 500;
    color: var(--kw-ink-3); line-height: 1.45;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .kw-city-acts {
    display: flex; flex-wrap: wrap; gap: 5px 6px;
  }
  .kw-city-chip {
    font-size: 11px; font-weight: 600;
    padding: 4px 9px;
    border-radius: 999px;
    background: var(--kw-bg-soft);
    color: var(--kw-ink-2);
    line-height: 1.3;
    white-space: nowrap;
  }
  .kw-city-foot {
    margin-top: auto;
    padding-top: 14px;
    border-top: 1px solid var(--kw-rule);
    display: flex; align-items: center; justify-content: space-between;
  }
  .kw-city-count {
    font-size: 12px; font-weight: 700;
    color: var(--kw-ink-3);
    letter-spacing: .04em;
  }
  .kw-city-cta {
    font-size: 13px; font-weight: 700;
    color: var(--kw-accent);
    white-space: nowrap;
  }
  .kw-city-cta:hover { text-decoration: underline; text-underline-offset: 3px; }
  .kw-pkg-cta:hover {
    background: var(--kw-accent);
    transform: translateY(-1px);
  }
  .kw-pkg.is-selected .kw-pkg-cta {
    background: var(--kw-accent-soft);
    color: var(--kw-accent);
    box-shadow: inset 0 0 0 1.5px var(--kw-accent);
  }
  .kw-pkg.is-selected .kw-pkg-cta:hover {
    background: var(--kw-accent); color: #fff;
  }

  /* Per-package palettes */
  .kw-pkg-classic   { --photo-a:#f0e5d0; --photo-b:#c4a16b; --photo-c:#7a4a2a; --photo-fg:#2a1a0a; }
  .kw-pkg-kwave     { --photo-a:#e8d4e6; --photo-b:#b87cc4; --photo-c:#5a1a78; --photo-fg:#2a0a3e; }
  .kw-pkg-quiet     { --photo-a:#d2dcc4; --photo-b:#7a8e62; --photo-c:#3a4628; --photo-fg:#1a2410; }

  /* Package card foot — replaces the button with a CTA link (clicking the
     card itself opens the detail drawer). */
  .kw-pkg-cta-link {
    font-size: 13px; font-weight: 700;
    color: var(--kw-accent);
    white-space: nowrap;
    letter-spacing: -0.005em;
  }
  .kw-pkg:hover .kw-pkg-cta-link { text-decoration: underline; text-underline-offset: 3px; }

  /* Package detail drawer — hero block + "What's inside" experiences grid */
  .kw-pkg-detail-hero {
    margin-bottom: 40px;
  }
  .kw-pkg-detail-hero .kw-detail-title {
    font-family: 'Playfair Display', serif;
    font-size: 44px; line-height: 1.08;
    letter-spacing: -0.02em;
    margin: 0 0 18px;
  }
  .kw-pkg-detail-hero .kw-detail-tagline {
    font-size: 19px; line-height: 1.55;
    color: var(--kw-ink-2);
    max-width: 70ch;
  }

  /* Trip itinerary — two rows of 5 days connected by a meandering pink road.
     Row 1: chips on top, stops below. Row 2: stops above, chips on bottom
     (column-reverse). A right-edge U-curve joins the two chip rails so the
     trip reads Day 1 (top-left) → Day 5 (top-right) → U → Day 6 (bot-right)
     → Day 10 (bot-left). */
  .kw-itin {
    position: relative;
    display: flex; flex-direction: column;
    gap: 36px;
    padding: 8px 40px 8px 0;   /* right gutter holds the U-curve */
  }
  /* Right-edge U-curve connecting row 1 chip rail (top) to row 2 chip rail
     (bottom). Built from three borders + elliptical radii so it stays crisp
     at any width and follows the actual chip Y positions exactly. */
  .kw-itin::after {
    content: "";
    position: absolute;
    right: 4px;
    top: 30px;       /* row 1 chip vertical centre (8 padding + 22 chip half) */
    bottom: 30px;    /* row 2 chip vertical centre from bottom */
    width: 36px;
    border-top:    4px solid rgba(178,20,100,.55);
    border-right:  4px solid rgba(178,20,100,.55);
    border-bottom: 4px solid rgba(178,20,100,.55);
    border-left: none;
    border-radius: 0 50% 50% 0 / 0 50% 50% 0;
    pointer-events: none;
    z-index: 0;
  }
  .kw-itin-row {
    position: relative;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 14px;
  }
  /* Each row carries its own horizontal pink rail through the chip centre. */
  .kw-itin-row::before {
    content: "";
    position: absolute;
    left: 6%; right: -4px;        /* extends to the U-curve start on the right */
    height: 4px;
    background: linear-gradient(90deg,
      rgba(178,20,100,.0)  0%,
      rgba(178,20,100,.55) 12%,
      rgba(178,20,100,.55) 100%);
    border-radius: 999px;
    pointer-events: none;
    z-index: 0;
  }
  .kw-itin-row:first-of-type::before    { top: 22px; }     /* chip centre at row top */
  .kw-itin-row.kw-itin-row-rev::before  { bottom: 22px; }   /* chip centre at row bottom */
  /* Row 2 flips the rail gradient so the colour deepest is on the LEFT
     (where Day 10 sits) — the road fades into the trip's start/end. */
  .kw-itin-row.kw-itin-row-rev::before {
    background: linear-gradient(90deg,
      rgba(178,20,100,.0)  0%,
      rgba(178,20,100,.55) 12%,
      rgba(178,20,100,.55) 100%);
  }
  .kw-itin-day {
    position: relative; z-index: 1;
    display: flex; flex-direction: column;
    align-items: stretch;
    min-width: 0;
  }
  /* Row 2 days: stops above, chip below */
  .kw-itin-row-rev .kw-itin-day {
    flex-direction: column-reverse;
  }
  .kw-itin-row-rev .kw-itin-stops {
    padding-top: 0;
    padding-bottom: 18px;
  }
  .kw-itin-day-chip {
    z-index: 1;
    align-self: center;
    height: 44px;
    min-width: 86px;
    padding: 0 16px;
    border-radius: 999px;
    background: var(--kw-accent);
    color: #fff;
    display: inline-flex; align-items: center; justify-content: center;
    font-family: 'Playfair Display', serif;
    font-style: italic; font-weight: 700;
    font-size: 14px; letter-spacing: .08em;
    text-transform: uppercase;
    box-shadow: 0 4px 14px -4px rgba(178,20,100,.45),
                0 1px 0 rgba(255,255,255,.4) inset;
  }
  .kw-itin-stops {
    list-style: none; margin: 0; padding: 18px 0 0;
    display: flex; flex-direction: column; gap: 10px;
  }
  .kw-itin-stop {
    background: #fff;
    border: 1px solid var(--kw-rule);
    border-radius: 12px;
    padding: 10px 12px;
    display: flex; align-items: flex-start; gap: 10px;
    transition: border-color .15s, box-shadow .15s, transform .15s;
  }
  .kw-itin-stop:hover {
    border-color: rgba(0,0,0,.12);
    box-shadow: 0 4px 14px -6px rgba(0,0,0,.12);
    transform: translateY(-1px);
  }
  .kw-itin-stop-marker {
    flex: none;
    width: 26px; height: 26px;
    border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700;
    line-height: 1;
    margin-top: 1px;
  }
  .kw-itin-stop-text {
    display: flex; flex-direction: column; gap: 2px;
    min-width: 0;
  }
  .kw-itin-stop-name {
    font-size: 13px; font-weight: 700;
    color: var(--kw-ink);
    letter-spacing: -0.005em;
    line-height: 1.25;
  }
  .kw-itin-stop-detail {
    font-size: 10px; font-weight: 600;
    color: var(--kw-ink-3);
    letter-spacing: .04em;
    text-transform: uppercase;
  }

  /* Marker palettes by stop kind */
  .kw-itin-stop-arrival .kw-itin-stop-marker,
  .kw-itin-stop-departure .kw-itin-stop-marker {
    background: var(--kw-ink);
    color: #fff;
    transform: rotate(-30deg);
  }
  .kw-itin-stop-departure .kw-itin-stop-marker {
    transform: rotate(30deg);
  }
  .kw-itin-stop-medical .kw-itin-stop-marker {
    background: var(--kw-accent-soft);
    color: var(--kw-accent);
    font-size: 14px;
  }
  .kw-itin-stop-culture .kw-itin-stop-marker {
    background: var(--kw-bg-warm);
    color: var(--kw-gold);
    font-size: 8px;
  }
  /* Bookend stops get a subtle highlight so the arrival/departure stand out */
  .kw-itin-stop-arrival,
  .kw-itin-stop-departure {
    border-color: var(--kw-ink-3);
    background: var(--kw-bg-soft);
  }
  .kw-itin-stop-medical {
    border-color: var(--kw-accent);
    background: rgba(178,20,100,.04);
  }

  .kw-itin-foot {
    margin: 18px 0 0;
    padding: 12px 16px;
    background: var(--kw-bg-warm);
    border-radius: 12px;
    box-shadow: inset 4px 0 0 var(--kw-accent);
    font-size: 13px; font-weight: 500;
    color: var(--kw-ink-2); line-height: 1.45;
  }

  /* On narrow drawers / mobile, the meander unrolls into a single vertical
     timeline. Both rows stack, chips align to the left, a single vertical
     pink rail runs through them. */
  @media (max-width: 980px) {
    .kw-itin { padding: 0; gap: 18px; }
    .kw-itin::after { display: none; }                       /* hide the U-curve */
    .kw-itin-row::before { display: none; }                  /* hide horizontal rails */
    .kw-itin-row,
    .kw-itin-row-rev {
      grid-template-columns: 1fr;
    }
    .kw-itin-row-rev .kw-itin-day {
      flex-direction: column;                                /* unflip — chip back on top */
    }
    .kw-itin-row-rev .kw-itin-stops {
      padding-top: 18px; padding-bottom: 0;
    }
    /* A single vertical rail behind everything */
    .kw-itin::before {
      content: "";
      position: absolute;
      top: 8%; bottom: 8%;
      left: 22px;
      width: 4px;
      background: linear-gradient(180deg,
        rgba(178,20,100,.0)  0%,
        rgba(178,20,100,.4)  12%,
        rgba(178,20,100,.55) 50%,
        rgba(178,20,100,.4)  88%,
        rgba(178,20,100,.0)  100%);
      pointer-events: none;
    }
    .kw-itin-day { padding-left: 64px; }
    .kw-itin-day-chip {
      position: absolute; left: 0; top: 0;
      align-self: auto;
    }
    .kw-itin-stops { padding-top: 0; }
  }

  /* "Or browse individually" divider */
  .kw-or-divider {
    display: flex; align-items: center; gap: 16px;
    margin: 8px 0 24px;
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 13px;
    color: var(--kw-ink-3);
    letter-spacing: .04em;
  }
  .kw-or-divider::before,
  .kw-or-divider::after {
    content: ""; flex: 1; height: 1px; background: var(--kw-rule);
  }

  /* ════════════════════════════════════════════════════════════════════
     Pagination
     ════════════════════════════════════════════════════════════════════ */
  .kw-pagination {
    grid-column: 1 / -1;
    margin-top: 12px;
    padding: 22px 0 4px;
    display: flex; align-items: center; justify-content: center;
    gap: 6px;
  }
  .kw-pagination-btn {
    height: 38px;
    min-width: 38px;
    padding: 0 12px;
    border-radius: 999px;
    border: 1.5px solid var(--kw-line);
    background: #fff;
    color: var(--kw-ink);
    font-size: 14px; font-weight: 600;
    display: inline-flex; align-items: center; justify-content: center;
    gap: 6px;
    cursor: pointer;
    transition: border-color .15s, background .15s, color .15s;
  }
  .kw-pagination-btn:hover:not(:disabled) {
    border-color: var(--kw-ink);
  }
  .kw-pagination-btn:disabled {
    opacity: .35; cursor: not-allowed;
  }
  .kw-pagination-num {
    background: transparent;
    border: none;
    color: var(--kw-ink-3);
    font-weight: 700;
  }
  .kw-pagination-num:hover { color: var(--kw-ink); }
  .kw-pagination-num.is-active {
    background: var(--kw-ink); color: #fff;
    border-color: var(--kw-ink);
  }
  .kw-pagination-info {
    margin: 0 16px;
    font-size: 13px; font-weight: 500;
    color: var(--kw-ink-3);
  }

  /* ════════════════════════════════════════════════════════════════════
     Basket — same pattern as Step 2
     ════════════════════════════════════════════════════════════════════ */
  .kw-cul-basket {
    grid-column: 1 / -1;
    background: var(--kw-bg-warm);
    border-radius: 20px;
    padding: 22px 26px 24px;
    margin-top: 24px;
    display: flex; flex-direction: column; gap: 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,.04),
                inset 0 1px 0 rgba(255,255,255,.5);
    position: relative;
  }
  .kw-cul-basket::before {
    content: "";
    position: absolute;
    top: 0; left: 26px;
    width: 48px; height: 3px;
    background: var(--kw-accent);
    border-radius: 0 0 3px 3px;
  }
  .kw-basket-head {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 16px;
  }
  .kw-basket-eyebrow {
    font-family: 'Playfair Display', serif;
    font-weight: 700; font-style: italic;
    font-size: 13px; letter-spacing: .18em;
    text-transform: uppercase; color: var(--kw-accent);
  }
  .kw-basket-count {
    color: var(--kw-ink-3); font-weight: 500; font-style: normal;
    letter-spacing: .04em; margin-left: 6px;
  }
  .kw-basket-clear {
    font-size: 13px; font-weight: 600; color: var(--kw-accent);
    cursor: pointer;
  }
  .kw-basket-clear:hover { text-decoration: underline; text-underline-offset: 3px; }
  .kw-basket-items {
    display: flex; flex-wrap: wrap; gap: 10px;
  }
  .kw-basket-item {
    display: flex; align-items: center; gap: 12px;
    background: #fff;
    border: 1px solid var(--kw-rule);
    border-radius: 12px;
    padding: 8px 10px 8px 8px;
    min-width: 0;
    transition: border-color .15s, box-shadow .15s;
  }
  .kw-basket-item:hover {
    border-color: var(--kw-line);
    box-shadow: 0 2px 8px rgba(0,0,0,.05);
  }
  .kw-basket-thumb {
    width: 36px; height: 36px;
    border-radius: 8px;
    background: linear-gradient(135deg, var(--photo-a) 0%, var(--photo-b) 60%, var(--photo-c) 100%);
    display: flex; align-items: center; justify-content: center;
    flex: none;
    font-family: 'Playfair Display', serif;
    font-style: italic; font-weight: 700;
    font-size: 15px; color: var(--photo-fg);
    letter-spacing: -0.02em;
  }
  .kw-basket-item-info {
    display: flex; flex-direction: column; gap: 1px;
    min-width: 0;
  }
  .kw-basket-item-name {
    font-size: 13px; font-weight: 700; color: var(--kw-ink);
    letter-spacing: -0.005em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    max-width: 200px;
  }
  .kw-basket-item-meta {
    font-size: 10px; font-weight: 600; color: var(--kw-ink-3);
    letter-spacing: .01em;
  }
  .kw-basket-item-remove {
    width: 22px; height: 22px; border-radius: 50%;
    background: transparent; border: none;
    color: var(--kw-ink-3);
    font-size: 16px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: background .15s, color .15s;
    margin-left: 2px;
  }
  .kw-basket-item-remove:hover {
    background: var(--kw-accent); color: #fff;
  }
  .kw-basket-add {
    display: inline-flex; align-items: center; gap: 8px;
    height: 52px; padding: 0 18px;
    border-radius: 12px;
    border: 1.5px dashed var(--kw-line);
    color: var(--kw-ink-3);
    font-size: 13px; font-weight: 600;
    transition: border-color .15s, color .15s, background .15s;
  }
  .kw-basket-add:hover {
    border-color: var(--kw-accent); color: var(--kw-accent);
    background: rgba(178,20,100,.04);
  }
  .kw-basket-add-icon {
    width: 20px; height: 20px; border-radius: 50%;
    background: var(--kw-ink-3); color: #fff;
    display: inline-flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 13px;
    transition: background .15s;
  }
  .kw-basket-add:hover .kw-basket-add-icon { background: var(--kw-accent); }

  /* ─── Detail drawer (opens when you click a culture card) ───────── */
  @keyframes kw-scrim-in   { from { opacity: 0; } to { opacity: 1; } }
  @keyframes kw-drawer-in  { from { transform: translateX(100%); } to { transform: translateX(0); } }

  .kw-drawer-scrim {
    position: fixed; inset: 0;
    background: rgba(15, 14, 18, .42);
    backdrop-filter: blur(2px);
    -webkit-backdrop-filter: blur(2px);
    z-index: 90;
    animation: kw-scrim-in .22s ease-out both;
  }
  .kw-drawer {
    position: fixed; top: 0; right: 0; bottom: 0;
    width: 88vw; max-width: 1180px;
    background: #fff;
    z-index: 100;
    display: flex; flex-direction: column;
    box-shadow: -24px 0 60px rgba(0,0,0,.14);
    animation: kw-drawer-in .28s cubic-bezier(.22,.61,.36,1) both;
  }
  .kw-drawer-top {
    flex: none; height: 64px; padding: 0 32px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--kw-rule);
    background: rgba(255,255,255,.92);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
  }
  .kw-drawer-crumb {
    display: flex; align-items: center; gap: 10px;
    font-size: 14px; color: var(--kw-ink-3);
  }
  .kw-drawer-crumb a {
    color: var(--kw-ink-2); text-decoration: none;
    font-weight: 600; transition: color .15s;
  }
  .kw-drawer-crumb a:hover { color: var(--kw-accent); }
  .kw-drawer-crumb-sep { color: var(--kw-line); }
  .kw-drawer-crumb-now { color: var(--kw-ink); font-weight: 600; }
  .kw-drawer-close {
    width: 38px; height: 38px;
    border-radius: 50%; border: 1px solid var(--kw-line);
    background: #fff; color: var(--kw-ink-2);
    font-size: 22px; line-height: 1; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    transition: background .15s, border-color .15s, color .15s;
  }
  .kw-drawer-close:hover {
    background: var(--kw-bg-soft);
    border-color: var(--kw-ink-3); color: var(--kw-ink);
  }
  .kw-drawer-body {
    flex: 1 1 auto; overflow-y: auto;
    padding: 36px 44px 32px;
  }
  .kw-drawer-foot {
    flex: none; padding: 18px 32px;
    border-top: 1px solid var(--kw-rule);
    background: rgba(255,255,255,.96);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    display: flex; align-items: center; justify-content: space-between; gap: 32px;
  }
  .kw-drawer-foot-l { display: flex; flex-direction: column; gap: 4px; }
  .kw-drawer-foot-label {
    font-size: 11px; font-weight: 700;
    letter-spacing: .14em; text-transform: uppercase;
    color: var(--kw-ink-3);
  }
  .kw-drawer-foot-meta {
    font-size: 14px; color: var(--kw-ink-2); font-weight: 500;
  }
  .kw-drawer-foot-r {
    display: flex; align-items: center; gap: 12px;
  }

  /* Detail body — hero / sections / facts / video */
  .kw-detail-hero {
    display: grid;
    grid-template-columns: 1.05fr 1fr;
    gap: 40px;
    margin-bottom: 40px;
    align-items: start;
  }
  .kw-detail-hero-l {
    display: flex; flex-direction: column;
  }
  .kw-detail-eyebrow {
    display: inline-block;
    font-size: 11px; font-weight: 700;
    letter-spacing: .14em; text-transform: uppercase;
    color: var(--kw-accent);
    margin-bottom: 18px;
  }
  .kw-detail-title {
    font-family: 'Playfair Display', serif;
    font-size: 44px; line-height: 1.08;
    letter-spacing: -0.02em;
    color: var(--kw-ink);
    margin: 0 0 20px;
    font-weight: 700;
  }
  .kw-detail-tagline {
    font-size: 20px; line-height: 1.55;
    color: var(--kw-ink-2);
    font-weight: 400;
  }
  .kw-detail-gallery {
    display: flex; flex-direction: column; gap: 10px;
  }
  .kw-detail-hero-photo {
    width: 100%; aspect-ratio: 4 / 3;
    border-radius: 14px;
    background-size: cover; background-position: center;
    background-color: var(--kw-bg-soft);
    box-shadow: 0 1px 6px rgba(0,0,0,.08);
  }
  .kw-detail-thumbs {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  .kw-detail-thumb {
    aspect-ratio: 4 / 3;
    border-radius: 10px;
    border: 2px solid transparent;
    background-size: cover; background-position: center;
    background-color: var(--kw-bg-soft);
    cursor: pointer; padding: 0;
    transition: border-color .15s, transform .15s, box-shadow .15s;
    box-shadow: 0 1px 3px rgba(0,0,0,.06);
  }
  .kw-detail-thumb:hover {
    transform: translateY(-1px);
    box-shadow: 0 3px 8px rgba(0,0,0,.10);
  }
  .kw-detail-thumb.is-active {
    border-color: var(--kw-accent);
    box-shadow: 0 0 0 2px rgba(178,20,100,.18), 0 3px 8px rgba(0,0,0,.10);
  }

  .kw-detail-section { margin-bottom: 40px; }
  .kw-detail-section:last-child { margin-bottom: 8px; }
  .kw-detail-h3 {
    font-family: 'Playfair Display', serif;
    font-size: 26px; font-weight: 700;
    color: var(--kw-ink);
    margin: 0 0 18px;
    letter-spacing: -0.01em;
  }

  .kw-detail-facts {
    border-top: 1px solid var(--kw-rule);
    margin: 32px 0 0;
  }
  .kw-detail-fact-row {
    display: grid;
    grid-template-columns: 120px 1fr;
    column-gap: 32px;
    align-items: baseline;
    padding: 16px 0;
    border-bottom: 1px solid var(--kw-rule);
  }
  .kw-detail-fact-row dt {
    font-size: 11px; font-weight: 700;
    letter-spacing: .14em; text-transform: uppercase;
    color: var(--kw-ink-3);
    line-height: 1.4;
    margin: 0;
  }
  .kw-detail-fact-row dd {
    font-size: 15px; line-height: 1.55;
    letter-spacing: -0.003em;
    color: var(--kw-ink);
    margin: 0;
  }

  .kw-detail-video {
    position: relative;
    width: 100%; aspect-ratio: 16 / 9;
    border-radius: 14px; overflow: hidden;
    background: #000;
    box-shadow: 0 4px 18px rgba(0,0,0,.12);
  }
  .kw-detail-video iframe {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    border: 0;
  }
  .kw-detail-video-caption {
    margin-top: 10px;
    font-size: 13px; color: var(--kw-ink-3);
    text-align: right;
  }

  @media (max-width: 900px) {
    .kw-drawer { width: 100vw; }
    .kw-drawer-top { padding: 0 20px; }
    .kw-drawer-body { padding: 24px 20px 20px; }
    .kw-drawer-foot { flex-direction: column; align-items: stretch; gap: 12px; padding: 16px 20px; }
    .kw-detail-hero { grid-template-columns: 1fr; gap: 22px; }
    .kw-detail-title { font-size: 34px; }
    .kw-detail-facts { grid-template-columns: 1fr; }
    .kw-detail-facts dt { padding-bottom: 4px; border-bottom: 0; }
    .kw-detail-facts dd { padding-top: 0; }
  }
</style>
</head>
