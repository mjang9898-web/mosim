<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pay concierge fee — Mosim</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{ --ivory:#F7F2EA; --ivory-soft:#FBF8F2; --navy:#1B2A4A; --navy-soft:#2A3C5E; --gold:#C39A3F; --care:#5C7C63; --ink:#54514B; --ink-2:#8A8479; --line:#E5DBC8; }
    *{ box-sizing:border-box; }
    body{ font-family:'Inter',-apple-system,system-ui,sans-serif; -webkit-font-smoothing:antialiased; font-size:19px; color:var(--navy); margin:0; background:var(--ivory); }
    .brand-top{ display:block; text-align:center; font-family:'Lora',Georgia,serif; font-weight:600; font-size:26px; color:var(--navy); text-decoration:none; padding-top:40px; }
    .brand-top .dot{ color:var(--gold); }
    .wrap{ max-width:560px; margin:24px auto 40px; background:#fff; border:1px solid var(--line); border-radius:18px; padding:32px; box-shadow:0 24px 60px -34px rgba(27,42,74,.4); }
    h1{ font-family:'Lora',Georgia,serif; font-size:25px; font-weight:600; margin:0 0 4px; }
    .muted{ color:var(--ink); }
    .row{ display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--line); }
    .balance{ font-family:'Lora',serif; font-size:28px; font-weight:600; color:var(--navy); }
    label{ display:block; margin:18px 0 6px; font-weight:600; font-size:15px; color:var(--ink-2); }
    input[type=number]{ width:100%; font-size:20px; padding:13px 15px; border:1.5px solid var(--line); border-radius:10px; box-sizing:border-box; font-family:inherit; color:var(--navy); }
    input[type=number]:focus{ outline:none; border-color:var(--gold); }
    #msg{ min-height:1.3em; margin:12px 0; }
    .share{ margin-top:20px; padding-top:16px; border-top:1px solid var(--line); }
    button.copy{ font-size:17px; font-weight:600; padding:11px 18px; border:1.5px solid var(--gold); color:var(--navy); background:#fff; border-radius:10px; cursor:pointer; min-height:44px; }
    button.copy:hover{ background:var(--ivory-soft); }
    .paid{ color:var(--care); font-size:22px; font-weight:700; }
  </style>
</head>
<body>
  <a href="/index.html" class="brand-top">Mosim<span class="dot">.</span></a>
  <div class="wrap">
    <h1>Mosim concierge fee</h1>
    <div class="muted" id="trip">Loading…</div>
    <div id="summary" style="display:none">
      <div class="row"><span>Total</span><span id="total"></span></div>
      <div class="row"><span>Paid so far</span><span id="paid"></span></div>
      <div class="row"><span>Remaining balance</span><span class="balance" id="balance"></span></div>

      <div id="payArea">
        <label for="amount">Amount to pay (USD)</label>
        <input type="number" id="amount" min="1" step="0.01" />
        <div id="msg"></div>
        <div id="paypal-buttons"></div>
      </div>
      <div id="paidArea" style="display:none" class="paid">Fully paid ✓ — thank you!</div>

      <div class="share">
        <div class="muted">Sharing the cost? Send this link to the others paying:</div>
        <button class="copy" id="copyBtn" type="button">Copy payment link</button>
      </div>
    </div>
    <div id="error" style="display:none; color:#A4452F"></div>
  </div>
  <script src="/js/pay.js"></script>
</body>
</html>
