<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>K-Wellness Concierge — Step 1 · Trip</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Nanum+Myeongjo:wght@400;700;800&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,700&display=swap" rel="stylesheet" />
<style>
  /* ════════════════════════════════════════════════════════════════════
     K-Wellness · Step 1 Trip · shared visual system
     Inherits the landing page's senior-friendly Apple-style tokens.
     Scoped to .kw- prefix so it can't collide with design_canvas chrome.
     ════════════════════════════════════════════════════════════════════ */
  :root {
    --kw-bg: #ffffff;
    --kw-bg-soft: #f5f5f7;
    --kw-bg-warm: #f0eee9;
    --kw-ink: #1d1d1f;
    --kw-ink-2: #2a2a2c;
    --kw-ink-3: #4a4a4d;
    --kw-line: #d2d2d7;
    --kw-rule: #e8e8ed;
    --kw-accent: #B21464;
    --kw-accent-deep: #8a0e4d;
    --kw-accent-soft: rgba(178,20,100,.08);
    --kw-gold: #b48a3a;
  }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
                 Inter, "Helvetica Neue", Arial, sans-serif;
    font-size: 19px;
    line-height: 1.5;
    font-weight: 500;
    color: var(--kw-ink);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  /* Inside an artboard, paint our own background */
  .kw-screen { background: var(--kw-bg); color: var(--kw-ink); position: relative; min-height: 100%; }
  .kw-screen * { box-sizing: border-box; }
  .kw-screen a { color: inherit; text-decoration: none; }
  /* Specificity rescue: .kw-screen a outranks .kw-cta, so reassert. */
  .kw-screen a.kw-cta { color: #fff; }
  .kw-screen a.kw-cta.kw-cta-ghost { color: var(--kw-ink); }
  .kw-screen button { font: inherit; cursor: pointer; }
  .kw-screen ul { list-style: none; margin: 0; padding: 0; }
  .kw-screen input, .kw-screen textarea {
    font: inherit; color: inherit;
    background: transparent; border: none; outline: none;
  }
  .kw-screen .hangul {
    font-family: 'Nanum Myeongjo', serif;
    font-weight: 700;
    letter-spacing: .04em;
  }

  /* ── Nav ─────────────────────────────────────────────────────────── */
  .kw-nav {
    position: sticky; top: 0; z-index: 50;
    background: rgba(255, 255, 255, .82);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid var(--kw-rule);
    height: 68px;
  }
  .kw-nav-inner {
    height: 100%;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 32px;
    max-width: 1440px; margin: 0 auto;
  }
  .kw-brand { display: flex; align-items: center; gap: 12px; }
  .kw-brand .kw-wm {
    font-weight: 700; font-size: 19px; letter-spacing: -0.01em; color: var(--kw-ink);
  }
  .kw-navlist {
    display: flex; gap: 22px;
    font-size: 14px; font-weight: 600;
  }
  .kw-navlist a {
    color: var(--kw-ink); padding: 6px 0; transition: color .15s;
    position: relative;
  }
  .kw-navlist a:hover { color: var(--kw-accent); }
  .kw-navlist a.is-active { color: var(--kw-accent); }
  .kw-navlist a.is-active::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: -4px;
    height: 2px; background: var(--kw-accent); border-radius: 2px;
  }
  .kw-nav-right { display: flex; align-items: center; gap: 18px; }
  .kw-link-q {
    font-size: 14px; font-weight: 600; color: var(--kw-ink);
  }
  .kw-cta {
    display: inline-flex; align-items: center; gap: 8px;
    height: 50px;
    padding: 0 28px;
    border-radius: 999px;
    background: var(--kw-accent);
    color: #fff;
    font-weight: 600;
    font-size: 17px;
    border: none;
    transition: background .2s, transform .1s;
    white-space: nowrap;
  }
  .kw-cta:hover { background: var(--kw-accent-deep); }
  .kw-cta-sm { height: 38px; padding: 0 18px; font-size: 14px; }
  .kw-cta-lg { height: 62px; padding: 0 38px; font-size: 19px; }
  .kw-cta-ghost {
    background: transparent; color: var(--kw-ink);
    border: 1.5px solid var(--kw-line);
  }
  .kw-cta-ghost:hover { background: var(--kw-bg-soft); }
  .kw-cta-dark { background: var(--kw-ink); }
  .kw-cta-dark:hover { background: #000; }

  /* ── Step bar (5 main steps) ─────────────────────────────────────── */
  .kw-stepbar-horizontal {
    display: flex; align-items: center; gap: 0;
    padding: 28px 0;
  }
  .kw-step {
    display: inline-flex; align-items: center; gap: 10px;
    flex: none;
  }
  .kw-step-num {
    width: 28px; height: 28px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; letter-spacing: .04em;
    border: 1.5px solid var(--kw-line);
    color: var(--kw-ink-3);
    background: #fff;
  }
  .kw-step-label {
    font-size: 14px; font-weight: 600;
    color: var(--kw-ink-3);
    letter-spacing: -.005em;
  }
  .kw-step-active .kw-step-num {
    background: var(--kw-accent); color: #fff; border-color: var(--kw-accent);
  }
  .kw-step-active .kw-step-label { color: var(--kw-ink); }
  .kw-step-done .kw-step-num {
    background: var(--kw-ink); color: #fff; border-color: var(--kw-ink);
    font-size: 13px;
  }
  .kw-step-done .kw-step-label { color: var(--kw-ink); }
  .kw-step-rule {
    flex: 1 1 auto; min-width: 24px;
    height: 1.5px; background: var(--kw-rule);
    margin: 0 14px;
  }

  /* ── Eyebrow (section label) ─────────────────────────────────────── */
  .kw-eyebrow {
    display: inline-flex; align-items: baseline; gap: 12px;
    color: var(--kw-accent);
  }
  .kw-eyebrow-num {
    font-family: 'Nanum Myeongjo', serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: .08em;
  }
  .kw-eyebrow-text {
    font-size: 13px; font-weight: 700;
    letter-spacing: .14em;
    text-transform: uppercase;
  }

  /* ── Inputs (text, textarea) ─────────────────────────────────────── */
  .kw-input {
    display: block; width: 100%;
    height: 56px;
    padding: 0 18px;
    background: #fff;
    border: 1.5px solid var(--kw-line);
    border-radius: 12px;
    font-size: 17px; font-weight: 500;
    color: var(--kw-ink);
    transition: border-color .15s, box-shadow .15s;
  }
  .kw-input:hover { border-color: var(--kw-ink-3); }
  .kw-input:focus { border-color: var(--kw-accent); box-shadow: 0 0 0 3px var(--kw-accent-soft); }
  .kw-input::placeholder { color: var(--kw-ink-3); font-weight: 500; }
  .kw-textarea {
    display: block; width: 100%;
    min-height: 120px;
    padding: 14px 18px;
    background: #fff;
    border: 1.5px solid var(--kw-line);
    border-radius: 12px;
    font-size: 17px; font-weight: 500;
    color: var(--kw-ink);
    resize: vertical;
    line-height: 1.5;
  }
  .kw-textarea:focus { border-color: var(--kw-accent); box-shadow: 0 0 0 3px var(--kw-accent-soft); }
  .kw-textarea::placeholder { color: var(--kw-ink-3); }
  .kw-input-helper {
    margin-top: 8px;
    font-size: 13px; font-weight: 500;
    color: var(--kw-ink-3);
  }

  /* Notes card — unified design shared with Medical Step Ⅱ boxes */
  .kw-notes-card {
    background: var(--kw-bg-warm);
    border: 1px solid var(--kw-line);
    border-radius: 18px;
    padding: 20px 22px 22px;
    position: relative;
    box-shadow: inset 4px 0 0 var(--kw-accent);
  }
  .kw-notes-card-head {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px;
    margin-bottom: 14px;
  }
  .kw-notes-card-label {
    display: inline-flex; align-items: center; gap: 10px;
    font-size: 12px; font-weight: 700;
    letter-spacing: .14em;
    color: var(--kw-accent);
    text-transform: uppercase;
  }
  .kw-notes-card-label .kw-notes-card-pen {
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--kw-accent); color: #fff;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700;
  }
  .kw-notes-card-secure {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11px; font-weight: 600;
    color: var(--kw-ink-3);
    letter-spacing: .04em;
  }
  .kw-notes-card .kw-textarea {
    background: #fff;
    border: 1.5px solid var(--kw-line);
    border-radius: 12px;
    min-height: 160px;
    padding: 18px 20px;
    font-size: 17px;
    color: var(--kw-ink);
    line-height: 1.5;
  }
  .kw-notes-card .kw-textarea:focus {
    border-color: var(--kw-accent);
    box-shadow: 0 0 0 3px var(--kw-accent-soft);
  }
  .kw-notes-card-foot {
    margin-top: 12px;
    font-size: 12px; font-weight: 500;
    color: var(--kw-ink-3);
  }
  /* Example placeholder clears the moment the box is clicked */
  .kw-textarea:focus::placeholder { color: transparent; }

  /* Calendar — interactive states */
  .kw-cal-day.kw-pick { cursor: pointer; }
  .kw-cal-day.kw-pick:hover { background: var(--kw-accent-soft); color: var(--kw-accent); }
  .kw-cal-day.kw-cal-past { color: var(--kw-line); cursor: default; }
  .kw-cal-nav {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 14px;
  }
  .kw-cal-arrow {
    width: 36px; height: 36px; border-radius: 50%;
    border: 1.5px solid var(--kw-line); background: #fff;
    color: var(--kw-ink); font-size: 18px; line-height: 1;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: border-color .15s, color .15s;
  }
  .kw-cal-arrow:hover:not(:disabled) { border-color: var(--kw-accent); color: var(--kw-accent); }
  .kw-cal-arrow:disabled { opacity: .3; cursor: not-allowed; }

  /* "I'm flexible" — AI recommendation message */
  .kw-flex-msg {
    background: var(--kw-accent-soft);
    border: 1.5px solid var(--kw-accent);
    border-radius: 14px;
    padding: 20px 22px;
  }

  /* Airport search w/ inline results — booking-site style */
  .kw-airport-search {
    background: #fff;
    border: 1.5px solid var(--kw-line);
    border-radius: 14px;
    overflow: hidden;
    transition: border-color .15s, box-shadow .15s;
  }
  .kw-airport-search:focus-within {
    border-color: var(--kw-accent);
    box-shadow: 0 0 0 3px var(--kw-accent-soft);
  }
  .kw-airport-field {
    display: flex; align-items: center; gap: 12px;
    padding: 0 16px 0 20px;
    height: 60px;
    border-bottom: 1px solid var(--kw-rule);
  }
  .kw-airport-icon { color: var(--kw-accent); flex: none; }
  .kw-airport-input {
    flex: 1; height: 100%; min-width: 0;
    background: transparent; border: none; outline: none;
    font: inherit;
    font-size: 18px; font-weight: 600;
    color: var(--kw-ink);
  }
  .kw-airport-input::placeholder { color: var(--kw-ink-3); font-weight: 500; }
  .kw-airport-clear {
    width: 26px; height: 26px; border-radius: 50%;
    background: var(--kw-bg-soft);
    color: var(--kw-ink-3);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; line-height: 1; cursor: pointer;
    flex: none;
  }
  .kw-airport-results { background: #fff; }
  .kw-airport-row {
    display: grid;
    grid-template-columns: 60px 1fr auto;
    align-items: center;
    gap: 16px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--kw-rule);
    position: relative;
    cursor: pointer;
    transition: background .12s;
  }
  .kw-airport-row:last-child { border-bottom: none; }
  .kw-airport-row:hover { background: var(--kw-bg-soft); }
  .kw-airport-row.is-selected { background: var(--kw-accent-soft); }
  .kw-airport-row-head {
    cursor: default;
    background: var(--kw-bg-soft);
    grid-template-columns: 1fr auto;
    padding: 10px 20px;
    font-size: 12px; font-weight: 700;
    color: var(--kw-ink-3);
    letter-spacing: .04em;
  }
  .kw-airport-row-head:hover { background: var(--kw-bg-soft); }
  .kw-airport-row-head b { color: var(--kw-ink); font-weight: 700; }
  .kw-airport-code {
    font-family: 'Inter', sans-serif;
    font-size: 18px; font-weight: 800;
    color: var(--kw-ink);
    letter-spacing: .06em;
    background: var(--kw-bg-soft);
    border-radius: 8px;
    padding: 6px 8px;
    text-align: center;
    border: 1px solid var(--kw-rule);
  }
  .kw-airport-row.is-selected .kw-airport-code {
    background: var(--kw-accent);
    color: #fff;
    border-color: var(--kw-accent);
  }
  .kw-airport-name {
    display: flex; flex-direction: column; gap: 2px;
    font-size: 16px; font-weight: 700;
    color: var(--kw-ink);
    line-height: 1.25;
  }
  .kw-airport-hint {
    font-size: 12px; font-weight: 500;
    color: var(--kw-ink-3);
  }
  .kw-airport-dist {
    font-size: 13px; font-weight: 600;
    color: var(--kw-ink-3);
    text-align: right;
    white-space: nowrap;
  }
  .kw-airport-row.is-selected .kw-airport-dist { color: var(--kw-accent); }
  .kw-airport-check {
    position: absolute; right: 18px; top: 50%; transform: translateY(-50%);
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--kw-accent); color: #fff;
    display: none;
  }

  /* Segmented control (yes/no, fixed/flexible) */
  .kw-segmented {
    display: inline-flex;
    background: var(--kw-bg-soft);
    padding: 4px;
    border-radius: 12px;
    gap: 4px;
  }
  .kw-segmented button {
    height: 44px;
    padding: 0 22px;
    border: none;
    border-radius: 9px;
    background: transparent;
    font-size: 15px; font-weight: 600;
    color: var(--kw-ink-3);
    transition: background .15s, color .15s, box-shadow .15s;
  }
  .kw-segmented button.is-active {
    background: #fff;
    color: var(--kw-ink);
    box-shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 0 rgba(0,0,0,.04);
  }

  /* ── Inline 2-month calendar ─────────────────────────────────────── */
  .kw-cal {
    display: grid; grid-template-columns: 1fr 1fr; gap: 36px;
    background: #fff;
  }
  .kw-cal-month {}
  .kw-cal-month-title {
    font-size: 18px; font-weight: 700;
    color: var(--kw-ink);
    text-align: center;
    margin-bottom: 16px;
    letter-spacing: -0.01em;
  }
  .kw-cal-dow {
    display: grid; grid-template-columns: repeat(7, 1fr);
    margin-bottom: 6px;
  }
  .kw-cal-dow span {
    text-align: center;
    font-size: 11px; font-weight: 700;
    color: var(--kw-ink-3);
    letter-spacing: .08em;
    text-transform: uppercase;
  }
  .kw-cal-grid {
    display: grid; grid-template-columns: repeat(7, 1fr);
    row-gap: 4px;
  }
  .kw-cal-day {
    aspect-ratio: 1 / 1;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 500;
    color: var(--kw-ink-2);
    border-radius: 8px;
    position: relative;
  }
  .kw-cal-blank { color: transparent; }
  .kw-cal-day.kw-cal-in {
    background: var(--kw-accent-soft);
    color: var(--kw-accent);
    border-radius: 0;
    font-weight: 600;
  }
  .kw-cal-day.kw-cal-start, .kw-cal-day.kw-cal-end {
    background: var(--kw-accent);
    color: #fff;
    font-weight: 700;
  }
  .kw-cal-day.kw-cal-start { border-radius: 999px 0 0 999px; }
  .kw-cal-day.kw-cal-end   { border-radius: 0 999px 999px 0; }
  /* Apple-style "Sunday red" hint */
  .kw-cal-dow span:first-child { color: #c0394b; }

  /* ── Logo cards (airline / hotel grid) ───────────────────────────── */
  .kw-logo-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
  }
  .kw-logo-grid.kw-cols-4 { grid-template-columns: repeat(4, 1fr); }
  .kw-logo-grid.kw-cols-3 { grid-template-columns: repeat(3, 1fr); }
  .kw-logo {
    position: relative;
    background: #fff;
    border: 1.5px solid var(--kw-line);
    border-radius: 14px;
    padding: 14px 12px 12px;
    text-align: center;
    display: flex; flex-direction: column; align-items: stretch; gap: 8px;
    transition: border-color .15s, transform .15s, box-shadow .15s;
    cursor: pointer;
  }
  .kw-logo:hover {
    border-color: var(--kw-ink);
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(0,0,0,.05);
  }
  .kw-logo.is-selected {
    border-color: var(--kw-accent);
    box-shadow: 0 0 0 3px var(--kw-accent-soft);
  }
  .kw-logo-mark {
    height: 56px;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--kw-rule);
  }
  .kw-logo-air {
    font-family: 'Inter', sans-serif;
    font-weight: 800;
    font-size: 19px;
    letter-spacing: 0.04em;
  }
  .kw-logo-img {
    max-width: 84%;
    max-height: 38px;
    width: auto; height: auto;
    object-fit: contain;
    display: block;
  }
  .kw-logo-hotel {
    font-family: 'Nanum Myeongjo', serif;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }
  .kw-logo-name {
    font-size: 12px; font-weight: 600;
    color: var(--kw-ink-2);
    line-height: 1.2;
  }
  .kw-logo-check {
    position: absolute; top: -8px; right: -8px;
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--kw-accent); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700;
    box-shadow: 0 2px 6px rgba(178,20,100,.4);
  }

  /* ── Party-type cards ────────────────────────────────────────────── */
  .kw-party-grid {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px;
  }
  .kw-party {
    background: #fff;
    border: 1.5px solid var(--kw-line);
    border-radius: 16px;
    padding: 20px 16px 18px;
    text-align: left;
    display: flex; flex-direction: column; gap: 14px;
    cursor: pointer;
    transition: border-color .15s, transform .15s;
    min-height: 168px;
  }
  .kw-party:hover {
    border-color: var(--kw-ink);
    transform: translateY(-1px);
  }
  .kw-party.is-selected {
    border-color: var(--kw-accent);
    background: var(--kw-accent-soft);
    box-shadow: 0 0 0 3px var(--kw-accent-soft);
  }
  .kw-party-icon { width: 36px; height: 36px; }
  .kw-party-label {
    font-size: 18px; font-weight: 700;
    color: var(--kw-ink);
    letter-spacing: -0.01em;
  }
  .kw-party-sub {
    font-size: 13px; font-weight: 500;
    color: var(--kw-ink-3);
    line-height: 1.35;
    margin-top: -8px;
  }

  /* ── Stepper (adults/children count) ─────────────────────────────── */
  .kw-stepper {
    display: flex; align-items: center; justify-content: space-between;
    background: #fff;
    border: 1.5px solid var(--kw-line);
    border-radius: 12px;
    padding: 16px 18px;
  }
  .kw-stepper-info {}
  .kw-stepper-label {
    font-size: 17px; font-weight: 700;
    color: var(--kw-ink);
  }
  .kw-stepper-hint {
    font-size: 13px; font-weight: 500;
    color: var(--kw-ink-3);
    margin-top: 2px;
  }
  .kw-stepper-ctrl {
    display: flex; align-items: center; gap: 14px;
  }
  .kw-stepper-btn {
    width: 36px; height: 36px;
    border-radius: 50%;
    border: 1.5px solid var(--kw-line);
    background: #fff;
    color: var(--kw-ink);
    font-size: 18px; font-weight: 500;
    display: flex; align-items: center; justify-content: center;
    transition: border-color .15s, background .15s, color .15s;
  }
  .kw-stepper-btn:hover:not(:disabled) {
    border-color: var(--kw-accent); color: var(--kw-accent);
  }
  .kw-stepper-btn:disabled {
    opacity: .35; cursor: not-allowed;
  }
  .kw-stepper-val {
    min-width: 22px; text-align: center;
    font-size: 19px; font-weight: 700;
    color: var(--kw-ink);
  }

  /* ── Page wrapper (per-variation container) ──────────────────────── */
  .kw-wrap {
    max-width: 1240px;
    margin: 0 auto;
    padding: 0 40px;
  }
  .kw-wrap-narrow {
    max-width: 980px;
    margin: 0 auto;
    padding: 0 40px;
  }

  /* ── Page hero (section breadcrumb + title) ──────────────────────── */
